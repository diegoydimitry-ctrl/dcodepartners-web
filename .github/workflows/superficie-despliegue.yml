name: Superficie y sistema de diseño

# Falla si un fichero interno (docs, scripts, .github, automation, *.md, *.yml,
# workflows de n8n…) entraría en el despliegue de Vercel. Aplica la misma lógica
# que @vercel/client sobre `git ls-files` + .vercelignore. No necesita red ni
# secretos. Ver scripts/check-deploy-surface.mjs.
on:
  push:
  pull_request:

jobs:
  superficie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Comprobar superficie de despliegue
        run: npm run check:superficie
      - name: Comprobar enlaces internos, idiomas, sitemap y JSON-LD
        run: npm run check:enlaces

      # El asistente responde con lo que dice este JSON, y en un despliegue no
      # se regenera nada: lo que se sirve es el fichero del repositorio.
      - name: Comprobar que el asistente sabe lo que dice la web
        run: npm run check:kb

      # El consentimiento y la analitica son mecanismos con efectos legales y
      # con efectos sobre el dato: no pueden volver a ejecutarse fuera del
      # dominio real, ni la analitica por delante del consentimiento.
      - name: Comprobar la carga de consentimiento y analitica
        run: npm run check:consentimiento

  diseno:
    # Las reglas del D-Code Design System en las 72 páginas y a los cinco
    # anchos de referencia: sin scroll horizontal, un solo fondo, el cian
    # nunca en algo clicable, nada de texto bajo 12 px que no sea etiqueta en
    # mayúsculas, 44 px de objetivo táctil medido con elementFromPoint (no con
    # la caja visible), campos con nombre accesible y consola limpia.
    # Levanta el sitio como lo sirve Vercel; no necesita red ni secretos.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Conformidad con el sistema de diseño
        run: npm run qa:ds
