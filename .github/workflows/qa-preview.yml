name: QA Preview vs Production

# DIR-054-v2 (Fase 5): cierra el ciclo PREVIEW OK -> QA automático ->
# PRODUCTION -> SMOKE TEST PRODUCTION -> OK que pidió Dirección.
#
# El entorno donde se generó este workflow no tiene acceso saliente a
# Internet (egress bloqueado a nivel de proxy), así que no pudo
# ejecutarse contra la Preview real ni contra dcodepartners.com desde
# ahí, y por lo tanto tampoco pudo disparar un run real de este
# workflow para confirmar en vivo que el job "qa-preview" resuelve
# correctamente la URL de Preview de Vercel. Un runner de GitHub
# Actions SÍ tiene acceso normal a Internet, así que aquí es donde
# este guardrail se ejecuta de verdad — pero la resolución de la URL
# de Preview (paso "Esperar y resolver...") debe verificarse en el
# primer PR real: revisa el log de ese paso y, si "environment_url"
# no trae la URL esperada, ajusta el jq de ese paso según lo que
# devuelva realmente `gh api repos/OWNER/REPO/deployments` en este
# repo (la API de Deployments de GitHub es pública y estable, pero su
# forma exacta no se pudo confirmar en vivo desde este entorno). El
# job "smoke-test" (workflow_dispatch) es la vía de respaldo: se
# puede lanzar a mano contra cualquier URL, incluida Production.
#
# HALLAZGO CONFIRMADO EN VIVO (misión chatbot, 24/08/2026) — AVISO PARA
# QUIEN LEA ESTO A CONTINUACIÓN: el proyecto de Vercel tiene "Vercel
# Authentication" (SSO) activado en TODOS los dominios *.vercel.app
# (Project Settings → Deployment Protection; solo los dominios propios
# quedan exentos). La URL que resuelve el paso de más abajo
# (environment_url de la API de Deployments de GitHub) SIGUE estando
# protegida por ese SSO — comprobado en vivo: un navegador real
# (Playwright, sin sesión de Vercel) que abre esa URL aterriza en la
# pantalla de login de Vercel, no en el sitio. El job "qa-preview" NO
# lo detecta como fallo (sus comprobaciones son: recursos rotos del
# propio origen, errores de consola, overflow horizontal y la forma de
# unos selectores concretos — nada de eso salta en la pantalla de login
# de Vercel, así que un run entero puede reportar "0 problemas" sin
# haber visto el sitio real ni una sola vez). Esto es anterior a la
# misión del chatbot, no algo introducido aquí, y arreglarlo de verdad
# requiere una de estas dos cosas — ninguna disponible desde una sesión
# de Claude Code sin acceso al dashboard de Vercel:
#   1. Configurar "Protection Bypass for Automation" en el proyecto de
#      Vercel y guardar ese secreto como GH secret (p. ej.
#      VERCEL_AUTOMATION_BYPASS_SECRET), añadiendo la cabecera
#      `x-vercel-protection-bypass: <secreto>` a cada petición de
#      Playwright en qa-preview-check.js y qa-preview-chat-check.js.
#   2. Desactivar Vercel Authentication para Preview Deployments (no
#      recomendable: expondría todas las Previews públicamente).
# Hasta que se configure la opción 1, tanto "qa-preview" como
# "chat-smoke-test" pueden dar un falso "todo OK" sin haber probado
# nada real — trátese como pendiente de verificación manual (un humano
# con sesión de Vercel abierta en el navegador) hasta entonces.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: 'URL a comprobar (smoke test manual, ej. contra Production tras un merge)'
        required: true
        default: 'https://dcodepartners.com'

jobs:
  # AUD-DCP 23/08/2026 (ronda 2): las pruebas unitarias de test/ (fetch/
  # Resend mockeados, sin red — failover de proveedores del chatbot,
  # saneado de historial, contact-fallback...) existían y pasaban en
  # local, pero ningún check de CI las ejecutaba nunca: un PR podía
  # fusionarse con esas pruebas rotas sin que nada lo detectara. Job
  # aparte y sin dependencia de `qa-preview` (que sí necesita red/Vercel/
  # Playwright) para que un fallo aquí se vea en segundos, no tras ~10
  # minutos de sondeo del deployment.
  unit-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pruebas unitarias (fetch/Resend mockeados, sin llamadas reales)
        run: npm test

  qa-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Esperar y resolver la URL de Preview de Vercel para este commit
        id: preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          SHA="${{ github.event.pull_request.head.sha }}"
          echo "Buscando deployment de Vercel para $SHA..."
          for i in $(seq 1 40); do
            DEPLOY_ID=$(gh api "repos/${{ github.repository }}/deployments?sha=$SHA&environment=Preview" \
              --jq '.[0].id' 2>/dev/null || echo "")
            if [ -n "$DEPLOY_ID" ] && [ "$DEPLOY_ID" != "null" ]; then
              STATE=$(gh api "repos/${{ github.repository }}/deployments/$DEPLOY_ID/statuses" \
                --jq '.[0].state' 2>/dev/null || echo "")
              # environment_url es el campo pensado para la URL real del
              # entorno desplegado (a diferencia de target_url, que en
              # los commit status de Vercel apunta al dashboard de
              # inspección, no al sitio en sí).
              ENV_URL=$(gh api "repos/${{ github.repository }}/deployments/$DEPLOY_ID/statuses" \
                --jq '.[0].environment_url' 2>/dev/null || echo "")
              if [ "$STATE" = "success" ] && [ -n "$ENV_URL" ] && [ "$ENV_URL" != "null" ]; then
                echo "preview_url=$ENV_URL" >> "$GITHUB_OUTPUT"
                echo "Preview lista: $ENV_URL"
                exit 0
              fi
            fi
            echo "  intento $i/40: deployment todavía no listo, esperando 15s..."
            sleep 15
          done
          echo "No se pudo resolver una Preview lista tras esperar. Revisa el deployment de Vercel manualmente en este PR." >&2
          exit 1

      - name: Ejecutar QA contra la Preview
        run: node scripts/qa-preview-check.js "${{ steps.preview.outputs.preview_url }}"

  smoke-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar QA contra la URL indicada
        run: node scripts/qa-preview-check.js "${{ inputs.url }}"

  # Prueba real obligatoria del chatbot (mandato P0 "MISIÓN EXCLUSIVA
  # CHATBOT WEB", sección 15). INTENTO 1: contra el alias estable de
  # rama (dcodepartners-web-git-<rama>-...vercel.app) — falló,
  # page.click('#chat-bubble') nunca encuentra el elemento porque esa
  # URL está protegida por Vercel Authentication (SSO) y la página real
  # es el login de Vercel. INTENTO 2 (este código): resolver en su
  # lugar la URL efímera por commit vía "environment_url" de la API de
  # Deployments de GitHub, igual que hace qa-preview más arriba —
  # TAMBIÉN falló con el mismo timeout: esa URL sigue protegida por el
  # mismo SSO, confirmado en vivo (ver el aviso grande al principio de
  # este archivo). No hay, desde esta sesión, ninguna URL que se salte
  # esa protección sin un secreto de bypass que no está configurado.
  # Este job se deja tal cual (workflow_dispatch, no bloquea nada) para
  # que funcione en cuanto exista ese secreto — ver el aviso al
  # principio del archivo para cómo añadirlo. Hasta entonces, fallará
  # de la misma forma si se lanza contra una Preview; sí sirve ya para
  # apuntar contra Production (dominio propio, sin SSO) una vez mergeado.
  # Se lanza a mano con:
  #   gh workflow run "QA Preview vs Production" -f url=https://...
  chat-smoke-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Resolver la URL del deployment de Vercel para este commit (sigue sujeta a Vercel Authentication), si existe
        id: preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          URL="${{ inputs.url }}"
          for i in $(seq 1 20); do
            DEPLOY_ID=$(gh api "repos/${{ github.repository }}/deployments?sha=$SHA&environment=Preview" \
              --jq '.[0].id' 2>/dev/null || echo "")
            if [ -n "$DEPLOY_ID" ] && [ "$DEPLOY_ID" != "null" ]; then
              STATE=$(gh api "repos/${{ github.repository }}/deployments/$DEPLOY_ID/statuses" \
                --jq '.[0].state' 2>/dev/null || echo "")
              ENV_URL=$(gh api "repos/${{ github.repository }}/deployments/$DEPLOY_ID/statuses" \
                --jq '.[0].environment_url' 2>/dev/null || echo "")
              if [ "$STATE" = "success" ] && [ -n "$ENV_URL" ] && [ "$ENV_URL" != "null" ]; then
                URL="$ENV_URL"
                break
              fi
            fi
            echo "  intento $i/20: deployment de Vercel para $SHA todavía no listo, esperando 10s..."
            sleep 10
          done
          echo "Usando URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Conversación real + forzar 429 contra el chatbot en la URL resuelta
        run: node scripts/qa-preview-chat-check.js "${{ steps.preview.outputs.url }}"
