<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#121212">
<title>Ribeira Sacra Trip — Mapa</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
  :root{
    --bg:#121212;
    --card:#1E1E1E;
    --card-2:#242424;
    --border:#2E2E2E;
    --text:#F2F2F2;
    --text-dim:#9A9A9A;
    --accent-blue:#00D1FF;
    --accent-green:#2ECC71;
    --neon:#00E676;
    --base:#007AFF;
    --naturaleza:#2ECC71;
    --cuevas:#F39C12;
    --urbex:#E74C3C;
    --visitado:#7F8C8D;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%; margin:0; overscroll-behavior:none;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex;
    flex-direction:column;
    height:100vh;
    width:100vw;
    overflow:hidden;
  }

  /* HEADER */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 14px;
    background:var(--card);
    border-bottom:1px solid var(--border);
    z-index:1200;
    flex-shrink:0;
  }
  header .title{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
    font-size:16px;
    letter-spacing:.2px;
  }
  header .title i{ color:var(--neon); font-size:18px; }
  header .title small{
    display:block;
    font-weight:400;
    color:var(--text-dim);
    font-size:11px;
  }
  .icon-btn{
    background:var(--card-2);
    border:1px solid var(--border);
    color:var(--text);
    width:40px; height:40px;
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    cursor:pointer;
  }
  .icon-btn:active{ background:#2b2b2b; }
  .header-actions{ display:flex; gap:8px; position:relative; }

  /* SETTINGS DROPDOWN */
  #settingsMenu{
    position:absolute;
    top:48px; right:0;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    min-width:220px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    overflow:hidden;
    display:none;
    z-index:1300;
  }
  #settingsMenu.open{ display:block; }
  #settingsMenu button{
    width:100%;
    background:none;
    border:none;
    color:var(--text);
    text-align:left;
    padding:13px 16px;
    font-size:14px;
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    border-bottom:1px solid var(--border);
  }
  #settingsMenu button:last-child{ border-bottom:none; }
  #settingsMenu button:active{ background:var(--card-2); }
  #settingsMenu button i{ width:18px; color:var(--accent-blue); }
  #settingsMenu button.danger i{ color:var(--urbex); }

  /* MAP */
  #map{
    flex:1;
    width:100%;
    background:#0c0c0c;
    z-index:1;
  }
  .leaflet-popup-content-wrapper{
    background:var(--card);
    color:var(--text);
    border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.6);
  }
  .leaflet-popup-tip{ background:var(--card); }
  .leaflet-popup-content{ margin:0; width:260px !important; }
  .leaflet-container a.leaflet-popup-close-button{ color:var(--text-dim); }

  /* CUSTOM MARKERS */
  .custom-marker{
    width:36px; height:36px;
    border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 8px rgba(0,0,0,.6);
    border:2px solid rgba(255,255,255,.85);
  }
  .custom-marker i{
    transform:rotate(45deg);
    color:#fff;
    font-size:15px;
  }
  .custom-marker.visited{ opacity:.55; }

  /* POPUP CONTENT */
  .popup-card{ padding:14px; }
  .popup-badge{
    display:inline-block;
    font-size:10px;
    font-weight:700;
    letter-spacing:.5px;
    text-transform:uppercase;
    padding:3px 9px;
    border-radius:20px;
    margin-bottom:8px;
    color:#fff;
  }
  .popup-title{
    font-size:16px;
    font-weight:700;
    margin:0 0 6px 0;
    line-height:1.25;
  }
  .popup-desc{
    font-size:13px;
    color:var(--text-dim);
    line-height:1.4;
    margin:0 0 12px 0;
  }
  .popup-visited-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--card-2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:9px 12px;
    margin-bottom:10px;
    font-size:13px;
    cursor:pointer;
  }
  .popup-visited-row span{ display:flex; align-items:center; gap:8px; }
  .toggle-switch{
    width:38px; height:22px;
    background:#3a3a3a;
    border-radius:20px;
    position:relative;
    transition:background .2s;
    flex-shrink:0;
  }
  .toggle-switch.on{ background:var(--neon); }
  .toggle-switch::after{
    content:'';
    position:absolute;
    top:2px; left:2px;
    width:18px; height:18px;
    background:#fff;
    border-radius:50%;
    transition:left .2s;
  }
  .toggle-switch.on::after{ left:18px; }
  .popup-nav-row{
    display:flex;
    gap:8px;
    margin-bottom:8px;
  }
  .popup-nav-btn{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:11px 8px;
    border-radius:10px;
    font-size:13px;
    font-weight:700;
    text-decoration:none;
    color:#fff;
    border:none;
  }
  .btn-waze{ background:#33CCFF; color:#062b33; }
  .btn-gmaps{ background:#34A853; }
  .popup-delete-btn{
    width:100%;
    background:none;
    border:1px solid var(--urbex);
    color:var(--urbex);
    padding:9px;
    border-radius:10px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
  }

  /* FABs */
  .fab-stack{
    position:absolute;
    right:16px;
    bottom:22px;
    display:flex;
    flex-direction:column;
    gap:12px;
    z-index:900;
  }
  .fab{
    width:54px; height:54px;
    border-radius:50%;
    border:none;
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.5);
  }
  .fab-gps{ background:var(--card); color:var(--accent-blue); border:1px solid var(--border); }
  .fab-add{ background:var(--neon); color:#0b1f14; }
  .fab:active{ transform:scale(.94); }

  /* DRAWER LIST */
  #drawerOverlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.5);
    z-index:1400;
    display:none;
  }
  #drawerOverlay.open{ display:block; }
  #drawer{
    position:fixed;
    left:0; right:0; bottom:0;
    max-height:78vh;
    background:var(--bg);
    border-top-left-radius:20px;
    border-top-right-radius:20px;
    transform:translateY(100%);
    transition:transform .25s ease;
    z-index:1500;
    display:flex;
    flex-direction:column;
    box-shadow:0 -10px 40px rgba(0,0,0,.6);
  }
  #drawer.open{ transform:translateY(0); }
  .drawer-handle{
    width:40px; height:4px;
    background:#3a3a3a;
    border-radius:4px;
    margin:10px auto 4px;
  }
  .drawer-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:6px 18px 12px;
    border-bottom:1px solid var(--border);
  }
  .drawer-header h2{ font-size:16px; margin:0; }
  .drawer-list{
    overflow-y:auto;
    padding:10px 14px 24px;
  }
  .drawer-cat-title{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.6px;
    color:var(--text-dim);
    margin:16px 6px 8px;
    font-weight:700;
  }
  .drawer-cat-title:first-child{ margin-top:6px; }
  .site-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:11px 12px;
    margin-bottom:8px;
    cursor:pointer;
  }
  .site-item:active{ background:var(--card-2); }
  .site-dot{
    width:34px; height:34px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    font-size:14px;
    flex-shrink:0;
    border:2px solid rgba(255,255,255,.15);
  }
  .site-info{ flex:1; min-width:0; }
  .site-name{
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .site-name i.fa-check-circle{ color:var(--neon); font-size:12px; }
  .site-dist{
    font-size:12px;
    color:var(--text-dim);
    margin-top:2px;
  }
  .site-item .chev{ color:var(--text-dim); font-size:13px; }
  .empty-state{
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    padding:30px 10px;
  }

  /* MODAL */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.6);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:1600;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    background:var(--bg);
    width:100%;
    max-width:520px;
    max-height:88vh;
    overflow-y:auto;
    border-top-left-radius:20px;
    border-top-right-radius:20px;
    padding:18px 18px 26px;
  }
  .modal-box.centered{
    border-radius:18px;
    margin-bottom:auto;
    margin-top:auto;
  }
  .modal-title{
    font-size:17px;
    font-weight:700;
    margin:6px 0 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .modal-title .close-x{
    background:var(--card-2);
    border:1px solid var(--border);
    width:32px; height:32px;
    border-radius:10px;
    color:var(--text-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:6px;
    font-weight:600;
  }
  .field input[type=text], .field input[type=number], .field textarea, .field select{
    width:100%;
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    padding:11px 12px;
    border-radius:10px;
    font-size:14px;
    font-family:inherit;
  }
  .field textarea{ resize:vertical; min-height:64px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .cat-select{ display:flex; gap:8px; flex-wrap:wrap; }
  .cat-chip{
    flex:1;
    min-width:80px;
    text-align:center;
    padding:10px 6px;
    border-radius:10px;
    border:1.5px solid var(--border);
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    color:var(--text-dim);
    background:var(--card);
  }
  .cat-chip.active{ color:#fff; border-color:transparent; }
  .pick-map-btn{
    width:100%;
    background:var(--card-2);
    border:1px dashed var(--accent-blue);
    color:var(--accent-blue);
    padding:11px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:8px;
    cursor:pointer;
    margin-bottom:16px;
  }
  .btn-primary{
    width:100%;
    background:var(--neon);
    color:#0b1f14;
    border:none;
    padding:13px;
    border-radius:12px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-secondary{
    width:100%;
    background:var(--card-2);
    color:var(--text);
    border:1px solid var(--border);
    padding:13px;
    border-radius:12px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    margin-top:10px;
  }

  #pickBanner{
    position:fixed;
    top:70px; left:50%;
    transform:translateX(-50%);
    background:var(--neon);
    color:#0b1f14;
    padding:10px 18px;
    border-radius:30px;
    font-size:13px;
    font-weight:700;
    z-index:1700;
    display:none;
    box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  #pickBanner.open{ display:block; }

  #toast{
    position:fixed;
    bottom:24px; left:50%;
    transform:translateX(-50%);
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    padding:11px 18px;
    border-radius:30px;
    font-size:13px;
    z-index:1800;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s, bottom .25s;
    max-width:88vw;
    text-align:center;
  }
  #toast.show{ opacity:1; bottom:36px; }

  input[type=file]{ display:none; }
</style>
</head>
<body>

<header>
  <div class="title">
    <i class="fa-solid fa-mountain-sun"></i>
    <div>
      Ribeira Sacra Trip
      <small>3 amigos · Camping Cañón del Sil</small>
    </div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="btnList" title="Lista de sitios"><i class="fa-solid fa-list-ul"></i></button>
    <button class="icon-btn" id="btnSettings" title="Menú"><i class="fa-solid fa-ellipsis-vertical"></i></button>
    <div id="settingsMenu">
      <button id="btnExport"><i class="fa-solid fa-file-export"></i> Exportar datos (JSON)</button>
      <button id="btnImportTrigger"><i class="fa-solid fa-file-import"></i> Importar datos (JSON)</button>
      <button id="btnResetSites" class="danger"><i class="fa-solid fa-rotate-left"></i> Restaurar sitios por defecto</button>
    </div>
    <input type="file" id="importFile" accept="application/json">
  </div>
</header>

<div id="map"></div>

<div id="pickBanner"><i class="fa-solid fa-hand-pointer"></i> Toca el mapa para fijar la ubicación</div>

<div class="fab-stack">
  <button class="fab fab-gps" id="btnGps" title="Mi ubicación"><i class="fa-solid fa-location-crosshairs"></i></button>
  <button class="fab fab-add" id="btnAdd" title="Añadir sitio"><i class="fa-solid fa-plus"></i></button>
</div>

<!-- DRAWER: lista de sitios -->
<div id="drawerOverlay"></div>
<div id="drawer">
  <div class="drawer-handle"></div>
  <div class="drawer-header">
    <h2>Sitios del viaje</h2>
    <button class="icon-btn" id="btnCloseDrawer"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="drawer-list" id="drawerList"></div>
</div>

<!-- MODAL: añadir sitio -->
<div class="modal-overlay" id="addModalOverlay">
  <div class="modal-box">
    <div class="modal-title">
      <span>Añadir nuevo sitio</span>
      <div class="close-x" id="btnCloseAddModal"><i class="fa-solid fa-xmark"></i></div>
    </div>

    <button class="pick-map-btn" id="btnPickOnMap"><i class="fa-solid fa-map-location-dot"></i> Seleccionar en el mapa</button>

    <div class="field">
      <label>Nombre</label>
      <input type="text" id="inputName" placeholder="Ej: Poza secreta del río">
    </div>
    <div class="field">
      <label>Descripción</label>
      <textarea id="inputDesc" placeholder="Cuéntanos qué tiene de especial este sitio..."></textarea>
    </div>
    <div class="field">
      <label>Categoría</label>
      <div class="cat-select" id="catSelect">
        <div class="cat-chip" data-cat="base">BASE</div>
        <div class="cat-chip" data-cat="naturaleza">NATURALEZA</div>
        <div class="cat-chip" data-cat="cuevas">CUEVAS</div>
        <div class="cat-chip" data-cat="urbex">URBEX</div>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Latitud</label>
        <input type="number" step="any" id="inputLat" placeholder="42.3814">
      </div>
      <div class="field">
        <label>Longitud</label>
        <input type="number" step="any" id="inputLng" placeholder="-7.5683">
      </div>
    </div>

    <button class="btn-primary" id="btnSaveSite"><i class="fa-solid fa-check"></i> Guardar sitio</button>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = 'ribeiraSacraSites';

  var CATEGORY_META = {
    base:        { label: 'BASE',        color: '#007AFF', icon: 'fa-campground' },
    naturaleza:  { label: 'NATURALEZA',  color: '#2ECC71', icon: 'fa-tree' },
    cuevas:      { label: 'CUEVAS',      color: '#F39C12', icon: 'fa-dungeon' },
    urbex:       { label: 'URBEX',       color: '#E74C3C', icon: 'fa-ghost' }
  };
  var VISITED_COLOR = '#7F8C8D';
  var CATEGORY_ORDER = ['base', 'naturaleza', 'cuevas', 'urbex'];

  var DEFAULT_SITES = [
    { id:'default-1', category:'base',       name:'Camping Cañón del Sil',                lat:42.3814, lng:-7.5683, desc:'Nuestra base de operaciones.', visited:false, custom:false },
    { id:'default-2', category:'naturaleza', name:'Pasarelas del Río Mao',                lat:42.3653, lng:-7.5008, desc:'Ruta espectacular de pasarelas de madera entre cañones.', visited:false, custom:false },
    { id:'default-3', category:'naturaleza', name:'Mirador Balcones de Madrid',           lat:42.3881, lng:-7.5661, desc:'Vistas vertiginosas al Cañón del Sil.', visited:false, custom:false },
    { id:'default-4', category:'naturaleza', name:'Fervenza do Augacaída',                lat:42.5082, lng:-7.6972, desc:'Cascada impresionante escondida en la vegetación autóctona.', visited:false, custom:false },
    { id:'default-5', category:'cuevas',     name:'Túnel Romano de Montefurado',          lat:42.4319, lng:-7.1994, desc:'Obra de ingeniería romana gigantesca horadada en la montaña.', visited:false, custom:false },
    { id:'default-6', category:'urbex',      name:'Monasterio de San Paio de Abeleda',    lat:42.3789, lng:-7.4692, desc:'Ruinas abandonadas engullidas por la naturaleza.', visited:false, custom:false },
    { id:'default-7', category:'urbex',      name:'Poblado Abandonado Salto de Os Peares',lat:42.4394, lng:-7.7269, desc:'Antigua villa de trabajadores e instalaciones hidroeléctricas en ruinas.', visited:false, custom:false },
    { id:'default-8', category:'urbex',      name:'Balneario Abandonado Baños de Molgas', lat:42.2417, lng:-7.6719, desc:'Estructuras termales antiguas abandonadas.', visited:false, custom:false }
  ];

  var sites = [];
  var map, markersById = {};
  var userLatLng = null;
  var pickModeActive = false;

  function uid(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
  }

  function loadSites(){
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw){
      sites = DEFAULT_SITES.map(function(s){ return Object.assign({}, s); });
      saveSites();
      return;
    }
    try{
      var parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length){
        sites = parsed;
      } else {
        sites = DEFAULT_SITES.map(function(s){ return Object.assign({}, s); });
        saveSites();
      }
    } catch(e){
      sites = DEFAULT_SITES.map(function(s){ return Object.assign({}, s); });
      saveSites();
    }
  }

  function saveSites(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(sites));
  }

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(function(){ t.classList.remove('show'); }, 2400);
  }

  function haversine(lat1, lon1, lat2, lon2){
    var R = 6371;
    var dLat = (lat2-lat1) * Math.PI/180;
    var dLon = (lon2-lon1) * Math.PI/180;
    var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
            Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180) *
            Math.sin(dLon/2)*Math.sin(dLon/2);
    var c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
  }

  function formatDist(km){
    if (km == null) return '';
    if (km < 1) return Math.round(km*1000) + ' m';
    return km.toFixed(1) + ' km';
  }

  /* ---------------- MAP + MARKERS ---------------- */

  function initMap(){
    map = L.map('map', { zoomControl: true, attributionControl: true }).setView([42.40, -7.55], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    map.on('click', function(e){
      if (pickModeActive){
        document.getElementById('inputLat').value = e.latlng.lat.toFixed(6);
        document.getElementById('inputLng').value = e.latlng.lng.toFixed(6);
        exitPickMode();
        openAddModal({ keepValues: true });
      }
    });
  }

  function buildIcon(site){
    var meta = CATEGORY_META[site.category] || CATEGORY_META.base;
    var color = site.visited ? VISITED_COLOR : meta.color;
    var iconClass = site.visited ? 'fa-check' : meta.icon;
    var html = '<div class="custom-marker' + (site.visited ? ' visited' : '') + '" style="background:' + color + '">' +
                 '<i class="fa-solid ' + iconClass + '"></i>' +
               '</div>';
    return L.divIcon({
      html: html,
      className: '',
      iconSize: [36, 36],
      iconAnchor: [18, 36],
      popupAnchor: [0, -34]
    });
  }

  function buildPopupHtml(site){
    var meta = CATEGORY_META[site.category] || CATEGORY_META.base;
    var badgeColor = site.visited ? VISITED_COLOR : meta.color;
    var badgeLabel = site.visited ? 'VISITADO' : meta.label;
    var html = '';
    html += '<div class="popup-card">';
    html += '<span class="popup-badge" style="background:' + badgeColor + '">' + badgeLabel + '</span>';
    html += '<h3 class="popup-title">' + escapeHtml(site.name) + '</h3>';
    html += '<p class="popup-desc">' + escapeHtml(site.desc || '') + '</p>';
    html += '<div class="popup-visited-row" data-action="toggle-visited" data-id="' + site.id + '">';
    html += '<span><i class="fa-solid fa-check-double"></i> Marcar como visitado</span>';
    html += '<span class="toggle-switch' + (site.visited ? ' on' : '') + '"></span>';
    html += '</div>';
    html += '<div class="popup-nav-row">';
    html += '<a class="popup-nav-btn btn-waze" target="_blank" rel="noopener" href="https://waze.com/ul?ll=' + site.lat + ',' + site.lng + '&navigate=yes"><i class="fa-brands fa-waze"></i> Waze</a>';
    html += '<a class="popup-nav-btn btn-gmaps" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=' + site.lat + ',' + site.lng + '"><i class="fa-solid fa-diamond-turn-right"></i> G. Maps</a>';
    html += '</div>';
    if (site.custom){
      html += '<button class="popup-delete-btn" data-action="delete-site" data-id="' + site.id + '"><i class="fa-solid fa-trash"></i> Eliminar sitio</button>';
    }
    html += '</div>';
    return html;
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function renderMarkers(){
    Object.keys(markersById).forEach(function(id){
      map.removeLayer(markersById[id]);
    });
    markersById = {};

    sites.forEach(function(site){
      var marker = L.marker([site.lat, site.lng], { icon: buildIcon(site) }).addTo(map);
      marker.bindPopup(buildPopupHtml(site));
      marker.on('popupopen', function(){ bindPopupEvents(); });
      markersById[site.id] = marker;
    });
  }

  function refreshMarker(site){
    var marker = markersById[site.id];
    if (!marker) return;
    marker.setIcon(buildIcon(site));
    marker.setPopupContent(buildPopupHtml(site));
  }

  function bindPopupEvents(){
    var container = document.querySelector('.leaflet-popup-content');
    if (!container) return;

    var toggleRow = container.querySelector('[data-action="toggle-visited"]');
    if (toggleRow){
      toggleRow.onclick = function(){
        var id = toggleRow.getAttribute('data-id');
        toggleVisited(id);
      };
    }

    var delBtn = container.querySelector('[data-action="delete-site"]');
    if (delBtn){
      delBtn.onclick = function(){
        var id = delBtn.getAttribute('data-id');
        deleteSite(id);
      };
    }
  }

  function toggleVisited(id){
    var site = sites.find(function(s){ return s.id === id; });
    if (!site) return;
    site.visited = !site.visited;
    saveSites();
    refreshMarker(site);
    renderDrawerList();
    showToast(site.visited ? 'Marcado como visitado ✓' : 'Marcado como pendiente');
  }

  function deleteSite(id){
    var site = sites.find(function(s){ return s.id === id; });
    if (!site) return;
    if (!confirm('¿Eliminar "' + site.name + '"? Esta acción no se puede deshacer.')) return;
    sites = sites.filter(function(s){ return s.id !== id; });
    saveSites();
    if (markersById[id]){
      map.removeLayer(markersById[id]);
      delete markersById[id];
    }
    map.closePopup();
    renderDrawerList();
    showToast('Sitio eliminado');
  }

  /* ---------------- GPS ---------------- */

  var userMarker = null;

  function locateUser(centerMap){
    if (!navigator.geolocation){
      showToast('Este navegador no soporta GPS');
      return;
    }
    showToast('Buscando tu ubicación...');
    navigator.geolocation.getCurrentPosition(function(pos){
      userLatLng = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      if (!userMarker){
        var icon = L.divIcon({
          html: '<div style="width:18px;height:18px;border-radius:50%;background:#00D1FF;border:3px solid #fff;box-shadow:0 0 0 4px rgba(0,209,255,.35)"></div>',
          className: '',
          iconSize: [18, 18],
          iconAnchor: [9, 9]
        });
        userMarker = L.marker([userLatLng.lat, userLatLng.lng], { icon: icon, zIndexOffset: 1000 }).addTo(map);
      } else {
        userMarker.setLatLng([userLatLng.lat, userLatLng.lng]);
      }
      if (centerMap){
        map.setView([userLatLng.lat, userLatLng.lng], 14);
      }
      renderDrawerList();
    }, function(err){
      showToast('No se pudo obtener tu ubicación');
    }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
  }

  /* ---------------- DRAWER LIST ---------------- */

  function renderDrawerList(){
    var container = document.getElementById('drawerList');
    container.innerHTML = '';

    var hasAny = sites.length > 0;
    if (!hasAny){
      container.innerHTML = '<div class="empty-state">No hay sitios guardados todavía.</div>';
      return;
    }

    CATEGORY_ORDER.forEach(function(cat){
      var group = sites.filter(function(s){ return s.category === cat; });
      if (!group.length) return;

      group.forEach(function(s){
        s._dist = userLatLng ? haversine(userLatLng.lat, userLatLng.lng, s.lat, s.lng) : null;
      });
      group.sort(function(a, b){
        if (a._dist == null && b._dist == null) return a.name.localeCompare(b.name);
        if (a._dist == null) return 1;
        if (b._dist == null) return -1;
        return a._dist - b._dist;
      });

      var title = document.createElement('div');
      title.className = 'drawer-cat-title';
      title.textContent = CATEGORY_META[cat].label + ' (' + group.length + ')';
      container.appendChild(title);

      group.forEach(function(site){
        var meta = CATEGORY_META[site.category];
        var item = document.createElement('div');
        item.className = 'site-item';
        item.innerHTML =
          '<div class="site-dot" style="background:' + (site.visited ? VISITED_COLOR : meta.color) + '">' +
            '<i class="fa-solid ' + (site.visited ? 'fa-check' : meta.icon) + '"></i>' +
          '</div>' +
          '<div class="site-info">' +
            '<div class="site-name">' + escapeHtml(site.name) + (site.visited ? ' <i class="fa-solid fa-check-circle"></i>' : '') + '</div>' +
            '<div class="site-dist">' + (site._dist != null ? formatDist(site._dist) : 'Distancia desconocida') + '</div>' +
          '</div>' +
          '<i class="fa-solid fa-chevron-right chev"></i>';
        item.addEventListener('click', function(){
          closeDrawer();
          map.setView([site.lat, site.lng], 15);
          setTimeout(function(){
            var marker = markersById[site.id];
            if (marker) marker.openPopup();
          }, 300);
        });
        container.appendChild(item);
      });
    });
  }

  /* ---------------- DRAWER OPEN/CLOSE ---------------- */

  function openDrawer(){
    document.getElementById('drawer').classList.add('open');
    document.getElementById('drawerOverlay').classList.add('open');
    renderDrawerList();
  }
  function closeDrawer(){
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('drawerOverlay').classList.remove('open');
  }

  /* ---------------- ADD SITE MODAL ---------------- */

  var selectedCat = 'naturaleza';

  function paintCatChips(){
    document.querySelectorAll('.cat-chip').forEach(function(chip){
      var cat = chip.getAttribute('data-cat');
      var meta = CATEGORY_META[cat];
      chip.classList.toggle('active', cat === selectedCat);
      chip.style.background = cat === selectedCat ? meta.color : 'var(--card)';
      chip.style.borderColor = cat === selectedCat ? meta.color : 'var(--border)';
    });
  }

  function openAddModal(opts){
    opts = opts || {};
    if (!opts.keepValues){
      document.getElementById('inputName').value = '';
      document.getElementById('inputDesc').value = '';
      document.getElementById('inputLat').value = '';
      document.getElementById('inputLng').value = '';
      selectedCat = 'naturaleza';
      paintCatChips();
    }
    document.getElementById('addModalOverlay').classList.add('open');
  }
  function closeAddModal(){
    document.getElementById('addModalOverlay').classList.remove('open');
  }

  function enterPickMode(){
    pickModeActive = true;
    closeAddModal();
    document.getElementById('pickBanner').classList.add('open');
  }
  function exitPickMode(){
    pickModeActive = false;
    document.getElementById('pickBanner').classList.remove('open');
  }

  function saveNewSite(){
    var name = document.getElementById('inputName').value.trim();
    var desc = document.getElementById('inputDesc').value.trim();
    var lat = parseFloat(document.getElementById('inputLat').value);
    var lng = parseFloat(document.getElementById('inputLng').value);

    if (!name){ showToast('Escribe un nombre para el sitio'); return; }
    if (isNaN(lat) || isNaN(lng)){ showToast('Introduce latitud y longitud válidas'); return; }
    if (lat < -90 || lat > 90 || lng < -180 || lng > 180){ showToast('Coordenadas fuera de rango'); return; }

    var site = {
      id: uid(),
      category: selectedCat,
      name: name,
      desc: desc,
      lat: lat,
      lng: lng,
      visited: false,
      custom: true
    };
    sites.push(site);
    saveSites();

    var marker = L.marker([site.lat, site.lng], { icon: buildIcon(site) }).addTo(map);
    marker.bindPopup(buildPopupHtml(site));
    marker.on('popupopen', function(){ bindPopupEvents(); });
    markersById[site.id] = marker;

    renderDrawerList();
    closeAddModal();
    showToast('Sitio añadido ✓');
    map.setView([site.lat, site.lng], 14);
  }

  /* ---------------- EXPORT / IMPORT ---------------- */

  function exportSites(){
    var blob = new Blob([JSON.stringify(sites, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'ribeira-sacra-sites-' + Date.now() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Datos exportados');
  }

  function importSitesFromFile(file){
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var parsed = JSON.parse(e.target.result);
        if (!Array.isArray(parsed)) throw new Error('Formato inválido');

        var valid = parsed.filter(function(s){
          return s && typeof s.lat === 'number' && typeof s.lng === 'number' && typeof s.name === 'string';
        }).map(function(s){
          return {
            id: s.id || uid(),
            category: CATEGORY_META[s.category] ? s.category : 'naturaleza',
            name: s.name,
            desc: s.desc || '',
            lat: s.lat,
            lng: s.lng,
            visited: !!s.visited,
            custom: s.custom !== undefined ? !!s.custom : true
          };
        });

        if (!valid.length){ showToast('El archivo no contiene sitios válidos'); return; }

        var replace = confirm(valid.length + ' sitios encontrados.\n\nAceptar = REEMPLAZAR todos los sitios actuales.\nCancelar = FUSIONAR con los sitios actuales.');

        if (replace){
          sites = valid;
        } else {
          var existingIds = sites.map(function(s){ return s.id; });
          valid.forEach(function(s){
            if (existingIds.indexOf(s.id) === -1){
              sites.push(s);
            }
          });
        }
        saveSites();
        renderMarkers();
        renderDrawerList();
        showToast('Importación completada ✓');
      } catch(err){
        showToast('Error al leer el archivo JSON');
      }
    };
    reader.readAsText(file);
  }

  function resetToDefaults(){
    if (!confirm('¿Restaurar los 8 sitios por defecto? Se perderán los sitios personalizados y el estado de "visitado".')) return;
    sites = DEFAULT_SITES.map(function(s){ return Object.assign({}, s); });
    saveSites();
    renderMarkers();
    renderDrawerList();
    showToast('Sitios restaurados');
  }

  /* ---------------- WIRE UP UI ---------------- */

  function wireUi(){
    document.getElementById('btnList').addEventListener('click', openDrawer);
    document.getElementById('btnCloseDrawer').addEventListener('click', closeDrawer);
    document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);

    var settingsMenu = document.getElementById('settingsMenu');
    document.getElementById('btnSettings').addEventListener('click', function(ev){
      ev.stopPropagation();
      settingsMenu.classList.toggle('open');
    });
    document.addEventListener('click', function(){ settingsMenu.classList.remove('open'); });
    settingsMenu.addEventListener('click', function(ev){ ev.stopPropagation(); });

    document.getElementById('btnExport').addEventListener('click', function(){
      settingsMenu.classList.remove('open');
      exportSites();
    });
    document.getElementById('btnImportTrigger').addEventListener('click', function(){
      settingsMenu.classList.remove('open');
      document.getElementById('importFile').click();
    });
    document.getElementById('importFile').addEventListener('change', function(ev){
      var file = ev.target.files[0];
      if (file) importSitesFromFile(file);
      ev.target.value = '';
    });
    document.getElementById('btnResetSites').addEventListener('click', function(){
      settingsMenu.classList.remove('open');
      resetToDefaults();
    });

    document.getElementById('btnGps').addEventListener('click', function(){ locateUser(true); });
    document.getElementById('btnAdd').addEventListener('click', function(){ openAddModal(); });
    document.getElementById('btnCloseAddModal').addEventListener('click', function(){
      closeAddModal();
      exitPickMode();
    });
    document.getElementById('addModalOverlay').addEventListener('click', function(ev){
      if (ev.target.id === 'addModalOverlay'){ closeAddModal(); exitPickMode(); }
    });
    document.getElementById('btnPickOnMap').addEventListener('click', enterPickMode);
    document.getElementById('btnSaveSite').addEventListener('click', saveNewSite);

    document.querySelectorAll('.cat-chip').forEach(function(chip){
      chip.addEventListener('click', function(){
        selectedCat = chip.getAttribute('data-cat');
        paintCatChips();
      });
    });
  }

  /* ---------------- INIT ---------------- */

  document.addEventListener('DOMContentLoaded', function(){
    loadSites();
    initMap();
    renderMarkers();
    renderDrawerList();
    wireUi();
    paintCatChips();
    locateUser(false);
  });

})();
</script>
</body>
