<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>El salto · banco de pruebas</title>
<style>html,body{margin:0;height:100%;background:#050506}canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}</style>
<canvas id="c"></canvas>
<script type="module">
/* Banco: /scripts/v5/salto/banco.html?cap=0&t=12&p=x,y,z&m=x,y,z&fov=36&luz=alba&el=10&movil=1&pixeles=2e6&pasos=3&vivo=1 */
import { crearSalto } from "/assets/v2/js/salto.js";
const q = new URLSearchParams(location.search), n = (k) => q.get(k).split(",").map(Number);
const s = crearSalto(document.getElementById("c"), { movil: q.has("movil"), pixeles: +q.get("pixeles") || 3.2e6, dpr: +q.get("dpr") || 1, muestras: q.has("muestras") ? +q.get("muestras") : 4 });
window.s = s;
s.capitulo(+q.get("cap") || 0, true);
const r = {}; if (q.has("p")) r.p = n("p"); if (q.has("m")) r.m = n("m"); if (q.has("fov")) r.fov = +q.get("fov"); if (q.has("d")) r.d = n("d"); if (Object.keys(r).length) s.rodaje(r);
if (q.has("el")) s.luz({ el: +q.get("el") });
for (const k of ["obra", "lleno", "natural", "puertas", "luces", "grabado"]) if (q.has(k)) s.forzar(k, +q.get(k));
if (q.has("intro")) s.intro(+q.get("intro"));
if (q.has("area")) { s.area(q.get("area")); s.est.areaM = 1; }
if (q.has("nombre")) s.grabar({ nombre: q.get("nombre") });
if (q.has("cifra")) s.registro(+q.get("cifra"), true);
if (q.has("onda")) { s.lectura(+q.get("onda")); s.est.activo = +q.get("onda") > 0.98 ? 1 : 0.3; s.est.avance = +q.get("onda") > 0.02 ? 1 : 0; }
if (q.has("mano")) s.est.mano = +q.get("mano");
s.est.T = +q.get("t") || 20;
if (q.has("vivo")) s.iniciar(); else { const pasos = +q.get("pasos") || 2; for (let i = 0; i < pasos; i++) s.paso(0.033); }
window.listo = true;
</script></html>
