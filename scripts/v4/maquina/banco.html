<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>máquina · banco de pruebas</title>
<!-- Banco de pruebas del motor (no se despliega). Parámetros: cap, pasos, movil, mano, intro, lectura, area, libre=px,py,pz,mx,my,mz,fov,foco,ab -->
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#i{position:fixed;left:8px;top:8px;color:#888;font:11px monospace;z-index:2}</style>
<canvas id="c"></canvas><div id="i"></div>
<script type="module">
import { crearMaquina } from "/assets/v2/js/maquina.js";
const q = new URLSearchParams(location.search);
// las mismas fuentes que la web: el grabado de la tapa y la factura se dibujan con ellas
try { const fs = [new FontFace("Archivo", 'url("/assets/v2/fonts/archivo.woff2")', { weight: "100 900", stretch: "62% 125%" }), new FontFace("Martian Mono", 'url("/assets/v2/fonts/martian-mono.woff2")', { weight: "100 800", stretch: "75% 112.5%" })]; for (const f of fs) document.fonts.add(await f.load()); } catch (e) {}
const m = crearMaquina(document.getElementById("c"), { movil: q.has("movil"), intro: q.has("intro") ? undefined : false, captura: true, dpr: +q.get("dpr") || 1, muestras: q.has("muestras") ? +q.get("muestras") : undefined, tomas: q.has("tomas") ? +q.get("tomas") : undefined, mapaSombra: +q.get("sombra") || undefined, pixeles: +q.get("pixeles") || undefined });
window.m = m; m.capitulo(+q.get("cap") || 0, true);
if (q.has("mano")) m.est.mano = m.est.manoObj = +q.get("mano") || 1;
if (q.has("intro")) m.intro(+q.get("intro"));
if (q.has("lectura")) m.lectura(+q.get("lectura"), 1);
if (q.has("registro")) { m.registro(+q.get("registro")); for (let k = 0; k < 6; k++) m.est.digitos[k] = m.est.digObj[k]; }
if (q.has("area")) { m.area(+q.get("area")); m.est.selMezcla = 1; }
if (q.has("libre")) { const v = q.get("libre").split(",").map(Number); m.rodaje({ p: v.slice(0, 3), m: v.slice(3, 6), fov: v[6] || 32, foco: v[7] || Math.hypot(v[0] - v[3], v[1] - v[4], v[2] - v[5]), ab: v[8] === undefined ? 0.4 : v[8], d: [0, 0] }, q.has("forzar") ? JSON.parse(q.get("forzar")) : null); }
if (q.has("t")) { m.est.T = +q.get("t"); m.est.theta = +q.get("t") * 0.55; }
addEventListener("resize", () => m.medir());
addEventListener("pointermove", (e) => { m.puntero(e.clientX / innerWidth * 2 - 1, 1 - e.clientY / innerHeight * 2, true); if (e.buttons) m.arrastrar(e.movementX, e.movementY); });
addEventListener("keydown", (e) => { if (e.key >= "0" && e.key <= "8") m.capitulo(+e.key); if (e.key === " ") m.sostener(true); });
addEventListener("keyup", (e) => { if (e.key === " ") m.sostener(false); });
if (!q.has("sinrotulo")) document.getElementById("i").textContent = m.N + " piezas · " + (m.info.avisos.join(" · ") || "sin avisos");
if (q.has("pasos")) { const k = +q.get("pasos"); for (let i = 0; i < k; i++) m.paso(1 / 30); window.listo = true; } else m.iniciar();
</script></html>
