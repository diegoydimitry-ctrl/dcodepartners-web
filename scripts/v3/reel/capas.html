<style>
@font-face { font-family: "Archivo"; src: url("/assets/v2/fonts/archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: "Martian Mono"; src: url("/assets/v2/fonts/martian-mono.woff2") format("woff2"); font-weight: 100 800; font-stretch: 75% 112.5%; }
html, body { margin: 0; width: 360px; height: 640px; background: transparent; overflow: hidden; color: #fff; font-family: "Archivo", sans-serif; }
.r { position: absolute; left: 0; right: 0; display: grid; justify-items: center; text-align: center; opacity: 0; will-change: transform, opacity; }
.grande { font-size: 33px; line-height: 1; letter-spacing: -.045em; font-weight: 600; padding: 0 26px; text-wrap: balance; text-shadow: 0 2px 30px rgba(0,0,0,.75), 0 0 2px rgba(0,0,0,.4); }
.media { font-size: 24px; line-height: 1.04; letter-spacing: -.035em; font-weight: 600; padding: 0 30px; text-wrap: balance; text-shadow: 0 2px 26px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.5); }
.grande::before, .media::before { content: ""; position: absolute; inset: -46px 0; z-index: -1; background: radial-gradient(closest-side, rgba(0,0,0,.62), rgba(0,0,0,.34) 60%, transparent); }
.tag span { display: inline-flex; align-items: center; gap: 9px; padding: 10px 15px 10px 13px; border-radius: 999px; background: rgba(6,6,6,.78); border: 1px solid rgba(255,255,255,.22); font-family: "Martian Mono", monospace; font-stretch: 80%; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; }
.tag span::before { content: ""; width: 7px; height: 7px; border-radius: 1px; background: #5b8cff; }
.marca { grid-auto-flow: column; justify-content: center; align-items: center; gap: 11px; }
.marca svg { width: 40px; height: 33px; }
.marca b { font-size: 22px; letter-spacing: -.035em; font-weight: 600; }
.marca i { font-style: normal; font-family: "Martian Mono", monospace; font-stretch: 82%; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.72); }
</style>
<body></body>
<script>
// [desde, hasta, clase, y (px desde arriba), html] · cuadros a 30 fps sobre el montaje completo (1200)
const LOGO = '<svg viewBox="0 0 120 100" aria-hidden="true"><g fill="#fff"><rect x="26" y="1" width="16" height="16" rx="2"/><rect x="1" y="27" width="13" height="13" rx="2"/><rect x="35" y="26" width="13" height="13" rx="2"/><rect x="2" y="64" width="12" height="12" rx="2"/><rect x="35" y="64" width="13" height="13" rx="2"/><rect x="26" y="83" width="16" height="16" rx="2"/><path d="M48 1H86A32 32 0 0 1 118 33V38H102V33A16 16 0 0 0 86 17H48Z"/><rect x="102" y="43" width="16" height="16" rx="2"/><path d="M48 99H86A32 32 0 0 0 118 67V63H102V67A16 16 0 0 1 86 83H48Z"/></g><rect x="16" y="45" width="15" height="15" rx="2" fill="#5b8cff"/></svg>';
const ES = [
  [10, 72, "grande", 250, "Así está hoy<br>el trabajo de<br>tu empresa."],
  [112, 142, "tag", 74, "<span>Esto no es un vídeo</span>"],
  [142, 178, "tag", 74, "<span>Es una página web</span>"],
  [318, 400, "tag", 500, "<span>Mantén pulsado: el sistema pone orden</span>"],
  [476, 562, "tag", 86, "<span>Deslizas y el caos se ordena</span>"],
  [582, 672, "media", 92, "La IA lee<br>cada documento."],
  [686, 762, "media", 92, "Y sigue trabajando<br>a las 03:12."],
  [778, 926, "tag", 240, "<span>Todo lo que ves funciona</span>"],
  [958, 1020, "media", 440, "Tu empresa,<br>como un solo sistema."],
  [1034, 1112, "grande", 388, "¿Quieres una web así<br>para tu empresa?"],
  [1116, 1200, "media", 384, "La construimos nosotros."],
  [1132, 1200, "marca", 422, LOGO + "<b>D-Code Partners</b>"],
  [1148, 1200, "tag", 470, "<span>Escríbenos · dcodepartners.com</span>"],
];
const EN = null;
const lista = ES.map(([a, b, c, y, h]) => { const e = document.createElement("div"); e.className = "r " + c; e.style.top = y + "px"; e.innerHTML = h; document.body.appendChild(e); return { a, b, e, fin: b >= 1200 }; });
const eo = (t) => 1 - Math.pow(1 - t, 3), cl = (x) => Math.min(1, Math.max(0, x));
window.cuadro = (f) => { let hay = false; for (const r of lista) { const ent = eo(cl((f - r.a) / 11)), sal = r.fin ? 0 : cl((f - (r.b - 8)) / 8), o = f < r.a || f >= r.b ? 0 : ent * (1 - sal); r.e.style.opacity = o; r.e.style.transform = `translateY(${(1 - ent) * 14 - sal * 8}px)`; if (o > 0) hay = true; } return hay; };
window.listo = document.fonts.ready.then(() => true);
</script></html>
