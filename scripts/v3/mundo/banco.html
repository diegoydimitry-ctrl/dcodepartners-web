<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>mundo · banco de pruebas</title>
<!-- Banco de pruebas del motor (no se despliega). Parámetros: cap, pasos, movil, mano, lectura, intro, hojas. Lo usa scripts/v3/fotos.mjs. -->
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#i{position:fixed;left:8px;top:8px;color:#888;font:11px monospace;z-index:2;display:none}</style>
<canvas id="c"></canvas><div id="i"></div>
<script type="module">
import { crearMundo } from "/assets/v2/js/mundo.js";
const q = new URLSearchParams(location.search);
const m = crearMundo(document.getElementById("c"), { movil: q.has("movil"), intro: !q.has("intro") ? false : undefined, captura: true, hojas: +q.get("hojas") || undefined });
window.m = m; m.capitulo(+q.get("cap") || 0, true);
if (q.has("mano")) { m.puntero(0.2, 0.1, true); m.sostener(true); }
if (q.has("intro")) m.intro(+q.get("intro"));
if (q.has("lectura")) m.lectura(+q.get("lectura"), 1);
addEventListener("resize", () => m.medir());
addEventListener("pointermove", (e) => m.puntero(e.clientX / innerWidth * 2 - 1, 1 - e.clientY / innerHeight * 2, true));
addEventListener("keydown", (e) => { if (e.key >= "0" && e.key <= "8") m.capitulo(+e.key); });
let n = 0, t0 = performance.now();
m.alCuadro(() => { if (++n % 30 === 0) { const t = performance.now(); document.getElementById("i").textContent = (30000 / (t - t0)).toFixed(0) + " fps · cap " + m.est.cap.toFixed(2); t0 = t; } });
if (q.has("pasos")) { const k = +q.get("pasos"); for (let i = 0; i < k; i++) m.paso(1 / 30); window.listo = true; } else m.iniciar();
</script></html>
