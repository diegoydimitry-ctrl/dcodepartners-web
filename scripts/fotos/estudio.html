<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estudio · El Núcleo</title><style>html,body{margin:0;height:100%;background:#eae7e1}canvas{width:100vw;height:100vh;display:block}</style></head>
<body><canvas id="c"></canvas>
<script>document.body.style.background=new URLSearchParams(location.search).get("tema")==="oscuro"?"#0d0e11":"#eeebe5";</script>
<script type="module">
import { montarNucleo } from "/assets/js/nucleo/nucleo.js";
const q = new URLSearchParams(location.search);
const n = await montarNucleo(document.getElementById("c"), { estado: q.get("estado") || "ensamblado", claro: q.get("tema") !== "oscuro", calidad: q.get("calidad") || "foto", sinEntrada: true, observar: false,
  alCargar: () => { setTimeout(() => { n.saltar(); window.__listo = true; }, 300); } });
window.__n = n;
if (q.get("vx") != null) n.setEncuadre(+q.get("vx"));
if (q.get("giro")) { n.giro = +q.get("giro"); }
if (q.get("focos")) n.setFocos(q.get("focos").split(","));
if (q.get("cam")) n.fijarCamara(q.get("cam").split(",").map(Number), q.get("mira").split(",").map(Number), +(q.get("fov")||26), 0);
if (q.get("giro")) n.giro = +q.get("giro");
</script></body></html>
