<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>El sistema · banco de pruebas</title>
<style>@font-face{font-family:Archivo;src:url(/assets/v2/fonts/archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%}html,body{margin:0;height:100%;background:#f3f2ef}canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}</style>
<canvas id="c"></canvas>
<script type="module">
/* /scripts/v6/sistema/banco.html?cap=2&t=12&seg=4&p=x,y,z&m=x,y,z&fov=28&d=0,0&movil=1&nombre=…&cifra=150040 — seg: segundos que se simulan antes de la foto */
import { crearSistema } from "/assets/v2/js/sistema.js";
const q = new URLSearchParams(location.search), n = (k) => q.get(k).split(",").map(Number);
await document.fonts.load('700 40px Archivo');
const s = crearSistema(document.getElementById("c"), { movil: q.has("movil"), pixeles: +q.get("pixeles") || 2.2e6, dpr: +q.get("dpr") || 1, intro: false });
window.s = s; s.capitulo(+q.get("cap") || 0, true);
const r = {}; for (const k of ["p", "m", "d"]) if (q.has(k)) r[k] = n(k); if (q.has("fov")) r.fov = +q.get("fov"); if (q.has("ab")) r.ab = +q.get("ab"); if (Object.keys(r).length) s.rodaje(r);
for (const k of ["unido", "carril", "ritmo", "lente", "finance", "circuito", "tuyo", "lejos"]) if (q.has(k)) s.forzar(k, +q.get(k));
if (q.has("area")) { s.area(q.get("area")); s.est.selM = 1; }
if (q.has("nombre")) s.grabar({ nombre: q.get("nombre") });
if (q.has("cifra")) s.registro(+q.get("cifra"), true);
if (q.has("lectura")) s.lectura(+q.get("lectura"));
s.est.T = +q.get("t") || 3;
s.correr(+q.get("seg") || 0.1);
if (q.has("vivo")) s.iniciar(); else { s.paso(1 / 30); s.paso(1 / 30); }
window.listo = true;
</script></html>
