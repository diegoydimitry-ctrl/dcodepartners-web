<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Montaje del reel — D-Code Partners</title>
<style>
@font-face{font-family:"Inter Tight";src:url(../web/fuentes/inter-tight.woff2);font-weight:100 900}
@font-face{font-family:"Archivo";src:url(../web/fuentes/archivo-wdth.woff2);font-weight:100 900;font-stretch:62% 125%}
*{box-sizing:border-box}
html,body{margin:0;background:#06080d;overflow:hidden}
#e{position:relative;width:1080px;height:1920px;overflow:hidden;background:#06080d;color:#fff;font-family:"Inter Tight",sans-serif}
#e > *{position:absolute}
#plano{left:0;top:0;width:1080px;height:1920px;transform-origin:50% 42%;display:block}
#destello{inset:0;background:#fff;opacity:0}
/* gancho */
#gancho{left:0;right:0;top:640px;display:flex;flex-direction:column;align-items:center;gap:18px}
#gancho div{padding:10px 40px 16px;border-radius:26px;background:#0b0c10;font:900 112px/1.05 "Archivo";font-stretch:108%;letter-spacing:-3.5px;opacity:0;white-space:nowrap;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#gancho div:nth-child(2){background:#F5B841;color:#0b0c10}
/* rótulo */
#rotulo{left:50%;top:208px;display:flex;align-items:center;gap:20px;padding:22px 42px 24px 30px;border-radius:60px;background:#fff;color:#0d0f14;white-space:nowrap;opacity:0;box-shadow:0 18px 50px rgba(0,0,0,.28);font:750 50px/1 "Inter Tight";letter-spacing:-.8px}
#rotulo i{width:22px;height:22px;border-radius:50%;background:#F5B841;box-shadow:0 0 0 7px rgba(245,184,65,.3)}
/* escaparate final */
#esc{inset:0;opacity:0;background:radial-gradient(60% 34% at 50% 62%,#1b2233 0%,#0a0d15 60%,#06080d 100%)}
#esc h2{position:absolute;left:0;right:0;top:250px;margin:0;text-align:center;font:900 104px/1.02 "Archivo";font-stretch:108%;letter-spacing:-3px}
#esc h2 em{font-style:normal;color:#F5B841}
#mesa{position:absolute;left:0;top:0;width:1080px;height:1920px;perspective:2600px;perspective-origin:50% 55%}
.movil{position:absolute;left:50%;top:1190px;width:486px;height:864px;margin:-432px 0 0 -243px;border-radius:64px;background:#0b0c0f;padding:14px;box-shadow:0 0 0 2px rgba(255,255,255,.16),0 60px 120px rgba(0,0,0,.65),0 20px 40px rgba(0,0,0,.5);transform-style:preserve-3d}
.movil img{display:block;width:458px;height:836px;border-radius:50px;object-fit:cover}
.movil::after{content:"";position:absolute;inset:14px;border-radius:50px;background:linear-gradient(115deg,rgba(255,255,255,.16),rgba(255,255,255,0) 32%);pointer-events:none}
/* cierre */
#negro{inset:0;background:#06080d;opacity:0}
#firma{left:0;right:0;top:560px;text-align:center;opacity:0}
#firma img{width:600px;height:600px;display:block;margin:0 auto}
#firma div{margin-top:-40px;font:800 92px "Archivo";font-stretch:110%;letter-spacing:-1px}
#firma span{font-weight:400;color:#aeb6c6}
</style></head>
<body><div id="e">
  <img id="plano" alt="">
  <div id="destello"></div>
  <div id="rotulo"><i></i><span></span></div>
  <div id="gancho"><div>¿Y si tu web</div><div>hiciera esto?</div></div>
  <div id="esc"><h2>La siguiente<br>puede ser <em>la tuya.</em></h2><div id="mesa">
    <div class="movil" id="m0"><img alt=""></div><div class="movil" id="m2"><img alt=""></div><div class="movil" id="m1"><img alt=""></div></div></div>
  <div id="negro"></div>
  <div id="firma"><img src="../web/assets/logo512.png" alt=""><div>D-Code <span>Partners</span></div></div>
</div>
<script src="montaje.js"></script>
</body></html>
