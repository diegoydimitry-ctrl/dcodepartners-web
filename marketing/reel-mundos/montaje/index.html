<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Montaje — reel «Es una web» · D-Code Partners</title>
<style>
@font-face{font-family:"Inter Tight";src:url(../assets/inter-tight.woff2);font-weight:100 900}
@font-face{font-family:"Archivo";src:url(../assets/archivo-wdth.woff2);font-weight:100 900;font-stretch:62% 125%}
*{box-sizing:border-box}
html,body{margin:0;background:#000;overflow:hidden}
#e{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000;color:#fff;font-family:"Inter Tight",sans-serif}
#e > *{position:absolute}
#plano{left:0;top:0;width:1080px;height:1920px;transform-origin:50% 45%;display:block}
#vin{inset:0;background:radial-gradient(120% 85% at 50% 48%,transparent 55%,rgba(0,0,0,.42) 100%);pointer-events:none}
#grano{inset:-40px;opacity:.09;mix-blend-mode:overlay;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='360' height='360'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1 0'/></filter><rect width='360' height='360' filter='url(%23n)'/></svg>")}
#destello{inset:0;background:#fff;opacity:0}
#chip{left:50%;top:150px;transform:translateX(-50%);display:flex;align-items:center;gap:16px;padding:14px 26px 14px 20px;border-radius:40px;background:rgba(10,11,14,.55);backdrop-filter:blur(18px);border:1.5px solid rgba(255,255,255,.16);font:600 27px/1 "Inter Tight";letter-spacing:3px;text-transform:uppercase;white-space:nowrap;opacity:0}
#chip i{width:14px;height:14px;border-radius:50%;background:#F5B841;box-shadow:0 0 0 5px rgba(245,184,65,.25)}
#chip b{font-weight:800;color:#F5B841}
#sombra{left:0;right:0;top:1180px;height:560px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.5) 45%,transparent);opacity:0}
#frase{left:60px;right:60px;top:1360px;text-align:center;font:800 78px/1.04 "Archivo";font-stretch:106%;letter-spacing:-2px;opacity:0;text-shadow:0 4px 30px rgba(0,0,0,.55)}
/* muro de ventanas */
#muro{left:0;top:0;width:1080px;height:1920px;opacity:0;background:#07080b;transform-origin:0 0}
.v{position:absolute;width:330px;border-radius:26px;overflow:hidden;background:#15171c;box-shadow:0 0 0 1.5px rgba(255,255,255,.14),0 30px 70px rgba(0,0,0,.6)}
.v .barra{height:44px;display:flex;align-items:center;gap:8px;padding:0 16px;background:#1b1e24}
.v .barra s{width:11px;height:11px;border-radius:50%;background:#3a3f48}.v .barra s:first-child{background:#F5B841}
.v .barra u{flex:1;height:22px;margin-left:10px;border-radius:11px;background:#272b33;text-decoration:none;font:600 12px/22px "Inter Tight";letter-spacing:.5px;color:#9aa1ad;padding:0 12px;overflow:hidden;white-space:nowrap}
.v img{display:block;width:330px;height:587px;object-fit:cover}
#velo{inset:0;background:#05060a;opacity:0}
#lim{left:50px;right:50px;top:800px;text-align:center;font:900 104px/1.02 "Archivo";font-stretch:108%;letter-spacing:-3px}
#lim div{opacity:0}#lim em{font-style:normal;color:#F5B841}
/* D-Code y CTA */
#negro{inset:0;background:#06080d;opacity:0}
#firma{left:0;right:0;top:560px;text-align:center;opacity:0}
#firma img{width:600px;height:600px;display:block;margin:0 auto}
#firma div{margin-top:-40px;font:800 92px "Archivo";font-stretch:110%;letter-spacing:-1px}
#firma span{font-weight:400;color:#aeb6c6}
#cta{inset:0;text-align:center}
#cta > div{position:absolute;left:40px;right:40px;opacity:0}
#c1{top:560px;white-space:nowrap;font:800 86px/1.05 "Archivo";font-stretch:106%;letter-spacing:-2px}
#c2{top:740px;font:600 54px/1 "Inter Tight";letter-spacing:8px;text-transform:uppercase;color:#aeb6c6}
#c3{top:800px;font:900 330px/1 "Archivo";font-stretch:118%;letter-spacing:-12px;color:#F5B841}
#c4{top:1180px;font:700 74px/1.1 "Inter Tight";letter-spacing:-1px}
#c5{top:1420px;display:flex;justify-content:center;align-items:center;gap:22px;font:800 54px "Archivo";font-stretch:110%}
#c5 img{width:84px;height:84px;border-radius:20px}#c5 span{font-weight:400;color:#aeb6c6}
</style></head>
<body><div id="e">
  <img id="plano" alt="">
  <div id="vin"></div><div id="grano"></div>
  <div id="sombra"></div><div id="chip"><i></i><b></b><span></span></div><div id="frase"></div>
  <div id="muro"></div><div id="velo"></div>
  <div id="lim"><div>El límite<br>no es la web.</div><div style="margin-top:44px">Es tu <em>imaginación.</em></div></div>
  <div id="destello"></div>
  <div id="negro"></div>
  <div id="firma"><img src="../assets/logo512.png" alt=""><div>D-Code <span>Partners</span></div></div>
  <div id="cta"><div id="c1">¿Quieres una web así?</div><div id="c2">Comenta</div><div id="c3">WEB</div><div id="c4">y te mandamos los prompts.</div><div id="c5"><img src="../assets/logo512.png" alt="">D-Code <span>Partners</span></div></div>
</div>
<script src="montaje.js"></script>
</body></html>
