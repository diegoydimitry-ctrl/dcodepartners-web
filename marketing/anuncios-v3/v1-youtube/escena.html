<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>RUIDO · D-Code Partners</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../comun/motor.js"></script>
<script>
"use strict";
// RUIDO v4 — anuncio de YouTube (16:9). Cada fotograma es función de t; todos los tiempos salen de la voz
// (montaje.json, generado por comun/monta.py) y de la banda sonora (audio/cortes.json).
//
// Estructura (psicología aplicada, ver README): 0–5 s un hueco de información con pérdida personal
// («un trabajo que nadie ve… que puede costarte un sueldo»); 5 s: bucle abierto con plazo («en 30 segundos te
// digo cuál es») y una cuenta atrás que se queda en pantalla hasta que se cumple la promesa.
const W = 1920, H = 1080, FPS = 30;
const D = window.DATOS, MT = D.montaje, CT = D.cortes;
const V = Object.fromEntries(MT.voz.map((f) => [f.id, f]));
// alias de las palabras del gancho (una sola toma de voz: «Copiar. Pegar. Responder. Buscar. Otra vez.»)
(() => { const p = V.h.palabras; const ids = ["h1", "h2", "h3", "h4"];
  ids.forEach((id, i) => { V[id] = { t0: p[i].t0, t1: p[i + 1].t0 }; }); V.h5 = { t0: p[4].t0, t1: V.h.t1 }; })();
const SIL0 = MT.silencio0, SIL1 = MT.silencio1, G0 = MT.golpe, C0 = MT.cuenta0, CF = MT.cuenta_fin, PROD = MT.producto, FIN = MT.cierre;
const PR0 = V.p1.t0 - 0.1;                  // arranca el problema (RUIDO se sostiene hasta aquí)
const TICK = V.c8.t0 - 0.05;                // el píxel se posa en el logotipo
const HOOK = V.h.t0 - 0.03;                 // fin del gancho nuevo → microplanos
const SKIP = 5.0;                           // el botón «saltar» aparece a los 5 s
window.META = { W, H, fps: FPS, duracion: MT.duracion, segura: [96, 54, 1824, 1026], minpx: 24 };
const c = document.getElementById("c").getContext("2d");
const { clamp, lerp, prog, eOut, eOut5, eIn, eIO, eExpo, muelle, ventana, hash } = M;

const C = { negro: "#09090b", panel: "#141418", panel2: "#1b1b21", linea: "#2a2a32", texto: "#f2f2f4", tenue: "#8b8b97",
            rojo: "#ff3d2e", claro: "#f3f4f6", tarjeta: "#ffffff", tinta: "#0c0e13", gris: "#d9dce3", gris2: "#6b7280",
            azul: "#2f6bff", pixel: "#5b8cff", ambar: "#ffb020", naranja: "#ff6a1a" };
const F = (p, px) => M.fuente(p, px, "Inter Tight");
const SERIF = (px) => `italic 400 ${px}px "Instrument Serif"`;
const MONO = (p, px) => M.fuente(p, px, "JetBrains Mono");
const pal = (id, w) => V[id].palabras.find((p) => p.w.toLowerCase().replace(/[^\wáéíóúñü%-]/g, "").startsWith(w)) || V[id].palabras[0];
const ajusta = (s, f, anchoMax, pxMax, track = 0) => Math.min(pxMax, pxMax * anchoMax / M.ancho(c, s, f(pxMax), track));

// ════════════════════════════ 0 · GANCHO NUEVO: el trabajo que nadie ve ════════════════════════════
// Negro profundo + un solo color cálido (ámbar/naranja: los tonos cálidos saturados son los de mayor activación).
function fondoCalido(t, fuerza = 1) {
  c.fillStyle = "#070709"; c.fillRect(0, 0, W, H);
  const x = 960 + Math.sin(t * 0.7) * 260, y = 560 + Math.cos(t * 0.5) * 120;
  const g = c.createRadialGradient(x, y, 0, x, y, 900); g.addColorStop(0, `rgba(255,120,20,${0.16 * fuerza})`); g.addColorStop(1, "rgba(255,120,20,0)");
  c.fillStyle = g; c.fillRect(0, 0, W, H);
}
// palabra que golpea: escala con muelle + estela (dos copias desplazadas que se apagan en 4 fotogramas)
function golpe(s, x, y, px, t0, t, o = {}) {
  const dt = t - t0; if (dt < -0.02) return 0;
  const k = muelle(prog(dt, -0.02, 0.34), 3, 6), e = eOut5(prog(dt, -0.02, 0.06));
  const f = o.f || F(900, px), col = o.color || C.texto;
  c.save(); c.translate(x, y); const s_ = lerp(o.desde ?? 1.28, 1, k); c.scale(s_, s_);
  if (dt < 0.14) for (let q = 1; q <= 2; q++) M.texto(c, s, 0, q * 18 * (1 - dt / 0.14), { f, color: C.naranja, al: o.al || "center", alpha: 0.35 / q, track: o.track ?? -4, registrar: false });
  if (o.contorno) { c.font = f; c.letterSpacing = `${o.track ?? -4}px`; c.lineWidth = 6; c.strokeStyle = col; c.globalAlpha = e * (o.alpha ?? 1);
    const w = c.measureText(s).width; c.fillStyle = col; c.globalAlpha *= 0.28; c.fillText(s, o.al === "left" ? 0 : -w / 2, 0); c.globalAlpha /= 0.28;
    c.setLineDash([14, 8]); c.lineDashOffset = -t * 60; c.strokeText(s, o.al === "left" ? 0 : -w / 2, 0);
    M.CAJAS.push({ s, x0: x - w / 2, y0: y - px * 0.75, x1: x + w / 2, y1: y + px * 0.1, px }); }
  else M.texto(c, s, 0, 0, { f, color: col, al: o.al || "center", alpha: e * (o.alpha ?? 1), track: o.track ?? -4 });
  c.restore(); return e;
}
function intro(t, n) {
  fondoCalido(t, eOut(prog(t, 0, 0.5)));
  // fotograma 0: una rendija de luz ámbar se abre de lado a lado (anamórfica) con el golpe de sonido
  const kr = prog(t, 0, 0.45);
  if (kr < 1) { const w = W * eOut5(kr), a = 1 - eIn(kr);
    const g = c.createLinearGradient(960 - w / 2, 0, 960 + w / 2, 0); g.addColorStop(0, "rgba(255,176,32,0)"); g.addColorStop(0.5, `rgba(255,190,80,${a})`); g.addColorStop(1, "rgba(255,176,32,0)");
    c.fillStyle = g; c.fillRect(0, 536 - 6 * (1 - kr), W, 12 * (1 - kr) + 2);
    c.fillStyle = `rgba(255,150,40,${0.25 * a})`; c.fillRect(0, 420, W, 240 * (1 - kr)); }
  const a1 = V.a1.palabras, a2 = V.a2.palabras, a3 = V.a3.palabras;
  // ── a1: HAY UN TRABAJO / EN TU EMPRESA / QUE NADIE VE.
  const salida1 = eIn(prog(t, V.a2.t0 - 0.12, V.a2.t0 + 0.1));
  if (salida1 < 1) {
    c.save(); c.globalAlpha = 1 - salida1; c.translate(0, -salida1 * 60);
    const L = [[0, 3, 330], [3, 6, 520], [6, 9, 710]];   // [desde, hasta, y] sobre las 9 palabras
    L.forEach(([i0, i1, y]) => {
      const ws = a1.slice(i0, i1).map((p) => p.w.replace(/[.,]/g, "").toUpperCase()); const f = F(900, 150);
      const anchos = ws.map((w) => M.ancho(c, w + " ", f, -4)); let x = 960 - anchos.reduce((a, b) => a + b, 0) / 2;
      ws.forEach((w, j) => { const p = a1[i0 + j]; const invisible = i0 === 6 && j >= 1;   // «NADIE VE» se vuelve invisible
        const ca = anchos[j];
        if (t < p.t0 - 0.02) M.texto(c, w, x, y, { f, color: C.texto, alpha: 0.12, track: -4, registrar: false });   // la frase entera, en fantasma, desde el fotograma 0
        if (invisible) { const kv = eIO(prog(t, p.t0 + 0.25, p.t0 + 0.7));
          golpe(w, x + (ca - M.ancho(c, " ", f, -4)) / 2, y, 150, p.t0, t, { color: C.ambar, contorno: kv > 0.02, alpha: kv > 0.02 ? 0.35 + 0.65 * Math.abs(Math.sin(t * 40)) * (1 - kv) + 0.3 * kv : 1 }); }
        else golpe(w, x + (ca - M.ancho(c, " ", f, -4)) / 2, y, 150, p.t0, t);
        x += ca; });
    });
    c.restore();
  }
  // ── a2: Y PUEDE ESTAR COSTÁNDOTE → rodillo de euros → UN SUELDO ENTERO.
  const salida2 = eIn(prog(t, V.a3.t0 - 0.15, V.a3.t0 + 0.08));
  if (t > V.a2.t0 - 0.05 && salida2 < 1) {
    c.save(); c.globalAlpha = 1 - salida2;
    const tC = pal("a2", "cost").t0, tU = pal("a2", "un").t0 ?? V.a2.t1 - 0.8;
    const cab = "Y PUEDE ESTAR COSTÁNDOTE"; const kc = eOut5(prog(t, V.a2.t0 - 0.03, V.a2.t0 + 0.2));
    M.texto(c, cab, 960, 300 + (1 - kc) * 24, { f: F(800, 72), color: C.texto, al: "center", alpha: kc, track: 2 });
    // rodillo: dígitos que giran a toda velocidad (tragaperras), de «costándote» a «un»
    if (t >= tC - 0.1 && t < tU + 0.05) {
      const k = prog(t, tC - 0.1, tU); const f = M.fuente(800, 230, "JetBrains Mono");
      c.save(); c.beginPath(); c.rect(0, 452, W, 236); c.clip();                  // los dígitos solo dentro de la ventana del rodillo
      const sl = ["€", "", "", ".", "", "", ""]; const x0 = 960 - 3.3 * 150;
      for (let i = 0; i < 7; i++) { const x = x0 + i * 150;
        if (sl[i]) { M.texto(c, sl[i], x, 640, { f, color: C.ambar, al: "center", alpha: 0.9, registrar: false }); continue; }
        const vel = 60 - i * 4; const fase = (t * vel + i * 3.7);
        for (let q = -1; q <= 1; q++) { const d = ((Math.floor(fase) + q) % 10 + 10) % 10; const off = (fase % 1) * 180 - q * 180;
          M.texto(c, String(d), x, 640 + off, { f, color: C.ambar, al: "center", alpha: (q === 0 ? 0.95 : 0.3) * (1 - Math.abs(off) / 260), registrar: false }); }
      }
      c.save(); const gr = c.createLinearGradient(0, 400, 0, 760); gr.addColorStop(0, "#070709"); gr.addColorStop(0.3, "rgba(7,7,9,0)"); gr.addColorStop(0.7, "rgba(7,7,9,0)"); gr.addColorStop(1, "#070709");
      c.fillStyle = gr; c.fillRect(0, 400, W, 360); c.restore(); c.restore();
      c.strokeStyle = "rgba(255,176,32,0.35)"; c.lineWidth = 2; c.strokeRect(960 - 3.3 * 150 - 90, 452, 7 * 150 + 30, 236);
    }
    // UN SUELDO ENTERO. (el rodillo se para y se convierte en la frase)
    if (t >= tU - 0.03) {
      const tE = pal("a2", "entero").t0;
      golpe("UN SUELDO", 960, 640, 230, tU, t, { color: C.ambar, desde: 1.4 });
      golpe("ENTERO.", 960, 820, 150, tE, t, { color: C.texto });
    }
    c.restore();
  }
  // ── a3: EN 30 SEGUNDOS / te digo cuál es… / y cómo quitártelo de encima.
  if (t > V.a3.t0 - 0.05) {
    const tT = pal("a3", "treinta").t0, tD = pal("a3", "digo").t0, tY = pal("a3", "cómo").t0 ?? V.a3.t1 - 1.2;
    const k1 = eOut5(prog(t, V.a3.t0 - 0.03, V.a3.t0 + 0.22));
    const xt = 820;
    M.texto(c, "EN 30", xt, 430 + (1 - k1) * 30, { f: F(900, 170), color: C.texto, alpha: k1, track: -6 });
    M.texto(c, "SEGUNDOS", xt, 590 + (1 - k1) * 30, { f: F(900, 170), color: C.ambar, alpha: eOut5(prog(t, tT, tT + 0.22)), track: -6 });
    const k2 = eOut5(prog(t, tD - 0.25, tD + 0.1));
    M.texto(c, "te digo cuál es…", xt + 6, 700 + (1 - k2) * 20, { f: F(600, 64), color: C.texto, alpha: k2 });
    const k3 = eOut5(prog(t, tY - 0.1, tY + 0.2));
    M.texto(c, "y cómo quitártelo de encima.", xt + 6, 790 + (1 - k3) * 20, { f: SERIF(84), color: C.ambar, alpha: k3 });
  }
}

// ════════════════════════════ cuenta atrás (bucle abierto: se queda hasta cumplir la promesa) ════════════════════════════
function cuenta(t) {
  if (t < C0 - 0.05 || t > CF + 0.7) return;
  if (t >= SIL0 - 0.05 && t < SIL1) return;                     // en el silencio no hay nada
  const rest = Math.max(0, 30 - (t - C0) * 30 / (CF - C0));     // 30 → 0 exactamente entre «treinta» y el remate
  const kv = prog(t, V.a3.t1 + 0.05, V.a3.t1 + 0.55);            // viaja del centro a la esquina
  const cx = lerp(470, 1738, eIO(kv)), cy = lerp(540, 124, eIO(kv)), r = lerp(210, 52, eIO(kv));
  const claro = t >= G0 && t < PROD - 0.1;
  const aparece = eOut5(prog(t, C0 - 0.05, C0 + 0.3));
  const fin = prog(t, CF, CF + 0.6);
  c.save(); c.globalAlpha = aparece * (1 - fin); c.translate(cx, cy); const s = 1 + eOut(fin) * 1.5; c.scale(s, s);
  c.lineWidth = r * 0.12; c.strokeStyle = claro ? "#d5d9e2" : "rgba(255,255,255,0.14)"; c.beginPath(); c.arc(0, 0, r, 0, 7); c.stroke();
  c.strokeStyle = claro ? C.naranja : C.ambar; c.lineCap = "round"; c.beginPath(); c.arc(0, 0, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * rest / 30); c.stroke();
  const num = String(Math.ceil(rest - 1e-6)).padStart(2, "0");
  M.texto(c, num, 0, r * 0.3, { f: M.fuente(800, r * 0.82, "JetBrains Mono"), color: claro ? C.tinta : C.texto, al: "center", registrar: kv > 0.95 || kv === 0 });
  c.restore();
}

// ════════════════════════════ 1 · MICROPLANOS: copiar, pegar, responder, buscar, otra vez ════════════════════════════
function ui_marco(x, y, w, h, titulo) {
  M.rr(c, x, y, w, h, 18); c.fillStyle = C.panel; c.fill(); c.strokeStyle = C.linea; c.lineWidth = 2; c.stroke();
  if (titulo) M.texto(c, titulo, x + 28, y + 50, { f: MONO(500, 22), color: C.tenue, track: 2, registrar: false });
}
function lineas(x, y, w, n, alto, r, color = "#2c2c35") {
  for (let i = 0; i < n; i++) { const ww = w * (0.45 + 0.55 * r()); M.rr(c, x, y + i * alto, ww, alto * 0.42, 6); c.fillStyle = color; c.fill(); }
}
const PLANOS = [
  function correo(t, r) {                     // bandeja de entrada saturada
    ui_marco(160, 90, 1600, 900, "BANDEJA DE ENTRADA · 128 SIN LEER");
    const asuntos = ["Re: Re: Fwd: presupuesto actualizado", "¿Me confirmas los datos del cliente?", "URGENTE: factura sin enviar",
      "Re: ¿quién tiene la última versión?", "Recordatorio: informe semanal", "Fwd: Fwd: datos para el Excel", "Re: lo mismo que ayer"];
    asuntos.forEach((s, i) => {
      const y = 170 + i * 112; c.fillStyle = i % 2 ? "#17171c" : "#1c1c23"; c.fillRect(162, y, 1596, 110);
      c.fillStyle = C.rojo; c.beginPath(); c.arc(214, y + 55, 9, 0, 7); c.fill();
      M.texto(c, s, 250, y + 66, { f: F(i < 3 ? 700 : 500, 40), color: i < 3 ? C.texto : C.tenue, registrar: false });
      M.texto(c, ["09:02", "09:07", "09:11", "09:12", "09:20", "09:31", "09:33"][i], 1700, y + 66, { f: MONO(500, 28), color: C.tenue, al: "right", registrar: false });
    });
  },
  function hoja(t, r) {                       // hoja de cálculo: selección copiándose
    c.fillStyle = "#101014"; c.fillRect(0, 0, W, H);
    const cw = 250, ch = 76;
    for (let i = 0; i < 9; i++) for (let j = 0; j < 15; j++) {
      const x = 40 + i * cw, y = 40 + j * ch;
      c.strokeStyle = "#24242b"; c.lineWidth = 2; c.strokeRect(x, y, cw, ch);
      if (j === 0) M.texto(c, "ABCDEFGHI"[i], x + cw / 2, y + 50, { f: MONO(600, 30), color: C.tenue, al: "center", registrar: false });
      else if (i > 0) M.texto(c, (1000 + ((hash(i * 31 + j) * 90000) | 0)).toLocaleString("es-ES") + ",00", x + cw - 18, y + 50, { f: MONO(400, 28), color: "#b9b9c4", al: "right", registrar: false });
      else M.texto(c, String(j + 1), x + cw / 2, y + 50, { f: MONO(400, 28), color: C.tenue, al: "center", registrar: false });
    }
    c.save(); c.setLineDash([18, 12]); c.lineDashOffset = -t * 120; c.strokeStyle = "#35c46a"; c.lineWidth = 5;
    c.strokeRect(40 + cw, 40 + ch * 3, cw * 3, ch * 6); c.restore();
  },
  function chat(t, r) {                       // chat: las mismas preguntas
    c.fillStyle = "#0f1013"; c.fillRect(0, 0, W, H);
    const b = [["¿Me pasas el Excel de ayer?", 0], ["¿Cuál, el final o el final2?", 1], ["¿Dónde está la factura de marzo?", 0],
               ["¿Quién llamó al cliente?", 0], ["Te lo reenvío otra vez", 1]];
    b.forEach(([s, yo], i) => {
      const w = M.ancho(c, s, F(500, 50)) + 80, x = yo ? 1760 - w : 160, y = 110 + i * 180;
      M.rr(c, x, y, w, 130, 40); c.fillStyle = yo ? "#2b2f3a" : "#1d1d24"; c.fill();
      M.texto(c, s, x + 40, y + 82, { f: F(500, 50), color: C.texto, registrar: false });
    });
    for (let k = 0; k < 3; k++) { c.fillStyle = C.tenue; c.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(t * 8 + k)); c.beginPath(); c.arc(200 + k * 36, 1020, 11, 0, 7); c.fill(); }
    c.globalAlpha = 1;
  },
  function factura(t, r) {                    // factura en papel, pendiente
    c.fillStyle = "#1a1a1f"; c.fillRect(0, 0, W, H);
    c.save(); c.translate(960, 560); c.rotate(-0.04); c.fillStyle = "#eceae4"; c.fillRect(-620, -560, 1240, 1300);
    M.texto(c, "FACTURA", -540, -420, { f: F(800, 96), color: "#1a1a1a", registrar: false });
    M.texto(c, "Nº 2026-0187", -540, -350, { f: MONO(500, 40), color: "#444", registrar: false });
    for (let i = 0; i < 6; i++) { c.fillStyle = "#c9c6bd"; c.fillRect(-540, -240 + i * 90, 1080, 3);
      M.texto(c, ["Servicio", "Horas", "Material", "Desplazamiento", "Revisión", "Total"][i], -540, -262 + i * 90, { f: F(500, 36), color: "#333", registrar: false });
      M.texto(c, ["1.200,00", "640,00", "310,50", "90,00", "150,00", "2.390,50 €"][i], 540, -262 + i * 90, { f: MONO(500, 36), color: "#333", al: "right", registrar: false }); }
    c.rotate(0.12); c.strokeStyle = C.rojo; c.lineWidth = 10; c.strokeRect(80, 240, 520, 150);
    M.texto(c, "PENDIENTE", 340, 345, { f: F(900, 84), color: C.rojo, al: "center", registrar: false });
    c.restore();
  },
  function llamada(t, r) {                    // llamada entrante que interrumpe
    c.fillStyle = "#0c0d10"; c.fillRect(0, 0, W, H);
    for (let k = 0; k < 3; k++) { const a = ((t * 1.4 + k / 3) % 1); c.strokeStyle = `rgba(255,255,255,${0.25 * (1 - a)})`; c.lineWidth = 4;
      c.beginPath(); c.arc(960, 430, 140 + a * 260, 0, 7); c.stroke(); }
    c.fillStyle = "#2b2f3a"; c.beginPath(); c.arc(960, 430, 140, 0, 7); c.fill();
    M.texto(c, "Cliente", 960, 700, { f: F(700, 76), color: C.texto, al: "center", registrar: false });
    M.texto(c, "Llamada entrante… (4ª hoy)", 960, 770, { f: F(400, 40), color: C.tenue, al: "center", registrar: false });
    [[760, "#e5484d"], [1160, "#30a46c"]].forEach(([x, col]) => { c.fillStyle = col; c.beginPath(); c.arc(x, 880, 56, 0, 7); c.fill(); });
  },
  function menu(t, r) {                       // copiar / pegar, con el cursor
    c.fillStyle = "#121216"; c.fillRect(0, 0, W, H); lineas(140, 120, 1100, 9, 100, r);
    ui_marco(900, 250, 700, 560, "");
    ["Cortar", "Copiar", "Pegar", "Pegar sin formato", "Duplicar"].forEach((s, i) => {
      const y = 290 + i * 100; if (i === 2) { M.rr(c, 920, y, 660, 90, 12); c.fillStyle = "#2f6bff55"; c.fill(); }
      M.texto(c, s, 960, y + 60, { f: F(500, 46), color: C.texto, registrar: false });
      M.texto(c, ["Ctrl X", "Ctrl C", "Ctrl V", "Ctrl ⇧ V", "Ctrl D"][i], 1550, y + 60, { f: MONO(400, 32), color: C.tenue, al: "right", registrar: false });
    });
    c.save(); c.translate(1300 + Math.sin(t * 9) * 6, 540); c.fillStyle = "#fff"; c.strokeStyle = "#000"; c.lineWidth = 3;
    c.beginPath(); c.moveTo(0, 0); c.lineTo(0, 70); c.lineTo(18, 54); c.lineTo(32, 84); c.lineTo(44, 78); c.lineTo(30, 50); c.lineTo(52, 50); c.closePath(); c.fill(); c.stroke(); c.restore();
  },
  function agenda(t, r) {                     // agenda: todo se pisa
    c.fillStyle = "#0e0f12"; c.fillRect(0, 0, W, H);
    ["LUN", "MAR", "MIÉ", "JUE", "VIE"].forEach((d, i) => { M.texto(c, d, 230 + i * 340, 90, { f: MONO(600, 34), color: C.tenue, al: "center", registrar: false });
      c.fillStyle = "#1f1f26"; c.fillRect(62 + i * 340, 120, 2, 940); });

    // la composición entera se encoge hacia el píxel del logotipo
    const s = lerp(1, 0.0, k);
    if (s > 0.02) { c.save(); c.translate(lerp(960, px, k), lerp(540, py, k)); c.scale(s, s); c.translate(-1130, -560);
      c.globalAlpha = 1 - k * 0.2; tarjetaIA(1290, 110, t, PROD); tarjetaFlujo(1360, 560, t, PROD); tarjetaHoy(700, 440, t, PROD); c.restore(); c.globalAlpha = 1; }
    const lado = lerp(40, 15 / 100 * alto, k); c.globalAlpha = eOut(k); c.fillStyle = C.pixel;
    c.fillRect(lerp(960, px, k) - lado / 2, lerp(540, py, k) - lado / 2, lado, lado); c.globalAlpha = 1;
  } else {
    c.fillStyle = C.claro; c.fillRect(0, 0, W, H);        // corte seco a blanco en el «tic»
    const kl = prog(t, TICK, TICK + 0.7);
    const ko = prog(t, TICK, TICK + 0.6); if (ko < 1) { c.strokeStyle = `rgba(91,140,255,${1 - ko})`; c.lineWidth = 3; c.beginPath(); c.arc(px, py, 10 + ko * 160, 0, 7); c.stroke(); }
    M.logo(c, x0, y0, alto, C.tinta, C.pixel, kl, 1);
    const tM = V.c8.t0; const kM = eOut5(prog(t, tM, tM + 0.35));
    c.save(); c.beginPath(); c.rect(x0 + wLogo + gap - 10, y0 - 40, wM + 40, alto + 80); c.clip();
    M.texto(c, "D-Code Partners", x0 + wLogo + gap - (1 - kM) * 60, y0 + alto * 0.72, { f: fM, color: C.tinta, alpha: kM, track: -3 }); c.restore();
    const pa = V.c9.palabras; const fL = F(500, 52); const totL = pa.reduce((s, p) => s + M.ancho(c, p.w + " ", fL, -1), 0); let x = 960 - totL / 2;
    pa.forEach((p) => { const kk = eOut5(prog(t, p.t0 - 0.05, p.t0 + 0.25)); M.texto(c, p.w, x, 740 + (1 - kk) * 16, { f: fL, color: C.gris2, alpha: kk, track: -1 }); x += M.ancho(c, p.w + " ", fL, -1); });
    const kU = eOut(prog(t, V.c9.t0 + 0.6, V.c9.t0 + 1.0));
    c.save(); c.globalAlpha = kU; const fu = F(700, 44), tx = "Cuéntanos tu caso  →  dcodepartners.com"; const wu = M.ancho(c, tx, fu) + 90;
    M.rr(c, 960 - wu / 2, 830 + (1 - kU) * 20, wu, 96, 48); c.fillStyle = C.azul; c.fill();
    M.texto(c, tx, 960, 894 + (1 - kU) * 20, { f: fu, color: "#ffffff", al: "center" }); c.restore();
  }
}

// ════════════════════════════ firma de esquina: después del segundo 5 (el logo antes del «saltar» sube los saltos) ════════════════════════════
function firma(t) {
  let a = eOut(prog(t, SKIP + 0.2, SKIP + 0.6));
  if (t >= SIL0 - 0.08 && t < SIL1 + 0.3) a = 0;
  if (t > SIL1 + 0.3 && t > SKIP) a = Math.min(a, eOut(prog(t, SIL1 + 0.3, SIL1 + 0.8)));
  if (t > FIN) a *= 1 - eIn(prog(t, FIN, FIN + 0.3));
  if (a <= 0) return;
  const claro = t >= G0 && t < PROD - 0.1;
  c.save(); c.globalAlpha = a * 0.9;
  M.logo(c, 96, 58, 34, claro ? C.tinta : "#ffffff", C.pixel);
  M.texto(c, "D-Code Partners", 96 + 34 * 1.2 + 14, 58 + 26, { f: F(650, 26), color: claro ? C.tinta : "#ffffff", track: -0.5 });
  c.restore();
}

// ════════════════════════════ fotograma ════════════════════════════
window.pintaFrame = (n) => {
  const t = n / FPS; M.CAJAS.length = 0; c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1;
  if (t < HOOK) intro(t, n);
  else if (t < SIL0) gancho(t, n);
  else if (t < SIL1) { c.fillStyle = "#000"; c.fillRect(0, 0, W, H); return; }
  else if (t < PR0) frase(t);
  else if (t < G0 - 0.12) { problema(t, n); if (t < PR0 + 0.35) { c.globalAlpha = 1 - eOut(prog(t, PR0, PR0 + 0.35)); frase(t); c.globalAlpha = 1; } }
  else if (t < G0) { c.fillStyle = "#000"; c.fillRect(0, 0, W, H); }
  else if (t < PROD) sistema(t, n);
  else if (t < FIN) producto(t, n);
  else cierre(t, n);
  const fl = Math.max(1 - prog(t, G0, G0 + 0.3), 0) * (t >= G0 ? 1 : 0);
  if (fl > 0) { c.fillStyle = `rgba(255,255,255,${fl})`; c.fillRect(0, 0, W, H); }
  const fl2 = t >= CF && t < CF + 0.25 ? 1 - prog(t, CF, CF + 0.25) : 0;       // la cuenta llega a cero: destello cálido
  if (fl2 > 0) { c.fillStyle = `rgba(255,176,32,${fl2 * 0.35})`; c.fillRect(0, 0, W, H); }
  cuenta(t);
  firma(t);
  M.grano(c, W, H, n, t >= G0 && t < PROD || t > TICK ? 0.035 : 0.07);
};
