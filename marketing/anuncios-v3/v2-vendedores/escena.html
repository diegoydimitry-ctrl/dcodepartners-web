<script>
"use strict";
// SE BUSCAN COMERCIALES — Reels / Stories (9:16). Un solo sistema visual: negro tinta, crema y UN acento naranja.
// El mensaje entero (buscamos comerciales · toda España · sin estudios ni experiencia · 50 %) se entiende en los
// primeros 7 segundos y queda fijo en una cinta superior para quien entra a mitad de vídeo.
// Todo el texto vive entre y=270 y y=1650 (lo demás lo tapa la interfaz) y a 64 px de los lados.
const W = 1080, H = 1920, FPS = 30;
const D = window.DATOS, MT = D.montaje;
const V = Object.fromEntries(MT.voz.map((f) => [f.id, f]));
window.META = { W, H, fps: FPS, duracion: MT.duracion, segura: [64, 270, 1016, 1650], minpx: 30 };
const c = document.getElementById("c").getContext("2d");
const { clamp, lerp, prog, eOut, eOut5, eIn, eIO, muelle, hash } = M;
const C = { tinta: "#0d0d0f", tinta2: "#18181c", crema: "#f3eee4", tenue: "#8d887e", naranja: "#ff5b1f", pixel: "#5b8cff" };
const A = (px) => `400 ${px}px "Anton"`;
const R = (p, px) => `${p} ${px}px "Archivo"`;
const MONO = (p, px) => M.fuente(p, px, "JetBrains Mono");
const pal = (id, w) => V[id].palabras.find((p) => p.w.toLowerCase().replace(/[^\wáéíóúñü%-]/g, "").startsWith(w)) || V[id].palabras[0];
const ajusta = (s, fam, anchoMax, pxMax) => Math.min(pxMax, (100 * anchoMax) / M.ancho(c, s, fam(100)));
const T50 = MT.cincuenta, TCTA = MT.cta, TMARCA = MT.marca;

function fondo(col = C.tinta) { c.fillStyle = col; c.fillRect(0, 0, W, H); }
function cartel(s, x, y, px, color, t0, t, o = {}) {
  const k = muelle(prog(t, t0 - 0.03, t0 + 0.3), 3, 6), e = eOut5(prog(t, t0 - 0.03, t0 + 0.06));
  if (e <= 0) return 0;
  c.save(); c.translate(x, y); const w_ = M.ancho(c, s, (o.fam || A)(px), o.track ?? 0), s_ = lerp(Math.min(o.desde ?? 1.18, Math.max(1, 930 / w_)), 1, k); c.scale(s_, s_);
  M.texto(c, s, 0, 0, { f: (o.fam || A)(px), color, al: o.al || "center", base: "middle", alpha: e * (o.alpha ?? 1), track: o.track ?? 0 });
  c.restore(); return e;
}
const vis = (t, t0, t1, ent = 0.12, sal = 0.14) => Math.min(eOut5(prog(t, t0 - 0.02, t0 + ent)), 1 - eIn(prog(t, t1 - sal, t1)));

// ─── mapa de España (península, Baleares y Canarias en recuadro) ───
const PEN = [[-9.3,43.0],[-8.9,43.4],[-8.2,43.7],[-7.0,43.55],[-5.8,43.6],[-4.5,43.4],[-3.4,43.45],[-2.0,43.35],[-1.8,43.38],[-1.4,43.05],[-0.7,42.8],[0.7,42.85],[1.4,42.6],[2.1,42.45],[3.2,42.35],[3.2,41.9],[2.4,41.5],[1.0,41.1],[0.7,40.7],[-0.1,40.0],[-0.3,39.5],[0.2,38.8],[-0.5,38.3],[-0.7,37.6],[-1.3,37.55],[-1.9,36.95],[-2.2,36.7],[-3.5,36.72],[-4.4,36.7],[-5.3,36.2],[-5.6,36.0],[-6.2,36.4],[-6.4,36.8],[-7.4,37.2],[-7.5,37.6],[-7.0,38.2],[-7.3,38.8],[-7.0,39.5],[-7.5,39.7],[-6.9,40.2],[-6.9,41.0],[-6.2,41.6],[-6.6,41.95],[-8.2,41.9],[-8.9,41.9],[-8.9,42.5]];
const MALL = [[2.35,39.55],[2.7,39.95],[3.25,39.75],[3.45,39.6],[3.1,39.3],[2.75,39.35]];
const CIUDADES = [[-3.7,40.42],[2.17,41.39],[-0.38,39.47],[-5.98,37.39],[-4.42,36.72],[-2.93,43.26],[-5.66,43.54],[-0.88,41.65],[-8.41,43.36],[-1.13,37.99],[-4.72,41.65],[-0.48,38.35],[-3.6,37.18],[2.65,39.57],[-6.97,38.88],[-5.85,43.36],[-2.45,42.46],[-3.8,43.46]];
function proy(lon, lat, cx, cy, k) { return [cx + (lon + 3.0) * 0.766 * k, cy + (40.0 - lat) * k]; }
function mapa(t, cx, cy, k, t0, alpha = 1, pulso = 0) {
  if (alpha <= 0) return;
  c.save(); c.globalAlpha *= alpha;
  const traza = (pts) => { c.beginPath(); pts.forEach(([lo, la], i) => { const [x, y] = proy(lo, la, cx, cy, k); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.closePath(); };
  const kd = prog(t, t0, t0 + 0.7);
  for (const P of [PEN, MALL]) { c.save(); traza(P); c.clip();
    const paso = 17; for (let x = cx - 6.5 * 0.766 * k; x < cx + 6.5 * 0.766 * k; x += paso) for (let y = cy - 4.2 * k; y < cy + 4.5 * k; y += paso) {
      const a = clamp(kd * 1.6 - (x - (cx - 5 * k)) / (10 * k)); if (a <= 0) continue;
      c.fillStyle = `rgba(243,238,228,${0.28 * a})`; c.beginPath(); c.arc(x, y, 2.6, 0, 7); c.fill(); }
    c.restore(); traza(P); c.strokeStyle = `rgba(243,238,228,${0.55 * kd})`; c.lineWidth = 2.5; c.stroke(); }
  const [bx, by] = [cx - 5.6 * 0.766 * k, cy + 3.2 * k];
  c.strokeStyle = `rgba(243,238,228,${0.35 * kd})`; c.lineWidth = 2; c.strokeRect(bx, by, 170, 80);
  [[20, 45], [52, 50], [80, 40], [108, 38], [140, 30]].forEach(([dx, dy], i) => { c.fillStyle = `rgba(243,238,228,${0.5 * kd})`; c.beginPath(); c.ellipse(bx + dx, by + dy, 11 - i, 7, 0.3, 0, 7); c.fill(); });
  CIUDADES.forEach(([lo, la], i) => { const [x, y] = proy(lo, la, cx, cy, k); const kc = prog(t, t0 + 0.25 + i * 0.05, t0 + 0.45 + i * 0.05);
    if (kc <= 0) return; const lat = pulso ? 0.5 + 0.5 * Math.sin(t * 5 + i) : 0; const ph = (t * 1.2 + i * 0.13) % 1;
    c.fillStyle = `rgba(255,91,31,${0.25 * (1 - ph)})`; c.beginPath(); c.arc(x, y, 10 + ph * 34, 0, 7); c.fill();
    c.fillStyle = C.naranja; c.beginPath(); c.arc(x, y, (7 + 3 * lat) * eOut5(kc), 0, 7); c.fill(); });
  c.restore();
}

// ─── cinta superior fija: el mensaje entero, siempre a la vista ───
function cinta(t) {
  const a = eOut(prog(t, V.v2.t0 - 0.2, V.v2.t0 + 0.2)) * (1 - eIn(prog(t, TMARCA - 0.2, TMARCA + 0.2)));
  if (a <= 0) return;
  const s = "SE BUSCAN COMERCIALES  ·  TODA ESPAÑA  ·  SIN ESTUDIOS NI EXPERIENCIA  ·  50 % DE CADA VENTA  ·  ";
  const f = MONO(700, 30); const w = M.ancho(c, s, f, 2); const off = (t * 90) % w;
  c.save(); c.globalAlpha = a; c.fillStyle = C.naranja; c.fillRect(0, 282, W, 58);
  c.beginPath(); c.rect(64, 282, W - 128, 58); c.clip();
  for (let x = 64 - off; x < W; x += w) M.texto(c, s, x, 322, { f, color: C.tinta, track: 2, registrar: false });
  c.restore();
}

// ════════════════ escenas ════════════════
function e1(t) {                // Buscamos comerciales en toda España — y desde el fotograma 0, la oferta entera
  const a = vis(t, -1, V.v2.t0); if (a <= 0) return;
  c.save(); c.globalAlpha = a;
  const pop = (t0, dur = 0.16) => eOut5(prog(t, t0, t0 + dur));
  cartel("BUSCAMOS", 540, 420, 130, C.crema, 0.0, t, { desde: 1.2 });
  const tC = pal("v1", "comerciales").t0, tE = V.v1.t1 - 0.1;
  const kC = pop(0.05); const pulso = 1 + 0.05 * Math.exp(-Math.max(0, t - tC) * 6) * (t > tC ? 1 : 0);
  c.save(); c.translate(540, 600); c.scale(lerp(1.1, 1, muelle(prog(t, 0.05, 0.4), 3, 6)) * pulso, lerp(1.1, 1, muelle(prog(t, 0.05, 0.4), 3, 6)) * pulso);
  M.texto(c, "COMERCIALES", 0, 0, { f: A(ajusta("COMERCIALES", A, 840, 250)), color: C.naranja, al: "center", base: "middle", alpha: kC }); c.restore();
  // requisitos (ninguno) y alcance, en pastillas
  const pill = (txt, x, y, t0, lleno) => { const k = pop(t0); if (k <= 0) return; const f = A(62); const w = M.ancho(c, txt, f) + 64;
    c.save(); c.globalAlpha *= k; c.translate(0, (1 - k) * 30); M.rr(c, x - w / 2, y - 52, w, 104, 52);
    if (lleno) { c.fillStyle = C.crema; c.fill(); } else { c.strokeStyle = C.crema; c.lineWidth = 4; c.stroke(); }
    M.texto(c, txt, x, y + 2, { f, color: lleno ? C.tinta : C.crema, al: "center", base: "middle" }); c.restore(); };
  pill("SIN ESTUDIOS", 300, 800, 0.15); pill("SIN EXPERIENCIA", 745, 800, 0.2);
  const kE = t > tE ? 1 + 0.1 * Math.exp(-(t - tE) * 6) : 1;
  c.save(); c.translate(540, 930); c.scale(kE, kE); c.translate(-540, -930); pill("EN TODA ESPAÑA", 540, 930, 0.25, true); c.restore();
  // la cifra
  const k5 = pop(0.3, 0.25);
  if (k5 > 0) { c.save(); c.globalAlpha *= k5; c.translate(0, (1 - k5) * 40);
    M.rr(c, 110, 1060, 860, 420, 36); c.fillStyle = C.naranja; c.fill();
    M.texto(c, "50%", 540, 1250, { f: A(250), color: C.tinta, al: "center", base: "middle" });
    M.texto(c, "DE CADA VENTA, PARA TI", 540, 1410, { f: A(70), color: C.tinta, al: "center", base: "middle" }); c.restore(); }
  c.restore();
}
// «…» mientras la pregunta espera respuesta (la pausa también se ve)
function puntos(t, x, y, t0, t1) { if (t < t0 || t > t1) return;
  for (let i = 0; i < 3; i++) { const k = 0.35 + 0.65 * Math.max(0, Math.sin((t - t0) * 7 - i * 0.9));
    c.fillStyle = C.naranja; c.globalAlpha *= 1; c.beginPath(); c.arc(x + (i - 1) * 46, y, 11 * k + 4, 0, 7); c.fill(); } }
function e2(t) {                // ¿Necesitas estudios? ¿Experiencia? — (pausa) — No. No te hace falta.
  const a = vis(t, V.v2.t0, V.v3a.t0); if (a <= 0) return;
  c.save(); c.globalAlpha = a;
  const tR = V.v2b.t0;   // la respuesta
  const x = 120, y = 430, w = 840, h = 420; M.rr(c, x, y, w, h, 28); c.fillStyle = C.tinta2; c.fill(); c.strokeStyle = "#2a2a30"; c.lineWidth = 2; c.stroke();
  M.texto(c, "REQUISITOS", x + 50, y + 80, { f: MONO(700, 34), color: C.tenue, track: 6 });
  [["Título universitario", tR + 0.05], ["Experiencia en ventas", tR + 0.35], ["Saber programar", tR + 0.65]].forEach(([s, tt], i) => {
    const yy = y + 170 + i * 90; const k = eIO(prog(t, tt, tt + 0.28));
    M.texto(c, s, x + 50, yy, { f: R(700, 50), color: k > 0.5 ? "#6e6a63" : C.crema });
    if (k > 0) { const ww = M.ancho(c, s, R(700, 50)); c.fillStyle = C.naranja; c.fillRect(x + 44, yy - 20, (ww + 14) * k, 8); }
  });
  // la pregunta, mientras se hace (y la pausa): se va cuando llega la respuesta
  const kq = 1 - eIn(prog(t, tR - 0.12, tR + 0.05));
  if (kq > 0) { c.save(); c.globalAlpha *= kq; cartel("¿ESTUDIOS?", 540, 1060, 150, C.tenue, V.v2.t0, t, { desde: 1.08 });
    cartel("¿EXPERIENCIA?", 540, 1230, ajusta("¿EXPERIENCIA?", A, 940, 150), C.tenue, pal("v2", "experiencia").t0, t, { desde: 1.08 }); puntos(t, 540, 1420, V.v2.t1, tR); c.restore(); }
  if (t >= tR - 0.03) {
  cartel("SIN ESTUDIOS.", 540, 1060, 150, C.crema, tR, t);
  cartel("SIN EXPERIENCIA.", 540, 1230, ajusta("SIN EXPERIENCIA.", A, 940, 150), C.naranja, tR + 0.3, t);
  }
  c.restore();
}
function e3(t) {                // Y te llevas el 50 % de cada venta.  (el único momento con fondo naranja)
  const a = vis(t, V.v3a.t0, V.v4q.t0, 0.06); if (a <= 0) return;
  const p5 = pal("v3", "50").t0;
  c.save(); c.globalAlpha = a;
  if (t < p5 - 0.06) { cartel("Y LO MEJOR…", 540, 820, 150, C.crema, V.v3a.t0, t, { desde: 1.08 }); cartel("TE LLEVAS EL", 540, 1000, 110, C.naranja, V.v3.t0, t, { desde: 1.08 }); }
  else {
    const dt = t - p5; fondo(dt < 0.07 ? C.crema : C.naranja);
    M.texto(c, "TE LLEVAS EL", 540, 470, { f: A(96), color: C.tinta, al: "center", base: "middle" });
    const kk = muelle(prog(dt, 0, 0.45), 2.5, 5.5); const sh = dt < 0.25 ? (hash(Math.floor(dt * 60)) - 0.5) * 24 * (1 - dt / 0.25) : 0;
    c.save(); c.translate(540 + sh, 880); c.scale(lerp(1.3, 1, kk), lerp(1.3, 1, kk));
    M.texto(c, "50%", 0, 0, { f: A(ajusta("50%", A, 700, 460)), color: C.tinta, al: "center", base: "middle" }); c.restore();
    cartel("DE CADA VENTA", 540, 1270, 120, C.tinta, pal("v3", "cada").t0, t, { desde: 1.1 });
    const kc = eOut(prog(t, p5 + 0.3, p5 + 0.6));
    c.save(); c.globalAlpha *= kc; M.rr(c, 250, 1400, 580, 70, 35); c.fillStyle = C.tinta; c.fill();
    M.texto(c, "PARA TI, EN COMISIÓN", 540, 1447, { f: MONO(700, 32), color: C.naranja, al: "center", track: 3 }); c.restore();
  }
  c.restore();
}
function e4(t) {                // ¿Qué vendes? Automatización e inteligencia artificial para empresas.
  const a = vis(t, V.v4q.t0, V.v5.t0); if (a <= 0) return;
  c.save(); c.globalAlpha = a;
  cartel("¿QUÉ VENDERÍAS?", 540, 470, ajusta("¿QUÉ VENDERÍAS?", A, 940, 150), C.crema, V.v4q.t0, t);
  puntos(t, 540, 900, V.v4q.t1, V.v4.t0);
  [["automatización", "AUTOMATIZACIÓN", "Tareas que se hacen solas"], ["inteligencia", "INTELIGENCIA ARTIFICIAL", "Asistentes que responden por ti"]].forEach(([w, s, sub], i) => {
    const tt = pal("v4", w).t0; const k = eOut5(prog(t, tt - 0.08, tt + 0.2)); if (k <= 0) return;
    const y = 640 + i * 300; c.save(); c.translate((1 - k) * 80, 0); c.globalAlpha *= k;
    M.rr(c, 90, y, 900, 250, 30); c.fillStyle = C.tinta2; c.fill(); c.fillStyle = C.naranja; c.fillRect(90, y + 30, 10, 190);
    M.texto(c, s, 140, y + 120, { f: A(ajusta(s, A, 800, 96)), color: C.crema });
    M.texto(c, sub, 142, y + 190, { f: R(600, 42), color: C.tenue }); c.restore(); });
  const tE = pal("v4", "empresas").t0; const ke = eOut5(prog(t, tE - 0.1, tE + 0.2));
  c.save(); c.globalAlpha *= ke; M.texto(c, "PARA EMPRESAS", 540, 1310, { f: A(96), color: C.naranja, al: "center" }); c.restore();
  c.restore();
}
function e5(t) {                // Tú consigues el cliente. Nosotros lo construimos todo.
  const a = vis(t, V.v5.t0, TCTA); if (a <= 0) return;
  c.save(); c.globalAlpha = a;
  const fila = (y, quien, que, t0, col) => { const k = eOut5(prog(t, t0 - 0.06, t0 + 0.22)); if (k <= 0) return;
    c.save(); c.globalAlpha *= k; c.translate(0, (1 - k) * 40);
    M.texto(c, quien, 90, y, { f: A(170), color: col });
    M.texto(c, que, 94, y + 100, { f: R(700, 60), color: C.crema }); c.restore(); };
  fila(620, "TÚ", "encuentras al cliente.", V.v5.t0, C.naranja);
  const kl = eIO(prog(t, V.v6.t0 - 0.15, V.v6.t0 + 0.2)); c.fillStyle = "#2c2c32"; c.fillRect(90, 800, 900 * kl, 4);
  fila(1010, "NOSOTROS", "lo construimos todo.", V.v6.t0, C.crema);
  const kL = prog(t, V.v6.t0 + 0.3, V.v6.t0 + 0.9); M.logo(c, 90, 1200, 90, C.crema, C.pixel, kL, clamp(kL * 2 - 1));
  M.texto(c, "D-Code Partners", 210, 1268, { f: R(800, 50), color: C.crema, alpha: eOut(prog(t, V.v6.t0 + 0.5, V.v6.t0 + 0.8)) });
  c.restore();
}
function e6(t) {                // No necesitas saber programar. Y trabajas desde tu ciudad.
  if (!V.v7) return;       // v5: esta escena ya no está en el guion (se quitó para dar pausas a la voz)
  const a = vis(t, V.v7.t0, TCTA); if (a <= 0) return;
  c.save(); c.globalAlpha = a;
  const tP = pal("v7", "programar").t0;
  const k1 = 1 - eIn(prog(t, V.v8.t0 - 0.2, V.v8.t0 + 0.05));
  if (k1 > 0) { c.save(); c.globalAlpha *= k1;
    cartel("NO NECESITAS", 540, 640, 130, C.crema, V.v7.t0, t, { desde: 1.08 });
    cartel("SABER PROGRAMAR.", 540, 790, ajusta("SABER PROGRAMAR.", A, 940, 130), C.crema, pal("v7", "saber").t0, t, { desde: 1.08 });
    const k = muelle(prog(t, tP - 0.05, tP + 0.4), 3, 6); c.save(); c.translate(540, 1180); c.scale(lerp(0.8, 1.35, k), lerp(0.8, 1.35, k)); c.globalAlpha *= clamp(k * 2);
    M.texto(c, "</>", 0, 0, { f: MONO(800, 230), color: "#55555e", al: "center", base: "middle", registrar: false });
    const kx = eIO(prog(t, tP + 0.15, tP + 0.4)); c.strokeStyle = C.naranja; c.lineWidth = 22; c.lineCap = "round";
    c.beginPath(); c.moveTo(-260, 90); c.lineTo(lerp(-260, 260, kx), lerp(90, -90, kx)); c.stroke(); c.restore(); c.restore(); }
  if (t > V.v8.t0 - 0.15) {
    cartel("DESDE TU CIUDAD.", 540, 470, ajusta("DESDE TU CIUDAD.", A, 940, 140), C.crema, V.v8.t0, t, { desde: 1.1 });
    mapa(t, 540, 1030, 62, V.v8.t0 - 0.2, eOut(prog(t, V.v8.t0 - 0.2, V.v8.t0 + 0.2)), 1);
  }
  c.restore();
}
function e7(t) {                // ¿Te interesa? Escríbenos… + Vende con D-Code Partners.
  const a = eOut5(prog(t, TCTA - 0.02, TCTA + 0.12)); if (a <= 0) return;
  c.save(); c.globalAlpha = a;
  const tI = pal("v9", "instagram").t0, tC = pal("v9", "correo").t0, tE = pal("v9", "escríbenos").t0;
  cartel("¿TE INTERESA?", 540, 450, ajusta("¿TE INTERESA?", A, 940, 160), C.crema, TCTA, t);
  puntos(t, 540, 800, V.v9q.t1, V.v9.t0);
  cartel("ESCRÍBENOS", 540, 610, 96, C.naranja, tE, t, { desde: 1.08 });
  const fila = (y, k, dibIcono, texto, lleno) => { if (k <= 0) return; c.save(); c.globalAlpha *= k; c.translate((1 - k) * -60, 0);
    M.rr(c, 90, y, 900, 140, 70); c.fillStyle = lleno ? C.naranja : "#1d1d22"; c.fill();
    dibIcono(185, y + 70, lleno ? C.tinta : C.naranja);
    M.texto(c, texto, 260, y + 88, { f: R(800, ajusta(texto, (px) => R(800, px), 690, 52)), color: lleno ? C.tinta : C.crema }); c.restore(); };
  fila(700, eOut5(prog(t, tI - 0.1, tI + 0.2)), (x, y, col) => { c.save(); c.translate(x, y); c.rotate(-0.4); c.strokeStyle = col; c.lineWidth = 7; c.lineJoin = "round";
      c.beginPath(); c.moveTo(-40, 0); c.lineTo(42, -34); c.lineTo(10, 40); c.lineTo(0, 8); c.closePath(); c.moveTo(0, 8); c.lineTo(42, -34); c.stroke(); c.restore(); },
    "Mensaje por Instagram", false);
  fila(870, eOut5(prog(t, tC - 0.1, tC + 0.2)), (x, y, col) => { c.save(); c.translate(x, y); c.strokeStyle = col; c.lineWidth = 7; c.lineJoin = "round"; c.strokeRect(-40, -28, 80, 56);
      c.beginPath(); c.moveTo(-40, -28); c.lineTo(0, 6); c.lineTo(40, -28); c.stroke(); c.restore(); },
    "dcodedepartment@gmail.com", true);
  const kM = eOut5(prog(t, TMARCA - 0.05, TMARCA + 0.3));
  if (kM > 0) {
    M.texto(c, "VENDE CON", 540, 1170 + (1 - kM) * 30, { f: A(96), color: C.tenue, al: "center", alpha: kM });
    const tD = pal("v10", "d-code").t0; const kL = prog(t, tD - 0.1, tD + 0.5);
    const fM = R(800, 78); const wM = M.ancho(c, "D-Code Partners", fM, -1); const al = 96, tot = al * 1.2 + 30 + wM, x0 = 540 - tot / 2;
    M.logo(c, x0, 1240, al, C.crema, C.pixel, kL, prog(t, tD + 0.25, tD + 0.45));
    M.texto(c, "D-Code Partners", x0 + al * 1.2 + 30, 1240 + al * 0.74, { f: fM, color: C.crema, alpha: eOut5(prog(t, tD, tD + 0.3)), track: -1 });
    const ts = V.v10.t1 + 0.35; const ks = prog(t, ts - 0.08, ts);                         // sello final
    if (ks > 0) { const e = t < ts ? eIn(ks) : 1; c.save(); c.translate(540, 1450); c.rotate(-0.06); const s = lerp(1.5, 1, e); c.scale(s, s); c.globalAlpha *= e;
      c.strokeStyle = C.naranja; c.lineWidth = 7; M.rr(c, -300, -60, 600, 120, 16); c.stroke();
      M.texto(c, "50 % DE CADA VENTA", 0, 22, { f: A(64), color: C.naranja, al: "center", track: 2 }); c.restore(); }
  }
  c.restore();
}
