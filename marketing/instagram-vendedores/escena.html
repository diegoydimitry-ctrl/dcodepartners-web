<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>D-Code · anuncio de Instagram · vendedores</title>
<!--
  Anuncio vertical (1080x1920, 30 fps, 24 s) para captar personas que vendan D-Code Partners.

  Revisión 2 (27/09/2026). Dos cosas cambian respecto a la primera versión, las dos por indicación de Dirección:

  1. LA OFERTA VA PRIMERO. Antes el anuncio abría por el problema y la comisión del 50 % no llegaba hasta el
     segundo 19. Quien pasaba de largo en los tres primeros segundos no llegaba a saber de qué iba. Ahora en el
     primer segundo ya se lee QUÉ se vende y CUÁNTO se lleva quien lo venda, y el problema viene después, como
     argumento de por qué se vende solo.
  2. LOS RECUADROS LLEVAN INFORMACIÓN. Las ventanas del tramo del problema eran cajas oscuras con barras sin
     significado. Ahora cada una dice una tarea concreta y reconocible, que es lo que esa persona va a oír en
     las empresas que visite.

  Mismo contrato que marketing/youtube/_build/escena.html:
    window.META  { W, H, FPS, FRAMES } · window.LISTO · window.pintaFrame(n)

  No se inventan condiciones comerciales. Todo lo que afirma la pieza está dado: la comisión del 50 %, el mes de
  servicio real antes de facturar, las zonas desde las que ya se vende y la dirección de la web. No aparece
  ningún dato personal de nadie del equipo.
-->
<style>
  @font-face{font-family:Inter;src:url(../../assets/fonts/inter-variable.woff2)format('woff2');font-weight:100 900;font-display:block}
  @font-face{font-family:'Instrument Serif';src:url(../../assets/fonts/instrumentserif-italic.woff2)format('woff2');font-style:italic;font-display:block}
  @font-face{font-family:'JetBrains Mono';src:url(../../assets/fonts/jetbrainsmono-variable.woff2)format('woff2');font-weight:100 800;font-display:block}
  html,body{margin:0;background:#05070c}
  #c{display:block}
</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, FPS = 30, FRAMES = 720;
window.META = { W, H, FPS, FRAMES };

const c = document.getElementById('c');
const x = c.getContext('2d', { alpha: false });

const BG='#05070c', INK='#ffffff', INK2='#98a3b5', INK3='#5d6982', BLUE='#5b8cff', LINE='rgba(255,255,255,.055)';

/* ---------- utilidades deterministas ---------- */
const cl=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const easeOut=t=>1-Math.pow(1-cl(t),3);
const easeInOut=t=>{t=cl(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const win=(f,ini,fin,sube=12,baja=12)=>{
  if(f<ini||f>fin)return 0;
  return Math.min(easeOut((f-ini)/sube), easeOut((fin-f)/baja));
};
const rnd=i=>{const s=Math.sin(i*127.1+i*i*0.017)*43758.5453;return s-Math.floor(s)};

function txt(s,cx,y,{size=54,weight=600,color=INK,font='Inter',align='center',ls=0,alpha=1,italic=false}={}){
  x.save(); x.globalAlpha*=alpha;
  x.font=`${italic?'italic ':''}${weight} ${size}px "${font}", sans-serif`;
  x.fillStyle=color; x.textAlign=align; x.textBaseline='alphabetic';
  if(ls){
    const chars=[...s]; const wTot=chars.reduce((a,ch)=>a+x.measureText(ch).width+ls,0)-ls;
    let px = align==='center'? cx-wTot/2 : align==='right'? cx-wTot : cx;
    x.textAlign='left';
    for(const ch of chars){ x.fillText(ch,px,y); px+=x.measureText(ch).width+ls; }
  } else x.fillText(s,cx,y);
  x.restore();
}
function parrafo(lineas,cx,y,o={}){
  const lh=o.lh||(o.size||54)*1.24;
  lineas.forEach((l,i)=>{
    if(typeof l==='string') txt(l,cx,y+i*lh,o);
    else txt(l.t,cx,y+i*lh,Object.assign({},o,l));
  });
  return lineas.length*lh;
}
function rr(X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}

function reticula(f,alpha=1){
  x.save(); x.globalAlpha=alpha; x.strokeStyle=LINE; x.lineWidth=1;
  const p=90, desp=(f*0.16)%p;
  for(let i=-1;i*p<W+p;i++){x.beginPath();x.moveTo(i*p+desp,0);x.lineTo(i*p+desp,H);x.stroke();}
  for(let j=-1;j*p<H+p;j++){x.beginPath();x.moveTo(0,j*p+desp*0.5);x.lineTo(W,j*p+desp*0.5);x.stroke();}
  x.restore();
}
function halo(cx,cy,r,a){
  const g=x.createRadialGradient(cx,cy,0,cx,cy,r);
  g.addColorStop(0,`rgba(91,140,255,${a})`); g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g; x.fillRect(cx-r,cy-r,r*2,r*2);
}

/* ---------- logotipo oficial (mismo trazado que la web) ---------- */
const MARCA={
  rects:[[26,1,16,16],[1,27,13,13],[35,26,13,13],[2,64,12,12],[35,64,13,13],[26,83,16,16],[102,43,16,16]],
  paths:['M48 1H86A32 32 0 0 1 118 33V38H102V33A16 16 0 0 0 86 17H48Z',
         'M48 99H86A32 32 0 0 0 118 67V63H102V67A16 16 0 0 1 86 83H48Z'],
  pixel:[16,45,15,15]
};
const P2D=MARCA.paths.map(d=>new Path2D(d));
function marca(cx,cy,escala,alpha=1,pixelBrillo=1){
  x.save(); x.globalAlpha*=alpha;
  x.translate(cx-60*escala,cy-50*escala); x.scale(escala,escala);
  x.fillStyle=INK;
  for(const[a,b,w,h]of MARCA.rects){rr(a,b,w,h,2);x.fill();}
  for(const p of P2D)x.fill(p);
  const[px,py,pw,ph]=MARCA.pixel;
  x.save(); x.globalAlpha*=pixelBrillo; x.shadowColor=BLUE; x.shadowBlur=20;
  x.fillStyle=BLUE; rr(px,py,pw,ph,2); x.fill(); x.restore();
  x.restore();
}

/* ================= 1 · LA OFERTA (0 – 3,7 s) =================
   Lo primero que se lee es qué se vende y cuánto se lleva quien lo venda. */
function escenaOferta(f){
  const a=win(f,0,112,1,22); if(!a)return;
  x.save(); x.globalAlpha=a;
  halo(540,830,780,0.16*win(f,6,112,18,22));

  txt('OPORTUNIDAD COMERCIAL',540,372,{size:26,weight:700,color:BLUE,font:'JetBrains Mono',ls:6,alpha:win(f,2,112,12,20)});

  parrafo(['Vende sistemas de IA','y automatización'],540,486,
          {size:76,weight:700,alpha:win(f,5,112,13,20),lh:92});
  parrafo([{t:'a empresas que los necesitan.',italic:true,font:'Instrument Serif',weight:400,color:INK2}],
          540,652,{size:60,alpha:win(f,11,112,14,20)});

  // la cifra, ya aquí
  const e=easeInOut(cl((f-16)/22));
  const t2=win(f,16,112,14,20);
  x.save(); x.translate(540,906); x.scale(0.86+0.14*e,0.86+0.14*e); x.globalAlpha=t2;
  x.font='800 250px "Inter", sans-serif'; x.textAlign='center'; x.textBaseline='alphabetic';
  x.shadowColor='rgba(91,140,255,.55)'; x.shadowBlur=64; x.fillStyle=INK;
  x.fillText('50',-62,0);
  x.shadowBlur=0; x.fillStyle=BLUE; x.font='800 126px "Inter", sans-serif';
  x.fillText('%',140,-12);
  x.restore();
  parrafo(['de cada venta, para ti.'],540,1000,{size:52,weight:640,alpha:win(f,26,112,14,20)});

  // tres hechos, en una línea cada uno
  // Cada línea tiene origen: el reparto de papeles, que se vende desde cualquier zona, y la frase del propio
  // anuncio de YouTube. No se afirma nada sobre exclusividad, plazos ni importes: nadie lo ha dado.
  const hechos=['Tú vendes · nosotros construimos','Vendes desde donde estés','No necesitas saber de IA ni programar'];
  hechos.forEach((h,i)=>{
    const t3=win(f,34+i*7,112,14,18);
    if(!t3)return;
    x.save(); x.globalAlpha=t3;
    x.fillStyle=BLUE; x.beginPath(); x.arc(196,1124+i*70-8,7,0,7); x.fill();
    txt(h,228,1124+i*70,{size:34,weight:450,color:INK2,align:'left'});
    x.restore();
  });
  x.restore();
}

/* ================= 2 · POR QUÉ SE VENDE (3,6 – 7 s) =================
   Cada ventana dice una tarea concreta: es lo que esa persona va a oír. */
const TAREAS=['Copiar pedidos al sistema','Contestar el mismo email','Pasar facturas a mano',
              'Buscar un dato que ya existe','Cuadrar las horas del equipo','Rehacer el mismo informe',
              'Repasar albaranes uno a uno','Volver a pedir los mismos papeles'];
function escenaPorQue(f){
  const a=win(f,110,212,20,22); if(!a)return;
  x.save(); x.globalAlpha=a;
  const cols=2, rows=4, cw=430, ch=168, ox=(W-cols*cw)/2, oy=560;
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
    const k=j*cols+i;
    const ent=win(f,118+k*3,212,14,20); if(!ent)continue;
    const X0=ox+i*cw+12, Y0=oy+j*ch+12, Wc=cw-24, Hc=ch-24;
    x.save(); x.globalAlpha=ent;
    x.fillStyle='rgba(255,255,255,.028)'; rr(X0,Y0,Wc,Hc,14); x.fill();
    x.strokeStyle='rgba(255,255,255,.085)'; x.lineWidth=1.2; x.stroke();
    // barra de ventana
    x.fillStyle='rgba(255,255,255,.05)'; rr(X0,Y0,Wc,30,14); x.fill();
    for(let d=0;d<3;d++){x.fillStyle='rgba(255,255,255,.16)';x.beginPath();x.arc(X0+18+d*14,Y0+15,4,0,7);x.fill();}
    // la tarea, escrita
    const pal=TAREAS[k].split(' ');
    let l1=pal.slice(0,3).join(' '), l2=pal.slice(3).join(' ');
    txt(l1,X0+18,Y0+72,{size:26,weight:560,color:INK2,align:'left'});
    if(l2) txt(l2,X0+18,Y0+104,{size:26,weight:560,color:INK2,align:'left'});
    // «otra vez» parpadeando
    const pul=0.35+0.45*Math.abs(Math.sin(f*0.1+k*1.1));
    txt('otra vez',X0+18,Y0+136,{size:21,weight:600,color:BLUE,font:'JetBrains Mono',align:'left',alpha:pul});
    x.restore();
  }
  const t=win(f,116,212,18,22);
  txt('POR QUÉ SE VENDE SOLO',540,352,{size:25,weight:700,color:BLUE,font:'JetBrains Mono',ls:6,alpha:t});
  parrafo(['Las empresas que conoces','pierden horas aquí'],540,462,{size:62,weight:680,alpha:t,lh:76});
  x.restore();
}

/* ================= 3 · QUÉ VENDE (6,9 – 13,3 s) ================= */
const PIEZAS=[['Automatizaciones','el trabajo repetitivo, hecho solo'],
              ['Agentes de IA','atienden, redactan y responden'],
              ['Integraciones','las herramientas dejan de estar sueltas'],
              ['Software propio','lo que no existe, se construye']];
function escenaQueVende(f){
  const a=win(f,210,402,20,22); if(!a)return;
  x.save(); x.globalAlpha=a;
  txt('LO QUE VENDES',540,330,{size:25,weight:700,color:BLUE,font:'JetBrains Mono',ls:6});
  parrafo(['No una herramienta suelta.',{t:'Un sistema entero.',italic:true,font:'Instrument Serif',weight:400}],
          540,448,{size:62,weight:660,lh:80});
  const cy0=740, gap=196;
  PIEZAS.forEach((p,i)=>{
    const ent=win(f,232+i*18,402,16,20);
    if(!ent)return;
    const dy=(1-easeOut(ent))*42;
    x.save(); x.globalAlpha=ent;
    const Y=cy0+i*gap+dy;
    x.strokeStyle='rgba(255,255,255,.10)'; x.lineWidth=1.5;
    x.fillStyle='rgba(255,255,255,.028)';
    rr(120,Y-62,840,122,18); x.fill(); x.stroke();
    const pul=0.55+0.45*Math.sin(f*0.13+i*1.6);
    x.save(); x.shadowColor=BLUE; x.shadowBlur=26*pul; x.fillStyle=BLUE;
    x.beginPath(); x.arc(182,Y-2,9,0,7); x.fill(); x.restore();
    txt(p[0],224,Y-8,{size:42,weight:640,align:'left'});
    txt(p[1],224,Y+38,{size:29,weight:420,color:INK2,align:'left'});
    x.restore();
  });
  x.restore();
}

/* ================= 4 · CÓMO FUNCIONA (13,3 – 18,2 s) ================= */
const PASOS=[['Tú abres la conversación','Detectas la empresa y nos la presentas'],
             ['Nosotros lo construimos','Análisis, sistema, implantación y mantenimiento'],
             ['El cliente paga al ver resultados','Un mes de servicio real antes de facturar']];
function escenaRelacion(f){
  const a=win(f,400,547,20,22); if(!a)return;
  x.save(); x.globalAlpha=a;
  txt('CÓMO FUNCIONA',540,340,{size:25,weight:700,color:BLUE,font:'JetBrains Mono',ls:6});
  parrafo(['Tú vendes.',{t:'Nosotros respondemos.',italic:true,font:'Instrument Serif',weight:400,color:INK2}],
          540,458,{size:70,weight:680,lh:88});
  const y0=770;
  PASOS.forEach((p,i)=>{
    const ent=win(f,422+i*20,547,16,20);
    if(!ent)return;
    x.save(); x.globalAlpha=ent;
    const Y=y0+i*248+(1-easeOut(ent))*32;
    x.strokeStyle=BLUE; x.lineWidth=2; x.globalAlpha=ent*0.8;
    x.beginPath(); x.arc(190,Y+6,40,0,7); x.stroke(); x.globalAlpha=ent;
    txt(String(i+1),190,Y+21,{size:40,weight:700,color:BLUE,font:'JetBrains Mono'});
    txt(p[0],258,Y-4,{size:41,weight:640,align:'left'});
    txt(p[1],258,Y+44,{size:28,weight:420,color:INK2,align:'left'});
    if(i<2){ x.strokeStyle='rgba(91,140,255,.32)'; x.lineWidth=2; x.setLineDash([6,10]);
      x.beginPath(); x.moveTo(190,Y+52); x.lineTo(190,Y+194); x.stroke(); x.setLineDash([]); }
    x.restore();
  });
  x.restore();
}

/* ================= 5 · LA CIFRA, OTRA VEZ (18,1 – 21,7 s) ================= */
function escenaCifra(f){
  const a=win(f,545,652,16,18); if(!a)return;
  const t=win(f,551,652,18,18);
  halo(540,930,860,0.17*t);
  x.save(); x.globalAlpha=a;
  txt('TU PARTE',540,640,{size:27,weight:700,color:BLUE,font:'JetBrains Mono',ls:8,alpha:t});
  const e=easeInOut(cl((f-557)/24));
  x.save(); x.translate(540,1000); x.scale(0.82+0.18*e,0.82+0.18*e); x.globalAlpha=t;
  x.font='800 300px "Inter", sans-serif'; x.textAlign='center'; x.textBaseline='alphabetic';
  x.shadowColor='rgba(91,140,255,.55)'; x.shadowBlur=70; x.fillStyle=INK;
  x.fillText('50',-78,0);
  x.shadowBlur=0; x.fillStyle=BLUE; x.font='800 150px "Inter", sans-serif';
  x.fillText('%',202,-14);
  x.restore();
  parrafo(['de cada venta, en comisión.'],540,1150,{size:54,weight:620,alpha:win(f,575,652,16,18)});
  parrafo([{t:'Vendes desde donde estés.',color:INK2}],540,1256,{size:42,weight:440,alpha:win(f,589,652,16,18)});
  x.restore();
}

/* ================= 6 · CIERRE (21,6 – 24 s) ================= */
function escenaCierre(f){
  const a=win(f,650,720,18,1); if(!a)return;
  x.save(); x.globalAlpha=a;
  const t=win(f,656,720,16,1);
  txt('QUIÉN ENCAJA',540,470,{size:25,weight:700,color:BLUE,font:'JetBrains Mono',ls:7,alpha:t});
  parrafo(['Gente que sepa','abrir una puerta.'],540,600,{size:76,weight:680,alpha:t,lh:92});
  parrafo([{t:'La tecnología la ponemos nosotros.',color:INK2}],540,720,{size:40,weight:440,alpha:win(f,662,720,14,1)});
  const z=win(f,666,720,12,1);
  txt('YA SE VENDE DESDE  ·  MADRID  ·  MÁLAGA  ·  ASTURIAS',540,860,
      {size:23,weight:600,color:INK2,font:'JetBrains Mono',ls:3,alpha:z});
  marca(540,1230,3.05,t,0.75+0.25*Math.sin(f*0.16));
  txt('dcodepartners.com',540,1460,{size:46,weight:640,color:INK,font:'JetBrains Mono',ls:1,alpha:win(f,670,720,12,1)});
  x.restore();
}

/* ---------- fotograma ---------- */
window.pintaFrame=function(f){
  x.fillStyle=BG; x.fillRect(0,0,W,H);
  reticula(f, f<220?0.8:0.5);
  escenaOferta(f);
  escenaPorQue(f);
  escenaQueVende(f);
  escenaRelacion(f);
  escenaCifra(f);
  escenaCierre(f);
  const g=x.createRadialGradient(540,960,420,540,960,1180);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.55)');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  x.save(); x.globalAlpha=0.028;
  for(let i=0;i<1400;i++){
    const r=rnd(i+f*0.37);
    x.fillStyle=r>.5?'#ffffff':'#000000';
    x.fillRect((rnd(i*2.1+f)*W)|0,(rnd(i*3.7+f*1.3)*H)|0,2,2);
  }
  x.restore();
};

(async()=>{
  await document.fonts.load('700 100px "Inter"');
  await document.fonts.load('italic 400 100px "Instrument Serif"');
  await document.fonts.load('700 40px "JetBrains Mono"');
  await document.fonts.ready;
  window.pintaFrame(0);
  window.LISTO=true;
})();
</script>
</html>
