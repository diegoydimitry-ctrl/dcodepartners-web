function lineaLuz(a, b, col) {                                   // tubo de luz que se «rellena» de a hacia b (uniform p)
  const g = new THREE.PlaneGeometry(1, 1, 64, 1); const dir = V(b[0] - a[0], b[1] - a[1], 0), largo = dir.length();
  const m = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: { p: { value: 0 }, a: { value: 1 }, c: { value: new THREE.Color(col) } },
    vertexShader: "varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }",
    fragmentShader: "uniform float p; uniform float a; uniform vec3 c; varying vec2 vUv; void main(){ float d=abs(vUv.y-0.5)*2.0; float core=exp(-d*d*18.0); float glow=exp(-d*d*3.0)*0.35; float cab=smoothstep(p, p-0.12, vUv.x); float punta=exp(-pow((vUv.x-p)*28.0,2.0))*step(0.001,p)*step(p,0.999); gl_FragColor=vec4(c*(core+glow)*(cab+punta*1.8), (core+glow)*(cab+punta)*a); }" });
  const me = new THREE.Mesh(g, m); me.scale.set(largo, 0.09, 1); me.position.set((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, 0); me.rotation.z = Math.atan2(dir.y, dir.x); return me;
}
