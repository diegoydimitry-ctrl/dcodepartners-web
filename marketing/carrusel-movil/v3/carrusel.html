<!doctype html><html lang="es"><head><meta charset="utf-8"><style>@font-face{font-family:"Barlow";src:url(../fuentes/barlow-semi-condensed-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:"Barlow";src:url(../fuentes/barlow-semi-condensed-latin-700-normal.woff2);font-weight:700}
*{box-sizing:border-box}
html,body{margin:0;background:#000}
img{display:block;image-rendering:pixelated}
.pg{position:relative;width:1080px;height:1350px;overflow:hidden;background:#060607}
.luz{position:absolute;inset:0;background:radial-gradient(70% 55% at 38% 30%,#24262b 0%,#111215 45%,#050506 100%)}
.movil{position:absolute;inset:0;transform-origin:50% 50%}
.grano{position:absolute;inset:0;pointer-events:none;opacity:.2;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(85% 70% at 50% 45%,transparent 50%,rgba(0,0,0,.6) 100%)}
.pie{position:absolute;top:34px;left:0;right:0;text-align:center;font:600 36px "Barlow";color:#7d8698;letter-spacing:1px;z-index:2}
.tecla,.nokia .teclado span,.ladrillo .tec span,.tapa-inf span,.teclado3 span,.ladrillo .snd span{
  display:grid;place-items:center;font:600 46px "Barlow";color:#c9ccd2;border-radius:28px;
  background:linear-gradient(180deg,#3a3d43,#1e2024);box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 6px 12px rgba(0,0,0,.55)}
.sombra-cuerpo{box-shadow:0 50px 110px rgba(0,0,0,.75),0 10px 30px rgba(0,0,0,.6)}

/* ── busca ── */
.busca{position:absolute;left:20px;top:380px;width:1040px;height:610px;border-radius:130px 130px 110px 110px;
  background:linear-gradient(165deg,#34373c 0%,#1a1c1f 45%,#0b0c0e 100%);
  box-shadow:0 50px 110px rgba(0,0,0,.75),inset 0 3px 0 rgba(255,255,255,.08),inset 0 -10px 30px rgba(0,0,0,.6)}
.busca .clip{position:absolute;left:400px;top:-60px;width:240px;height:90px;border-radius:30px 30px 0 0;background:linear-gradient(180deg,#26282c,#141517);z-index:-1}
.busca .marco{position:absolute;left:50%;transform:translateX(-50%);top:62px;padding:24px;border-radius:26px;background:#07080a;box-shadow:inset 0 4px 14px rgba(0,0,0,.9),0 0 0 4px #2b2e33}
.busca .marco img{border-radius:6px}
.busca .bots{position:absolute;left:0;right:0;top:430px;display:flex;justify-content:center;gap:60px}
.busca .bots i{width:150px;height:70px;border-radius:35px;background:linear-gradient(180deg,#3a3d43,#1c1e22);box-shadow:inset 0 2px 0 rgba(255,255,255,.1),0 6px 12px rgba(0,0,0,.6)}
.busca .bots i.g{width:110px;height:110px;margin-top:-18px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#55595f,#1e2024)}
.busca .rejilla{position:absolute;right:70px;top:420px;display:grid;grid-template-columns:repeat(3,14px);gap:10px}
.busca .rejilla b{width:14px;height:14px;border-radius:50%;background:#050506;box-shadow:inset 0 2px 3px rgba(0,0,0,.9)}

/* ── Nokia ── */
.nokia{position:absolute;left:100px;top:90px;width:880px;height:1420px;border-radius:200px 200px 110px 110px;
  box-shadow:0 50px 110px rgba(0,0,0,.75),inset 0 3px 0 rgba(255,255,255,.12),inset 0 -12px 40px rgba(0,0,0,.5)}
.nokia.azul{background:linear-gradient(160deg,#3d5f86 0%,#24405f 40%,#142538 100%)}
.nokia.negro{background:linear-gradient(160deg,#3a3c40 0%,#1d1e21 40%,#0c0c0e 100%)}
.nokia .auricular{position:absolute;top:58px;left:0;right:0;display:flex;justify-content:center;gap:16px}
.nokia .auricular b{width:46px;height:12px;border-radius:6px;background:#06080b;box-shadow:inset 0 2px 3px rgba(0,0,0,.9)}
.nokia .logo-cuerpo{position:absolute;top:100px;left:0;right:0;text-align:center;font:700 40px "Barlow";letter-spacing:14px;color:#b9bec7;
  text-shadow:0 1px 0 rgba(255,255,255,.2),0 -1px 0 rgba(0,0,0,.6)}
.nokia .cristal{position:absolute;top:165px;left:50%;transform:translateX(-50%);padding:44px 46px 52px;border-radius:40px 40px 70px 70px;
  background:linear-gradient(180deg,#1a2328,#0d1215);box-shadow:inset 0 4px 16px rgba(0,0,0,.9),0 0 0 5px rgba(255,255,255,.06)}
.nokia .cristal::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(120deg,rgba(255,255,255,.12),rgba(255,255,255,0) 35%);pointer-events:none}
.nokia .navi{position:absolute;top:760px;left:0;right:0;height:150px}
.nokia .tecla-nav{position:absolute;left:50%;top:0;transform:translateX(-50%);width:260px;height:120px;border-radius:60px 60px 90px 90px;
  background:linear-gradient(180deg,#8e959e,#4d535b);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 8px 16px rgba(0,0,0,.6)}
.nokia .c{position:absolute;left:70px;top:20px;width:130px;height:90px;border-radius:45px;display:grid;place-items:center;font:700 52px "Barlow";color:#c9ccd2;
  background:linear-gradient(180deg,#3a3d43,#1e2024);box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 6px 12px rgba(0,0,0,.55)}
.nokia .flechas{position:absolute;right:70px;top:10px;width:130px;height:110px;border-radius:40px;
  background:linear-gradient(180deg,#3a3d43,#1e2024);box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 6px 12px rgba(0,0,0,.55)}
.nokia .teclado{position:absolute;top:940px;left:90px;right:90px;display:grid;grid-template-columns:repeat(3,1fr);gap:26px 34px}
.nokia .teclado span{height:96px}

/* ── ladrillo ── */
.ladrillo{position:absolute;left:190px;top:200px;width:700px;height:1500px;border-radius:50px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 6px),linear-gradient(160deg,#3b3a37 0%,#222120 45%,#0f0f0e 100%);
  box-shadow:0 50px 110px rgba(0,0,0,.75),inset 0 3px 0 rgba(255,255,255,.1)}
.ladrillo .antena{position:absolute;left:70px;top:-190px;width:46px;height:220px;border-radius:22px 22px 6px 6px;background:linear-gradient(90deg,#1b1b1c,#3a3a3c,#141415);z-index:-1}
.ladrillo .tope{position:absolute;top:36px;left:120px;right:120px;height:60px;border-radius:12px;
  background:repeating-linear-gradient(90deg,#0a0a0a 0 8px,#2a2a2a 8px 14px)}
.ladrillo .lcdmarco{position:absolute;top:140px;left:50%;transform:translateX(-50%);padding:22px;border-radius:14px;background:#050505;box-shadow:inset 0 4px 14px rgba(0,0,0,.95),0 0 0 6px #2c2b29}
.ladrillo .snd{position:absolute;top:500px;left:50px;right:50px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.ladrillo .snd span{height:80px;font-size:34px;letter-spacing:2px}
.ladrillo .snd span:nth-child(1){color:#7fd39a}.ladrillo .snd span:nth-child(3){color:#ff7b6b}
.ladrillo .tec{position:absolute;top:620px;left:50px;right:50px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.ladrillo .tec span{height:96px}

/* ── tapa ── */
.tapa{position:absolute;left:110px;top:50px;width:860px;height:1500px}
.tapa-sup{position:absolute;top:0;left:0;width:860px;height:840px;border-radius:120px 120px 40px 40px;
  background:linear-gradient(160deg,#3f4146 0%,#202125 45%,#0e0e10 100%);box-shadow:0 40px 100px rgba(0,0,0,.75),inset 0 3px 0 rgba(255,255,255,.12)}
.auric2{position:absolute;top:56px;left:50%;transform:translateX(-50%);width:180px;height:16px;border-radius:8px;background:#060607}
.cristal2{position:absolute;top:120px;left:50%;transform:translateX(-50%);padding:36px;border-radius:30px;background:#07090a;box-shadow:inset 0 4px 16px rgba(0,0,0,.95),0 0 0 5px rgba(255,255,255,.07)}
.bisagra{position:absolute;top:850px;left:30px;right:30px;height:70px;border-radius:35px;background:linear-gradient(180deg,#4a4c52,#1b1c1f 60%,#0a0a0b);box-shadow:0 10px 20px rgba(0,0,0,.7)}
.tapa-inf{position:absolute;top:940px;left:0;width:860px;height:700px;border-radius:40px;padding:60px 70px;display:grid;grid-template-columns:repeat(3,1fr);gap:26px 34px;align-content:start;
  background:linear-gradient(180deg,#2a2b2f,#121315)}
.tapa-inf span{height:96px}

/* ── Siemens ── */
.siemens{position:absolute;left:100px;top:90px;width:880px;height:1420px;border-radius:150px 150px 90px 90px;
  background:linear-gradient(160deg,#c7ccd2 0%,#8e949b 40%,#4f545a 100%);box-shadow:0 50px 110px rgba(0,0,0,.75),inset 0 3px 0 rgba(255,255,255,.6)}
.auric3{position:absolute;top:60px;left:50%;transform:translateX(-50%);width:200px;height:18px;border-radius:9px;background:#2a2d31;box-shadow:inset 0 2px 3px rgba(0,0,0,.8)}
.cristal3{position:absolute;top:130px;left:50%;transform:translateX(-50%);padding:46px 52px 60px;border-radius:60px 60px 40px 40px;background:#0b0c0d;
  box-shadow:inset 0 4px 16px rgba(0,0,0,.95),0 0 0 6px #6c7177}
.cristal3::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(120deg,rgba(255,255,255,.14),rgba(255,255,255,0) 35%)}
.cristal3 img{box-shadow:0 0 60px rgba(255,140,40,.35)}
.botones3{position:absolute;top:790px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:60px}
.botones3 i{width:150px;height:70px;border-radius:35px;background:linear-gradient(180deg,#e2e5e9,#9aa0a7);box-shadow:inset 0 2px 0 #fff,0 6px 12px rgba(0,0,0,.4)}
.botones3 i.rueda{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#3b3f44,#16181b)}
.teclado3{position:absolute;top:940px;left:90px;right:90px;display:grid;grid-template-columns:repeat(3,1fr);gap:26px 34px}
.teclado3 span{height:96px;color:#2b2e33;background:linear-gradient(180deg,#eef0f3,#aeb3ba);box-shadow:inset 0 2px 0 #fff,0 6px 12px rgba(0,0,0,.35)}
</style></head><body><section class="pg"><div class="luz"></div><div class="movil" style="transform:translate(0px,-40px) rotate(-4deg)"><div class="busca"><div class="clip"></div><div class="marco"><img src="lcd/p1.png"></div>
  <div class="bots"><i></i><i class="g"></i><i></i></div><div class="lado"></div><div class="rejilla"><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div></div></div><div class="grano"></div><div class="vig"></div></section><section class="pg"><div class="luz"></div><div class="movil" style="transform:translate(0px,0px) rotate(2.5deg)"><div class="nokia azul"><div class="auricular"><b></b><b></b><b></b><b></b><b></b></div>
  <div class="logo-cuerpo"></div><div class="cristal"><img src="lcd/p2.png"></div>
  <div class="navi"><div class="c">C</div><div class="tecla-nav"></div><div class="flechas"></div></div>
  <div class="teclado"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></div></div></div><div class="grano"></div><div class="vig"></div></section><section class="pg"><div class="luz"></div><div class="movil" style="transform:translate(10px,0px) rotate(-6deg)"><div class="ladrillo"><div class="antena"></div><div class="tope"></div><div class="lcdmarco"><img src="lcd/p3.png"></div>
  <div class="snd"><span>SND</span><span>CLR</span><span>END</span></div>
  <div class="tec"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>*</span><span>0</span><span>#</span></div></div></div><div class="grano"></div><div class="vig"></div></section><section class="pg"><div class="luz"></div><div class="movil" style="transform:translate(0px,0px) rotate(3deg)"><div class="tapa"><div class="tapa-sup"><div class="auric2"></div><div class="cristal2"><img src="lcd/p4.png"></div></div>
  <div class="bisagra"></div><div class="tapa-inf"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span></div></div></div><div class="grano"></div><div class="vig"></div></section><section class="pg"><div class="luz"></div><div class="movil" style="transform:translate(0px,0px) rotate(-2.5deg)"><div class="siemens"><div class="auric3"></div><div class="cristal3"><img src="lcd/p5.png"></div>
  <div class="botones3"><i></i><i class="rueda"></i><i></i></div><div class="teclado3"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></div></div></div><div class="grano"></div><div class="vig"></div></section><section class="pg"><div class="luz"></div><div class="movil" style="transform:translate(0px,0px) rotate(1.5deg)"><div class="nokia negro"><div class="auricular"><b></b><b></b><b></b><b></b><b></b></div>
  <div class="logo-cuerpo">D-CODE</div><div class="cristal"><img src="lcd/p6.png"></div>
  <div class="navi"><div class="c">C</div><div class="tecla-nav"></div><div class="flechas"></div></div>
  <div class="teclado"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></div></div></div><div class="pie">@d_codepartners</div><div class="grano"></div><div class="vig"></div></section></body></html>
