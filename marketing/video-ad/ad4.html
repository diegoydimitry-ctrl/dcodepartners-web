<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>D-Code Partners — Anuncio 4 · D-Code Finance (corporativo)</title>
<!--
  Anuncio 4 — 55 s. Versión corporativa (LinkedIn/web) de D-Code Finance,
  el sistema financiero de D-Code Partners, con locución masculina.

  Fuente de la terminología y del diseño: repositorio diegoydimitry-ctrl/dcode-finance
  (docs/DISENO.md confirma que la paleta se ADOPTA, no se "inspira", de
  assets/css/styles.css de esta web — mismos tokens uno a uno). Los KPIs del
  panel (Cobrado/Pendiente de cobro/Vencido), los módulos y las preguntas de
  «Pregunta a Finanzas» son los reales del producto (docs/DISENO.md,
  src/app/(app)/dashboard, src/lib/data/asistente). Los importes en pantalla
  son de la cuenta DEMO, nunca se presentan como datos de un cliente real.

  El asistente no es un modelo de lenguaje: es una capa determinista sobre
  datos reales de cada cuenta (comentario textual del propio código: "un
  modelo que se equivoca en un importe sobre la contabilidad de alguien es
  peor que uno que dice 'no lo sé'"). Por eso cada respuesta lleva cifra +
  fuente citada — es el eje de la escena 5 y el principal argumento honesto
  de venta, no un adorno.

  Producto verificado en local (843 pruebas en verde) pero SIN despliegue
  público todavía (demo bloqueada por SSO de Vercel, ver
  docs/DEMO_PUBLICA.md) — el cierre no promete disponibilidad.

  Render determinista, mismo motor que ad.html/ad2.html/ad3.html: todo se
  deriva de render(t). Mismos parámetros de URL (?fmt=9x16|16x9, ?t=segundos).
-->
<style>
  @font-face{ font-family:'Inter'; font-weight:400 800; font-display:block;
    src:url('../../assets/fonts/inter-variable.woff2') format('woff2'); }
  @font-face{ font-family:'Space Grotesk'; font-weight:500 700; font-display:block;
    src:url('../../assets/fonts/spacegrotesk-variable.woff2') format('woff2'); }
  @font-face{ font-family:'JetBrains Mono'; font-weight:400 700; font-display:block;
    src:url('../../assets/fonts/jetbrainsmono-variable.woff2') format('woff2'); }
  html,body{ margin:0; padding:0; background:#000; overflow:hidden; }
  #stage{ display:block; }
  body.preview{ display:flex; align-items:center; justify-content:center; height:100vh; }
  body.preview #stage{ max-width:100vw; max-height:100vh; width:auto; height:auto; object-fit:contain; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(() => {
'use strict';

const Q     = new URLSearchParams(location.search);
const FMT   = Q.get('fmt') === '16x9' ? '16x9' : '9x16';
const FRAME = Q.has('t') ? parseFloat(Q.get('t')) : null;
const DUR   = 56.4;

const cv = document.getElementById('stage');
const W  = FMT === '9x16' ? 1080 : 1920;
const H  = FMT === '9x16' ? 1920 : 1080;
cv.width = W; cv.height = H;
cv.style.width = W + 'px'; cv.style.height = H + 'px';
const g = cv.getContext('2d', { alpha:false });

const V  = H > W;
const CX = W / 2, CY = H / 2;

/* Tokens reales de dcode-finance/docs/DISENO.md — adoptados de esta misma
   web, no "inspirados": mismos fondos, tinta y azul/cian/violeta. */
const C = {
  bg:'#06080d', s0:'#06080d', s1:'#0e1320', s2:'#141c30', s3:'#1b2542',
  borderSubtle:'#171d2c', border:'#1e2536', borderStrong:'#2b3448',
  ink:'#eef2fb', stone:'#a7b0c4', stoneSoft:'#8b94ab',
  blue:'#5b8cff', blue300:'#93b4ff', blue600:'#2f5ed6',
  cyan:'#43e0ff', cyan300:'#7ceaff',
  green:'#34e7a4', green300:'#7cf3c6',
  amber:'#ffb454', amber300:'#ffd08f',
  red:'#ff6b6b', red300:'#ffa3a3',
  violet:'#9b6bff', violet300:'#c3a6ff'
};

/* ─────────────────────────── utilidades ─────────────────────────── */

const clamp = (v,a=0,b=1) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b - a) * t;
const easeOut      = t => 1 - Math.pow(1 - t, 3);
const easeOutQuint = t => 1 - Math.pow(1 - t, 5);
const easeInOut    = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const easeOutBack  = t => { const c=1.70158, s=c+1; return 1 + s*Math.pow(t-1,3) + c*Math.pow(t-1,2); };
const easeInPower4  = t => t*t*t*t;
const easeOutPower4 = t => 1 - Math.pow(1 - t, 4);
const ramp = (t,a,b,fn=easeOut) => fn(clamp((t - a) / (b - a)));

/* Corte entre escenas (cut-the-curve, motion-doctrine) — igual que en
   ad.html/ad2.html/ad3.html: velocidad emparejada en vez de crossfade. */
const CUT_TRAVEL = 0.12;
const CUT_DUR    = 0.30;
function cutOffsetX(localT, sceneDur, isFirst, isLast){
  const travel = CUT_TRAVEL * W;
  if (!isLast && sceneDur - localT < CUT_DUR){
    const p = easeInPower4(clamp((localT - (sceneDur - CUT_DUR)) / CUT_DUR));
    return -travel * p;
  }
  if (!isFirst && localT < CUT_DUR){
    const p = easeOutPower4(clamp(localT / CUT_DUR));
    return travel * (1 - p);
  }
  return 0;
}

function rgba(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
const FAM = { sg:'"Space Grotesk"', in:'Inter', mo:'"JetBrains Mono"' };
function font(fam, weight, size, letter=0){
  g.font = `${weight} ${size}px ${FAM[fam]}`;
  g.letterSpacing = `${letter}px`;
}
function roundRect(x,y,w,h,r){ g.beginPath(); g.roundRect(x,y,w,h,r); }
function wrap(text, maxW){
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words){
    const test = line ? line + ' ' + w : w;
    if (g.measureText(test).width > maxW && line){ lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
function centeredLines(lines, cx, top, lh, prog, rise = 30){
  for (let i = 0; i < lines.length; i++){
    const p = clamp((prog - i * 0.10) / (1 - Math.min(0.5, lines.length * 0.10)));
    const e = easeOutQuint(p);
    g.save(); g.globalAlpha = e;
    g.fillText(lines[i], cx, top + i * lh + (1 - e) * rise);
    g.restore();
  }
}
/* PRNG con semilla fija (LCG) — todo lo que parece "aleatorio" en esta
   pieza (jitter del caos, forma del gráfico) sale de aquí, nunca de
   Math.random(), así que render(t) sigue siendo puro y reproducible. */
function makeRng(seed){
  let s = seed >>> 0;
  return () => { s = (1103515245 * s + 12345) & 0x7fffffff; return s / 0x7fffffff; };
}

/* ─────────────────────────── fondo y viñeta ─────────────────────────── */

function background(t){
  g.fillStyle = C.s0; g.fillRect(0, 0, W, H);
  const gy = CY - H * 0.08;
  const rg = g.createRadialGradient(CX, gy, 0, CX, gy, Math.max(W, H) * 0.7);
  rg.addColorStop(0, rgba(C.blue, 0.14));
  rg.addColorStop(0.5, rgba(C.blue, 0.05));
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);

  const step = 84, drift = (t * 4) % step;
  g.strokeStyle = rgba(C.border, 0.5);
  g.lineWidth = 1; g.beginPath();
  for (let x = -step + drift; x < W + step; x += step){ g.moveTo(x+.5, 0); g.lineTo(x+.5, H); }
  for (let y = -step + drift; y < H + step; y += step){ g.moveTo(0, y+.5); g.lineTo(W, y+.5); }
  g.stroke();
}
function vignette(){
  const rg = g.createRadialGradient(CX, CY, Math.min(W,H)*0.32, CX, CY, Math.max(W,H)*0.78);
  rg.addColorStop(0, 'rgba(0,0,0,0)');
  rg.addColorStop(1, 'rgba(0,0,0,0.68)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
}

/* ─────────────────────────── superficies UI ─────────────────────────── */

function panel(x, y, w, h, r = 14, surface = C.s1){
  g.save();
  g.shadowColor = 'rgba(3,5,10,.7)'; g.shadowBlur = 44; g.shadowOffsetY = 20;
  roundRect(x, y, w, h, r);
  g.fillStyle = surface; g.fill();
  g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0;
  g.strokeStyle = rgba(C.blue, .14); g.lineWidth = 1;
  g.stroke();
  g.strokeStyle = C.border; g.lineWidth = 1;
  roundRect(x, y, w, h, r); g.stroke();
  g.restore();
}

function badge(x, y, label, tone, alpha = 1, size = 18){
  const tones = {
    brand:  [C.blue,  rgba(C.blue,  .16)],
    success:[C.green, rgba(C.green, .16)],
    warning:[C.amber, rgba(C.amber, .16)],
    critical:[C.red,  rgba(C.red,   .16)],
    demo:   [C.violet,rgba(C.violet,.18)],
    data:   [C.cyan,  rgba(C.cyan,  .16)]
  };
  const [fg, bgc] = tones[tone];
  font('mo', 700, size, 1.1);
  const w = g.measureText(label).width + size * 1.7, h = size * 1.7;
  g.save(); g.globalAlpha = alpha;
  roundRect(x, y, w, h, h/2);
  g.fillStyle = bgc; g.fill();
  g.strokeStyle = rgba(fg, .55); g.lineWidth = 1.2; g.stroke();
  g.fillStyle = fg; g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText(label, x + size * 0.85, y + h/2 + 1);
  g.restore();
  return w;
}

function checkDot(x, y, r, color, alpha = 1){
  g.save(); g.globalAlpha = alpha;
  g.beginPath(); g.arc(x, y, r, 0, Math.PI*2);
  g.fillStyle = rgba(color, .16); g.fill();
  g.strokeStyle = rgba(color, .7); g.lineWidth = 1.4; g.stroke();
  g.beginPath();
  g.moveTo(x - r*0.42, y); g.lineTo(x - r*0.1, y + r*0.4); g.lineTo(x + r*0.48, y - r*0.38);
  g.strokeStyle = color; g.lineWidth = 2.2; g.lineCap = 'round'; g.lineJoin = 'round'; g.stroke();
  g.restore();
}

/** Punto de severidad simple (sin check), para filas de lista. */
function dot(x, y, r, color, alpha = 1){
  g.save(); g.globalAlpha = alpha;
  g.beginPath(); g.arc(x, y, r, 0, Math.PI*2);
  g.fillStyle = color; g.fill();
  g.restore();
}

/** Tarjeta de KPI — cifra grande (Space Grotesk, como .dc-cifra real) +
    etiqueta mono debajo. Reutilizada para Cobrado/Pendiente/Vencido. */
function kpiCard(x, y, w, h, label, value, tone, alpha){
  const tones = { success:C.green, warning:C.amber, critical:C.red, brand:C.blue };
  const fg = tones[tone];
  g.save(); g.globalAlpha = alpha;
  panel(x, y, w, h, 14, C.s1);
  g.strokeStyle = rgba(fg, .28); g.lineWidth = 1.2;
  roundRect(x, y, w, h, 14); g.stroke();
  font('mo', 700, w < 260 ? 15 : 17, 1.2);
  g.fillStyle = C.stoneSoft; g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText(label.toUpperCase(), x + 22, y + 34);
  dot(x + w - 26, y + 34, 5, fg, 1);
  font('sg', 700, w < 260 ? 40 : 46, -0.5);
  g.fillStyle = fg; g.textBaseline = 'alphabetic';
  g.fillText(value, x + 22, y + h - 24);
  g.restore();
}

/* ══════════════════ ESCENA 1 — el caos (0.0 – 4.0) ══════════════════ */

const RNG1 = makeRng(0xF17A5C);
const FRAGS = Array.from({length: 7}, (_, i) => ({
  kind: ['invoice','sheet','mail','sheet','invoice','mail','sheet'][i],
  ox: (RNG1() - 0.5) * 0.92,
  oy: (RNG1() - 0.5) * 0.80,
  rot: (RNG1() - 0.5) * 0.32,
  at: i * 0.14,
  s: 0.82 + RNG1() * 0.3
}));

function fragInvoice(cx, cy, s, alpha){
  const w = 168 * s, h = 118 * s;
  g.save(); g.globalAlpha = alpha;
  roundRect(cx - w/2, cy - h/2, w, h, 10 * s);
  g.fillStyle = C.s1; g.fill();
  g.strokeStyle = C.border; g.lineWidth = 1; g.stroke();
  g.strokeStyle = rgba(C.blue, .5); g.lineWidth = 1.4;
  g.beginPath(); g.moveTo(cx - w/2 + 16*s, cy - h/2 + 26*s); g.lineTo(cx + w/2 - 16*s, cy - h/2 + 26*s); g.stroke();
  g.fillStyle = rgba(C.ink, .8);
  for (let i = 0; i < 3; i++){
    roundRect(cx - w/2 + 16*s, cy - h/2 + 44*s + i*18*s, (i===2? 60:100)*s, 6*s, 3*s);
    g.fillStyle = rgba(C.stone, .55); g.fill();
  }
  font('mo', 700, 13*s, 0.5);
  g.fillStyle = rgba(C.cyan, .85); g.textAlign = 'right'; g.textBaseline = 'middle';
  g.fillText('FRA-0142', cx + w/2 - 14*s, cy - h/2 + 26*s);
  g.restore();
}
function fragSheet(cx, cy, s, alpha){
  const w = 150 * s, h = 130 * s, cols = 3, rows = 4;
  g.save(); g.globalAlpha = alpha;
  roundRect(cx - w/2, cy - h/2, w, h, 8 * s);
  g.fillStyle = C.s1; g.fill();
  g.strokeStyle = C.border; g.lineWidth = 1; g.stroke();
  g.strokeStyle = rgba(C.borderSubtle, 1); g.lineWidth = 1;
  for (let c = 1; c < cols; c++){ const x = cx - w/2 + (w/cols)*c; g.beginPath(); g.moveTo(x, cy-h/2); g.lineTo(x, cy+h/2); g.stroke(); }
  for (let r = 1; r < rows; r++){ const y = cy - h/2 + (h/rows)*r; g.beginPath(); g.moveTo(cx-w/2, y); g.lineTo(cx+w/2, y); g.stroke(); }
  g.fillStyle = rgba(C.green, .4);
  g.fillRect(cx - w/2 + (w/cols)*1 + 4*s, cy - h/2 + (h/rows)*2 + 4*s, w/cols - 8*s, h/rows - 8*s);
  g.restore();
}
function fragMail(cx, cy, s, alpha){
  const w = 172 * s, h = 108 * s;
  g.save(); g.globalAlpha = alpha;
  roundRect(cx - w/2, cy - h/2, w, h, 10 * s);
  g.fillStyle = C.s1; g.fill();
  g.strokeStyle = C.border; g.lineWidth = 1; g.stroke();
  g.strokeStyle = rgba(C.violet, .55); g.lineWidth = 1.4;
  g.beginPath();
  g.moveTo(cx - w/2 + 12*s, cy - h/2 + 14*s);
  g.lineTo(cx, cy + 6*s);
  g.lineTo(cx + w/2 - 12*s, cy - h/2 + 14*s);
  g.stroke();
  for (let i = 0; i < 2; i++){
    roundRect(cx - w/2 + 16*s, cy + 14*s + i*18*s, (i===0?120:80)*s, 6*s, 3*s);
    g.fillStyle = rgba(C.stone, .5); g.fill();
  }
  g.restore();
}
const FRAG_FN = { invoice: fragInvoice, sheet: fragSheet, mail: fragMail };

function s1(t){
  const dur = 4.0;
  const out = 1 - ramp(t, dur - 0.32, dur, easeInOut);
  const unit = Math.min(W, H);

  FRAGS.forEach((f, i) => {
    const p = ramp(t, f.at, f.at + 0.34, easeOutQuint);
    const fadeOutAt = 2.2 + (i % 3) * 0.15;
    const q = 1 - ramp(t, fadeOutAt, fadeOutAt + 0.5, easeInOut);
    const a = clamp(p) * clamp(q) * out;
    if (a <= 0.001) return;
    const jitter = Math.sin(t * 1.7 + i * 2.1) * 5;
    const cx = CX + f.ox * unit + jitter, cy = CY + f.oy * unit + jitter * 0.6;
    g.save();
    g.translate(cx, cy); g.rotate(f.rot); g.translate(-cx, -cy);
    g.translate(0, (1 - clamp(p)) * 24);
    FRAG_FN[f.kind](cx, cy, f.s, a * 0.92);
    g.restore();
  });

  const cap = '¿SABES REALMENTE QUÉ ESTÁ PASANDO\nCON EL DINERO DE TU EMPRESA?';
  const cp = ramp(t, 2.15, 2.7, easeOutQuint);
  if (cp > 0){
    const size = V ? 50 : 54;
    font('sg', 700, size, -0.4);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    const lines = cap.split('\n');
    const lh = size * 1.22;
    const top = CY - (lines.length - 1) * lh / 2;
    g.save(); g.globalAlpha = out;
    g.fillStyle = C.ink; g.shadowColor = 'rgba(6,8,13,.92)'; g.shadowBlur = 34;
    centeredLines(lines, CX, top, lh, cp, 26);
    g.restore();
  }
}

/* ══════════════════ ESCENA 2 — separados (4.0 – 13.6) ══════════════════ */

const LABELS = ['FACTURAS', 'COBROS', 'GASTOS', 'PRESUPUESTOS', 'CLIENTES', 'PROYECTOS'];
const SCATTER = [
  { ox:-0.30, oy:-0.28 }, { ox: 0.28, oy:-0.32 },
  { ox:-0.34, oy: 0.02 }, { ox: 0.33, oy: 0.05 },
  { ox:-0.18, oy: 0.32 }, { ox: 0.20, oy: 0.36 }
];

function s2(t){
  const dur = 9.6;
  const inn = ramp(t, 0, 0.10, easeInOut);
  const out = 1 - ramp(t, dur - 0.35, dur, easeInOut);
  const a = inn * out;
  const unit = Math.min(W, H);

  LABELS.forEach((lab, i) => {
    const at = 0.20 + i * 0.16;
    const p = ramp(t, at, at + 0.32, easeOutBack);
    if (p <= 0.001) return;
    const sc = SCATTER[i];
    const drift = Math.sin(t * 0.55 + i * 1.3) * 10;
    const x = CX + sc.ox * unit + drift, y = CY + sc.oy * unit + Math.cos(t * 0.5 + i) * 8;
    g.save(); g.globalAlpha = a * clamp(p);
    const s = lerp(0.7, 1, clamp(p));
    g.translate(x, y); g.scale(s, s); g.translate(-x, -y);
    badge(x - 66, y - 17, lab, 'brand', 1, V ? 19 : 21);
    g.restore();
  });

  const cap = 'TODO PARECE SEPARADO.';
  const cy2 = V ? H * 0.85 : H * 0.87;
  const cp = ramp(t, dur - 1.6, dur - 1.15, easeOutQuint);
  if (cp > 0){
    font('sg', 700, V ? 44 : 42, -0.3);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.save(); g.globalAlpha = a * cp;
    g.fillStyle = C.ink; g.shadowColor = 'rgba(6,8,13,.9)'; g.shadowBlur = 24;
    g.fillText(cap, CX, cy2);
    g.restore();
  }
}

/* ══════════════════ ESCENA 3 — la transformación (13.6 – 21.0) ══════════════════ */

let LOGO = null;

function s3(t){
  const dur = 7.4;
  const out = 1 - ramp(t, dur - 0.35, dur, easeInOut);
  const unit = Math.min(W, H);

  // Las mismas seis etiquetas convergen hacia el centro y se disuelven en
  // el logotipo — la misma información, ahora conectada.
  const conv = ramp(t, 0.0, 2.2, easeInOut);
  if (conv < 0.999){
    LABELS.forEach((lab, i) => {
      const sc = SCATTER[i];
      const x0 = CX + sc.ox * unit, y0 = CY + sc.oy * unit;
      const x = lerp(x0, CX, conv), y = lerp(y0, CY, conv);
      const a = (1 - conv) * out;
      if (a <= 0.002) return;
      g.save(); g.globalAlpha = a;
      const s = lerp(1, 0.4, conv);
      g.translate(x, y); g.scale(s, s); g.translate(-x, -y);
      badge(x - 66, y - 17, lab, 'data', 1, V ? 19 : 21);
      g.restore();
      // línea de conexión hacia el centro
      g.save(); g.globalAlpha = a * 0.6;
      g.strokeStyle = rgba(C.cyan, .5); g.lineWidth = 1.4;
      g.beginPath(); g.moveTo(x0, y0); g.lineTo(CX, CY); g.stroke();
      g.restore();
    });
  }

  const flash = ramp(t, 2.1, 2.4, easeOut) * (1 - ramp(t, 2.4, 3.0, easeInOut));
  if (flash > 0){
    g.save(); g.globalAlpha = flash * 0.5 * out;
    const rg = g.createRadialGradient(CX, CY, 0, CX, CY, unit * 0.5);
    rg.addColorStop(0, rgba(C.cyan, .9)); rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rg; g.fillRect(0, 0, W, H);
    g.restore();
  }

  const lp = ramp(t, 2.35, 3.1, easeOutQuint);
  if (lp > 0){
    const logoY = V ? CY - H * 0.05 : CY - 70;
    const iconH = V ? 96 : 92;
    const iconW = LOGO ? iconH * (LOGO.naturalWidth / LOGO.naturalHeight) : iconH * 1.19;
    font('sg', 700, V ? 86 : 92, 0.5);
    const wordW = g.measureText('D-Code Finance').width;
    const x0 = CX - (iconW + 28 + wordW) / 2;
    g.save(); g.globalAlpha = lp * out; g.translate(0, (1 - lp) * 18);
    if (LOGO){
      g.save(); g.shadowColor = rgba(C.blue, .5); g.shadowBlur = 32;
      g.drawImage(LOGO, x0, logoY - iconH/2, iconW, iconH); g.restore();
    }
    g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.fillStyle = C.ink;
    font('sg', 700, V ? 86 : 92, 0.5);
    g.fillText('D-Code ', x0 + iconW + 28, logoY + 12);
    const w1 = g.measureText('D-Code ').width;
    g.fillStyle = C.cyan;
    g.fillText('Finance', x0 + iconW + 28 + w1, logoY + 12);
    g.restore();

    const sp = ramp(t, 3.3, 3.8, easeOutQuint);
    if (sp > 0){
      font('sg', 500, V ? 38 : 40, -0.2);
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.save(); g.globalAlpha = sp * out;
      g.fillStyle = C.stone;
      g.fillText('Todo el dinero de tu empresa, explicado.', CX, logoY + (V ? 90 : 84));
      g.restore();
    }
  }
}

/* ══════════════════ ESCENA 4 — el sistema (21.0 – 31.2) ══════════════════ */

const KPIS = [
  { label: 'Cobrado',           value: '18.420 €', tone: 'success' },
  { label: 'Pendiente de cobro',value: '6.150 €',  tone: 'warning' },
  { label: 'Vencido',           value: '1.240 €',  tone: 'critical' }
];
const MODULES4 = ['Facturas', 'Cobros', 'Gastos', 'Presupuestos', 'Clientes', 'Proveedores', 'Proyectos'];

function s4(t){
  const dur = 10.85;
  const inn = ramp(t, 0, 0.10, easeInOut);
  const out = 1 - ramp(t, dur - 0.35, dur, easeInOut);
  const a = inn * out;

  const panelW = V ? W * 0.88 : W * 0.60;
  const px = CX - panelW / 2;
  const py = V ? H * 0.30 : H * 0.20;
  const p = ramp(t, 0.05, 0.5, easeOutQuint);

  g.save(); g.globalAlpha = a * p; g.translate(0, (1 - p) * 22);

  font('mo', 700, 17, 1.6);
  g.fillStyle = C.stoneSoft; g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText('SITUACIÓN', px, py);
  const dw = badge(px + panelW - 96, py - 15, 'DEMO', 'demo', 1, 16);

  font('sg', 700, V ? 40 : 42, -0.4);
  g.fillStyle = C.ink; g.textBaseline = 'alphabetic';
  g.fillText('Panel financiero', px, py + 48);

  // Tres KPI hero — reales del dashboard (Cobrado / Pendiente de cobro / Vencido)
  const kpiY = py + 74;
  const kpiH = V ? 132 : 130;
  const gap = 18;
  const kpiW = (panelW - gap * 2) / 3;
  KPIS.forEach((k, i) => {
    const kp = ramp(t, 0.35 + i * 0.14, 0.75 + i * 0.14, easeOutQuint);
    if (kp <= 0.001) return;
    g.save(); g.globalAlpha = kp; g.translate(0, (1 - kp) * 16);
    kpiCard(px + i * (kpiW + gap), kpiY, kpiW, kpiH, k.label, k.value, k.tone, 1);
    g.restore();
  });

  // Cascada de módulos — sincronizada con la locución («Visualiza tus
  // facturas. Controla tus cobros. Analiza tus gastos. Gestiona
  // presupuestos, clientes, proveedores y proyectos.»)
  let mx = px, my = kpiY + kpiH + 34;
  const rowMaxW = panelW;
  MODULES4.forEach((m, i) => {
    const at = 1.55 + i * 0.62;
    const mp = ramp(t, at, at + 0.30, easeOutBack);
    font('in', 600, V ? 21 : 22, 0.2);
    const w = g.measureText(m).width + 44;
    if (mx + w > px + rowMaxW){ mx = px; my += 58; }
    if (mp > 0.001){
      g.save(); g.globalAlpha = clamp(mp);
      const s = lerp(0.75, 1, clamp(mp));
      g.translate(mx + w/2, my + 21); g.scale(s, s); g.translate(-(mx + w/2), -(my + 21));
      roundRect(mx, my, w, 42, 21);
      g.fillStyle = C.s2; g.fill();
      g.strokeStyle = C.border; g.lineWidth = 1; g.stroke();
      font('in', 600, V ? 21 : 22, 0.2);
      g.fillStyle = C.ink; g.textAlign = 'left'; g.textBaseline = 'middle';
      g.fillText(m, mx + 22, my + 22);
      g.restore();
    }
    mx += w + 12;
  });

  g.restore();

  const cap = 'TODA TU INFORMACIÓN FINANCIERA.\nEN UN SOLO LUGAR.';
  const cp = ramp(t, dur - 1.7, dur - 1.2, easeOutQuint);
  if (cp > 0){
    const size = V ? 42 : 40;
    font('sg', 700, size, -0.3);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    const lines = cap.split('\n');
    const lh = size * 1.2;
    const top = V ? H * 0.78 - lh/2 : H * 0.86 - lh/2;
    g.save(); g.globalAlpha = a * cp;
    g.fillStyle = C.ink; g.shadowColor = 'rgba(6,8,13,.92)'; g.shadowBlur = 26;
    centeredLines(lines, CX, top, lh, cp, 18);
    g.restore();
  }
}

/* ══════════════════ ESCENA 5 — inteligencia (31.2 – 38.0) ══════════════════ */

function s5(t){
  const dur = 7.45;
  const inn = ramp(t, 0, 0.10, easeInOut);
  const out = 1 - ramp(t, dur - 0.35, dur, easeInOut);
  const a = inn * out;

  const w = V ? W * 0.86 : W * 0.52;
  const h = V ? 560 : 520;
  const x = CX - w/2, y = CY - h/2 - (V ? H*0.02 : 0);
  const p = ramp(t, 0.08, 0.45, easeOutQuint);

  g.save(); g.globalAlpha = a * p; g.translate(0, (1 - p) * 20);
  panel(x, y, w, h, 18);

  font('mo', 700, 18, 1.4);
  g.fillStyle = C.stoneSoft; g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText('PREGUNTA A FINANZAS', x + 26, y + 40);
  badge(x + w - 96, y + 22, 'DEMO', 'demo', 1, 16);

  // burbuja del usuario (a la derecha, tono marca)
  const q = '¿Cuánto tenemos pendiente de cobrar?';
  const qp = ramp(t, 0.55, 0.95, easeOutQuint);
  if (qp > 0){
    font('in', 600, V ? 23 : 24, 0);
    const qw = g.measureText(q).width + 44;
    const qx = x + w - 26 - qw, qy = y + 74;
    g.save(); g.globalAlpha = qp; g.translate(0, (1 - qp) * 12);
    roundRect(qx, qy, qw, 52, 20);
    g.fillStyle = rgba(C.blue, .85); g.fill();
    g.textAlign = 'left'; g.textBaseline = 'middle';
    g.fillStyle = '#04060a';  // tinta oscura sobre el degradado de marca, nunca blanco (docs/DISENO.md)
    g.fillText(q, qx + 22, qy + 27);
    g.restore();
  }

  // respuesta del asistente: titular + detalle + fuente — el formato real
  const ansY = y + 150;
  const ap = ramp(t, 1.25, 1.65, easeOutQuint);
  if (ap > 0){
    font('sg', 700, V ? 27 : 28, -0.2);
    g.save(); g.globalAlpha = ap; g.translate(0, (1 - ap) * 14);
    const lines = wrap('Tenéis 6.150 € pendientes de cobrar, repartidos en 4 facturas.', w - 60);
    g.fillStyle = C.ink; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    lines.forEach((ln, i) => g.fillText(ln, x + 30, ansY + i * 36));
    g.restore();
  }

  const details = [
    { txt: '2 facturas vencen esta semana', tone: 'warning' },
    { txt: '1 factura vencida hace 9 días', tone: 'critical' }
  ];
  const dy0 = ansY + 66;
  details.forEach((d, i) => {
    const dp = ramp(t, 2.2 + i * 0.35, 2.55 + i * 0.35, easeOutQuint);
    if (dp <= 0.001) return;
    g.save(); g.globalAlpha = ap * clamp(dp); g.translate(0, (1 - dp) * 10);
    const toneColor = d.tone === 'warning' ? C.amber : C.red;
    dot(x + 38, dy0 + i * 40, 5, toneColor, 1);
    font('in', 500, V ? 21 : 22, 0);
    g.fillStyle = C.stone; g.textAlign = 'left'; g.textBaseline = 'middle';
    g.fillText(d.txt, x + 56, dy0 + i * 40 + 1);
    g.restore();
  });

  // línea de fuente — el diferenciador real: nunca inventa una cifra
  const fp = ramp(t, 3.35, 3.75, easeOut);
  if (fp > 0){
    const fy = y + h - 92;
    g.save(); g.globalAlpha = ap * fp;
    g.strokeStyle = rgba(C.borderSubtle, 1); g.lineWidth = 1;
    g.beginPath(); g.moveTo(x + 26, fy - 20); g.lineTo(x + w - 26, fy - 20); g.stroke();
    font('mo', 400, V ? 16 : 17, 0.3);
    g.fillStyle = C.stoneSoft; g.textAlign = 'left'; g.textBaseline = 'middle';
    const fLines = wrap('FUENTE · FACTURAS EMITIDAS Y NO COBRADAS, A FECHA DE HOY.', w - 60);
    fLines.forEach((ln, i) => g.fillText(ln, x + 26, fy + i * 22));
    g.restore();
  }

  const bp = ramp(t, 4.0, 4.4, easeOutBack);
  if (bp > 0.001){
    g.save(); g.globalAlpha = ap * clamp(bp);
    badge(x + 26, y + h - 46, 'VER LOS COBROS →', 'brand', 1, 16);
    g.restore();
  }
  g.restore();

  const cap = 'ASISTENTE DETERMINISTA.\nNUNCA INVENTA CIFRAS.';
  const cp = ramp(t, dur - 1.75, dur - 1.3, easeOutQuint);
  if (cp > 0){
    const size = V ? 42 : 40;
    font('sg', 700, size, -0.3);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    const lines = cap.split('\n');
    const lh = size * 1.2;
    const top = V ? H * 0.90 - lh/2 : H * 0.92 - lh/2;
    g.save(); g.globalAlpha = a * cp;
    g.fillStyle = C.cyan300; g.shadowColor = 'rgba(6,8,13,.92)'; g.shadowBlur = 26;
    centeredLines(lines, CX, top, lh, cp, 16);
    g.restore();
  }
}

/* ══════════════════ ESCENA 6 — control (38.0 – 44.5) ══════════════════ */

const RNG6 = makeRng(0xC0117A);
const CHART_PTS = Array.from({length: 12}, (_, i) => 0.30 + 0.5 * (i/11) + (RNG6() - 0.5) * 0.14);
const PROJECTS6 = [
  { name: 'Proyecto Alfa', tone: 'success', note: 'dentro de margen' },
  { name: 'Proyecto Beta', tone: 'warning', note: 'por debajo del 15 % de margen' },
  { name: 'Proyecto Delta', tone: 'success', note: 'dentro de margen' }
];

function s6(t){
  const dur = 6.6;
  const inn = ramp(t, 0, 0.10, easeInOut);
  const out = 1 - ramp(t, dur - 0.35, dur, easeInOut);
  const a = inn * out;

  const w = V ? W * 0.86 : W * 0.56;
  const h = V ? 210 : 200;
  const x = CX - w/2;
  const y1 = V ? H * 0.30 : H * 0.24;
  const p1 = ramp(t, 0.10, 0.5, easeOutQuint);

  g.save(); g.globalAlpha = a * p1; g.translate(0, (1 - p1) * 18);
  panel(x, y1, w, h, 16);
  font('mo', 700, 16, 1.3);
  g.fillStyle = C.stoneSoft; g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText('EVOLUCIÓN · 12 MESES', x + 24, y1 + 32);
  const cw = w - 48, ch = h - 90, cx0 = x + 24, cy0 = y1 + 56;
  const drawn = ramp(t, 0.6, 1.6, easeOut);
  g.save();
  g.beginPath();
  CHART_PTS.forEach((v, i) => {
    if (i / (CHART_PTS.length - 1) > drawn) return;
    const px = cx0 + cw * (i / (CHART_PTS.length - 1));
    const py = cy0 + ch * (1 - v);
    if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
  });
  g.strokeStyle = C.cyan; g.lineWidth = 3; g.lineJoin = 'round'; g.stroke();
  g.restore();
  g.restore();

  const y2 = y1 + h + (V ? 40 : 34);
  const rowH = V ? 66 : 60;
  const h2 = PROJECTS6.length * rowH + 62;
  const p2 = ramp(t, 0.55, 0.95, easeOutQuint);
  g.save(); g.globalAlpha = a * p2; g.translate(0, (1 - p2) * 18);
  panel(x, y2, w, h2, 16);
  font('mo', 700, 16, 1.3);
  g.fillStyle = C.stoneSoft; g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText('RENTABILIDAD DE PROYECTOS', x + 24, y2 + 32);
  PROJECTS6.forEach((pr, i) => {
    const rp = ramp(t, 1.1 + i * 0.22, 1.4 + i * 0.22, easeOutQuint);
    if (rp <= 0.001) return;
    const ry = y2 + 62 + i * rowH;
    g.save(); g.globalAlpha = clamp(rp); g.translate(0, (1 - rp) * 12);
    const toneColor = pr.tone === 'success' ? C.green : C.amber;
    dot(x + 40, ry + 6, 6, toneColor, 1);
    font('sg', 700, V ? 22 : 23, -0.2);
    g.fillStyle = C.ink; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    g.fillText(pr.name, x + 62, ry + 4);
    font('in', 500, V ? 17 : 18, 0);
    g.fillStyle = toneColor;
    g.fillText(pr.note, x + 62, ry + 28);
    g.restore();
  });
  g.restore();

  const capLines = ['MENOS TIEMPO BUSCANDO INFORMACIÓN.', 'MÁS TIEMPO TOMANDO DECISIONES.'];
  const c1 = ramp(t, 2.9, 3.4, easeOutQuint) * (1 - ramp(t, 4.6, 5.0, easeInOut));
  const c2 = ramp(t, 4.8, 5.3, easeOutQuint);
  const size = V ? 38 : 40;
  font('sg', 700, size, -0.3);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const cy = V ? H * 0.90 : H * 0.90;
  if (c1 > 0){ g.save(); g.globalAlpha = a * c1; g.fillStyle = C.ink; g.shadowColor='rgba(6,8,13,.9)'; g.shadowBlur=22; g.fillText(capLines[0], CX, cy); g.restore(); }
  if (c2 > 0){ g.save(); g.globalAlpha = a * c2; g.fillStyle = C.green300; g.shadowColor='rgba(6,8,13,.9)'; g.shadowBlur=22; g.fillText(capLines[1], CX, cy); g.restore(); }
}

/* ══════════════════ ESCENA 7 — cierre (44.5 – 55.0) ══════════════════ */

function s7(t){
  const cover = ramp(t, 0, 0.4, easeInOut);
  g.save(); g.globalAlpha = cover;
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#080c16'); bg.addColorStop(.55, '#0a1020'); bg.addColorStop(1, '#06080d');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const rg = g.createRadialGradient(CX, CY - H*0.05, 0, CX, CY - H*0.05, Math.max(W,H)*0.6);
  rg.addColorStop(0, rgba(C.blue, .22)); rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  g.restore();

  const lp = ramp(t, 0.30, 1.0, easeOutQuint);
  if (lp > 0){
    const logoY = V ? H * 0.33 : CY - 96;
    const iconH = V ? 90 : 86;
    const iconW = LOGO ? iconH * (LOGO.naturalWidth / LOGO.naturalHeight) : iconH * 1.19;
    font('sg', 700, V ? 78 : 82, 0.5);
    const wordW = g.measureText('D-Code Finance').width;
    const x0 = CX - (iconW + 26 + wordW) / 2;

    g.save(); g.globalAlpha = lp; g.translate(0, (1 - lp) * 18);
    if (LOGO){
      g.save(); g.shadowColor = rgba(C.blue, .5); g.shadowBlur = 32;
      g.drawImage(LOGO, x0, logoY - iconH/2, iconW, iconH); g.restore();
    }
    g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    font('sg', 700, V ? 78 : 82, 0.5);
    g.fillStyle = C.ink; g.fillText('D-Code ', x0 + iconW + 26, logoY + 11);
    const w1 = g.measureText('D-Code ').width;
    g.fillStyle = C.cyan; g.fillText('Finance', x0 + iconW + 26 + w1, logoY + 11);
    g.restore();
  }

  const qp = ramp(t, 1.2, 1.7, easeOutQuint);
  if (qp > 0){
    const size = V ? 46 : 48;
    font('sg', 700, size, -0.2);
    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    const lines = wrap('Todo el dinero de tu empresa, explicado.', V ? W * 0.84 : W * 0.55);
    const lh = size * 1.26;
    const top = V ? H * 0.48 : CY - 12;
    g.fillStyle = C.ink;
    centeredLines(lines, CX, top, lh, qp, 20);
  }

  const sp = ramp(t, 2.3, 2.75, easeOutQuint);
  if (sp > 0){
    font('mo', 700, V ? 24 : 25, 3);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.save(); g.globalAlpha = sp;
    g.fillStyle = C.stone;
    g.fillText('CENTRALIZA · CONTROLA · ENTIENDE · DECIDE', CX, V ? H * 0.585 : CY + 78);
    g.restore();
  }

  const mp = ramp(t, 3.4, 3.85, easeOutQuint);
  if (mp > 0){
    font('mo', 700, V ? 25 : 26, 3);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.save(); g.globalAlpha = mp;
    g.fillStyle = C.violet300;
    g.fillText('MUY PRONTO, PARA NUESTROS CLIENTES', CX, V ? H * 0.66 : CY + 132);
    g.restore();
  }

  const dp = ramp(t, 4.1, 4.55, easeOutQuint);
  if (dp > 0){
    const y = V ? H * 0.75 : CY + 210;
    g.save(); g.globalAlpha = dp;
    const lw = 190 * easeOut(dp);
    const grd = g.createLinearGradient(CX - lw/2, 0, CX + lw/2, 0);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(.5, rgba(C.cyan, .85));
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd; g.fillRect(CX - lw/2, y - 1, lw, 2);

    font('mo', 700, V ? 38 : 40, 3);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = C.cyan;
    g.shadowColor = rgba(C.cyan, .4); g.shadowBlur = 24;
    g.fillText('dcodepartners.com', CX, y + (V ? 56 : 54));
    g.restore();
  }
}

/* ══════════════════════════ línea de tiempo ══════════════════════════ */

const SCENES = [
  { a: 0.0,   b: 4.0,   fn: s1 },
  { a: 4.0,   b: 13.6,  fn: s2 },
  { a: 13.6,  b: 21.0,  fn: s3 },
  { a: 21.0,  b: 31.85, fn: s4 },
  { a: 31.85, b: 39.3,  fn: s5 },
  { a: 39.3,  b: 45.9,  fn: s6 },
  { a: 45.9,  b: 56.4,  fn: s7 }
];

function render(t){
  t = clamp(t, 0, DUR);
  g.save();
  g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.letterSpacing = '0px';

  background(t);

  for (let i = 0; i < SCENES.length; i++){
    const sc = SCENES[i];
    if (t >= sc.a && t < sc.b){
      const localT = t - sc.a;
      const dx = cutOffsetX(localT, sc.b - sc.a, i === 0, i === SCENES.length - 1);
      g.save(); g.translate(dx, 0); sc.fn(localT); g.restore();
    }
  }
  if (t >= DUR - 0.001){ g.save(); s7(DUR - 45.9); g.restore(); }

  vignette();

  const intro = 1 - ramp(t, 0, 0.3, easeInOut);
  if (intro > 0){ g.fillStyle = rgba('#000000', intro); g.fillRect(0, 0, W, H); }
  g.restore();
}

/* ═══════════════════════════ arranque ═══════════════════════════ */

function loadLogo(){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => { LOGO = img; res(); };
    img.onerror = () => res();
    img.src = './assets/dcode-mark.png';
  });
}

async function boot(){
  await Promise.all([
    document.fonts.load('700 100px "Space Grotesk"'),
    document.fonts.load('500 100px "Space Grotesk"'),
    document.fonts.load('700 100px "JetBrains Mono"'),
    document.fonts.load('400 100px "JetBrains Mono"'),
    document.fonts.load('500 100px Inter'),
    document.fonts.load('600 100px Inter'),
    document.fonts.load('700 100px Inter')
  ]);
  await document.fonts.ready;
  await loadLogo();

  if (FRAME !== null){
    render(FRAME);
    window.__ready = true;
  } else {
    document.body.classList.add('preview');
    const t0 = performance.now();
    const loop = () => { render(((performance.now() - t0) / 1000) % (DUR + 1.2)); requestAnimationFrame(loop); };
    loop();
  }
}

window.__render = render;
boot();
})();
</script>
