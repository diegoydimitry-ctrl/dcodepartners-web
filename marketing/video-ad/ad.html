<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>D-Code Partners — Anuncio</title>
<!--
  Anuncio D-Code Partners — 40 s.
  Render determinista: toda la imagen se deriva de render(t). No hay estado
  acumulado entre fotogramas, así que capturar t = 0, 1/30, 2/30 ... produce
  siempre exactamente el mismo vídeo.

  Parámetros de URL:
    ?fmt=9x16 | 16x9   formato (por defecto 9x16)
    ?t=12.5            dibuja un único fotograma en ese segundo (modo captura)
    sin ?t             reproduce en tiempo real para previsualizar en el navegador
-->
<style>
  @font-face{ font-family:'Inter'; font-weight:400 800; font-display:block;
    src:url('../../assets/fonts/inter-variable.woff2') format('woff2'); }
  @font-face{ font-family:'Space Grotesk'; font-weight:500 700; font-display:block;
    src:url('../../assets/fonts/spacegrotesk-variable.woff2') format('woff2'); }
  @font-face{ font-family:'JetBrains Mono'; font-weight:400 700; font-display:block;
    src:url('../../assets/fonts/jetbrainsmono-variable.woff2') format('woff2'); }

  html,body{ margin:0; padding:0; background:#000; overflow:hidden; }
  /* En modo captura el canvas se muestra a tamaño real (1:1 px) para que el
     screenshot de Playwright salga exactamente a la resolución nativa. */
  #stage{ display:block; }
  body.preview{ display:flex; align-items:center; justify-content:center; height:100vh; }
  body.preview #stage{ max-width:100vw; max-height:100vh; width:auto; height:auto;
    object-fit:contain; box-shadow:0 40px 120px -30px rgba(0,0,0,.9); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(() => {
'use strict';

/* ─────────────────────────── configuración ─────────────────────────── */

const Q     = new URLSearchParams(location.search);
const FMT   = Q.get('fmt') === '16x9' ? '16x9' : '9x16';
const FRAME = Q.has('t') ? parseFloat(Q.get('t')) : null;
const DUR   = 40.0;                       // duración total en segundos

const cv  = document.getElementById('stage');
const W   = FMT === '9x16' ? 1080 : 1920;
const H   = FMT === '9x16' ? 1920 : 1080;
cv.width = W; cv.height = H;
cv.style.width = W + 'px'; cv.style.height = H + 'px';
const g = cv.getContext('2d', { alpha:false });

const V  = H > W;                          // composición vertical
const CX = W / 2, CY = H / 2;
const TS = V ? 1 : 1.10;                   // ajuste de cuerpo tipográfico
const CW = V ? W * 0.86 : W * 0.60;        // ancho útil para bloques de texto

/* Paleta: tomada de assets/css/styles.css (identidad real de la web). */
const C = {
  bg:'#06080d', bgSoft:'#090c14', panel:'#0e1320', panel2:'#121828',
  border:'#1e2536', borderSoft:'#171d2c',
  ink:'#eef2fb', stone:'#a7b0c4', stoneSoft:'#8089a0',
  blue:'#5b8cff', cyan:'#43e0ff', violet:'#9b6bff',
  green:'#34e7a4', amber:'#ffb454', red:'#ff6b6b'
};

/* ───────────────────────────── utilidades ───────────────────────────── */

const clamp = (v,a=0,b=1) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b - a) * t;
const easeOut     = t => 1 - Math.pow(1 - t, 3);
const easeOutQuint= t => 1 - Math.pow(1 - t, 5);
const easeInOut   = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const easeOutBack = t => { const c=1.70158, s=c+1; return 1 + s*Math.pow(t-1,3) + c*Math.pow(t-1,2); };

/** Rampa 0→1 entre [a,b] con easing. */
const ramp = (t,a,b,fn=easeOut) => fn(clamp((t - a) / (b - a)));
/** Ventana: sube en [a,b], se mantiene, baja en [c,d]. */
const win = (t,a,b,c,d) => Math.min(ramp(t,a,b), 1 - ramp(t,c,d));
const easeInPower4  = t => t*t*t*t;
const easeOutPower4 = t => 1 - Math.pow(1 - t, 4);

/* ─────────────────────── corte entre escenas (cut-the-curve) ───────────────────────
   Corte por defecto entre escenas, según la doctrina de movimiento: en vez de un
   crossfade por opacidad (que deja las dos escenas casi a alfa 0 a la vez y crea un
   fotograma "muerto" en cada corte), la escena saliente se desliza en la dirección de
   la corriente (izquierda) acelerando, y la entrante continúa esa misma dirección
   decelerando hasta su sitio — las dos mitades de una misma curva power4.inOut, así que
   la velocidad coincide exactamente en el corte. Recorrido parcial (~12% del fotograma),
   nunca fuera de plano del todo. */
const CUT_TRAVEL = 0.12;   // fracción del ancho de fotograma
const CUT_DUR    = 0.32;   // s, igual en salida y entrada — mitades espejadas

function cutOffsetX(localT, sceneDur, isFirst, isLast){
  const travel = CUT_TRAVEL * W;
  if (!isLast && sceneDur - localT < CUT_DUR){
    const p = easeInPower4(clamp((localT - (sceneDur - CUT_DUR)) / CUT_DUR));
    return -travel * p;
  }
  if (!isFirst && localT < CUT_DUR){
    const p = easeOutPower4(clamp(localT / CUT_DUR));
    return travel * (1 - p);
  }
  return 0;
}

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }

/** #rrggbb -> rgba(r,g,b,alpha) */
function rgba(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

const FAM = { sg:'"Space Grotesk"', in:'Inter', mo:'"JetBrains Mono"' };
function font(fam, weight, size, letter=0){
  g.font = `${weight} ${size}px ${FAM[fam]}`;
  g.letterSpacing = `${letter}px`;
}

function roundRect(x,y,w,h,r){ g.beginPath(); g.roundRect(x,y,w,h,r); }

/** Divide `text` en líneas que caben en maxW (la fuente ya debe estar fijada). */
function wrap(text, maxW){
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words){
    const test = line ? line + ' ' + w : w;
    if (g.measureText(test).width > maxW && line){ lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

/** Dibuja líneas centradas. `rise` desplaza cada línea con retardo escalonado. */
function centeredLines(lines, cx, top, lh, prog, rise = 34){
  for (let i = 0; i < lines.length; i++){
    const p = clamp((prog - i * 0.10) / (1 - Math.min(0.5, lines.length * 0.10)));
    const e = easeOutQuint(p);
    g.save();
    g.globalAlpha = e;
    g.fillText(lines[i], cx, top + i * lh + (1 - e) * rise);
    g.restore();
  }
}

/* ─────────────────────── fondo, atmósfera y viñeta ─────────────────────── */

/* Estados de ambiente por escena: color de resplandor e intensidad. */
const MOOD = [
  { t:0.0,  c:C.blue,  i:0.16 },
  { t:8.0,  c:C.blue,  i:0.24 },
  { t:11.5, c:C.amber, i:0.20 },
  { t:15.0, c:C.red,   i:0.24 },
  { t:15.6, c:C.blue,  i:0.02 },   // el corte: casi negro
  { t:18.5, c:C.blue,  i:0.20 },
  { t:24.0, c:C.cyan,  i:0.28 },
  { t:30.0, c:C.green, i:0.22 },
  { t:34.6, c:C.blue,  i:0.26 },
  { t:40.0, c:C.blue,  i:0.20 }
];

function mixHex(h1, h2, t){
  const a = parseInt(h1.slice(1),16), b = parseInt(h2.slice(1),16);
  const r = Math.round(lerp((a>>16)&255,(b>>16)&255,t));
  const gr= Math.round(lerp((a>>8)&255,(b>>8)&255,t));
  const bl= Math.round(lerp(a&255,b&255,t));
  return `rgb(${r},${gr},${bl})`;
}

function mood(t){
  let i = 0;
  while (i < MOOD.length - 2 && t > MOOD[i+1].t) i++;
  const A = MOOD[i], B = MOOD[i+1];
  const k = easeInOut(clamp((t - A.t) / (B.t - A.t)));
  return { c: mixHex(A.c, B.c, k), i: lerp(A.i, B.i, k) };
}

function background(t){
  g.fillStyle = C.bg;
  g.fillRect(0, 0, W, H);

  const m = mood(t);

  // Resplandor principal, ligeramente por encima del centro.
  const gy = CY - H * 0.06;
  const rg = g.createRadialGradient(CX, gy, 0, CX, gy, Math.max(W, H) * 0.72);
  rg.addColorStop(0,   m.c.replace('rgb(', 'rgba(').replace(')', `,${m.i})`));
  rg.addColorStop(0.45,m.c.replace('rgb(', 'rgba(').replace(')', `,${m.i * 0.28})`));
  rg.addColorStop(1,   'rgba(0,0,0,0)');
  g.fillStyle = rg;
  g.fillRect(0, 0, W, H);

  // Retícula técnica: densidad estable, opacidad ligada al ambiente.
  const step = 90, drift = (t * 6) % step;
  g.strokeStyle = rgba(C.border, 0.55 * clamp(m.i * 3, 0.15, 1));
  g.lineWidth = 1;
  g.beginPath();
  for (let x = -step + drift; x < W + step; x += step){ g.moveTo(x + .5, 0); g.lineTo(x + .5, H); }
  for (let y = -step + drift; y < H + step; y += step){ g.moveTo(0, y + .5); g.lineTo(W, y + .5); }
  g.stroke();
}

function vignette(){
  const rg = g.createRadialGradient(CX, CY, Math.min(W,H) * 0.30, CX, CY, Math.max(W,H) * 0.78);
  rg.addColorStop(0, 'rgba(0,0,0,0)');
  rg.addColorStop(1, 'rgba(0,0,0,0.72)');
  g.fillStyle = rg;
  g.fillRect(0, 0, W, H);
}

/* ═══════════════════════ ESCENA 1 — HOOK (0 – 4.5 s) ═══════════════════════ */

/* Notificaciones que llegan a la vez y se acumulan. */
const CHIPS = [
  ['NUEVO EMAIL',        C.blue ], ['LLAMADA PERDIDA',   C.red   ],
  ['WHATSAPP',           C.green], ['CITA 10:30',        C.cyan  ],
  ['PRESUPUESTO',        C.amber], ['RECORDATORIO',      C.blue  ],
  ['FACTURA PENDIENTE',  C.amber], ['NUEVO LEAD',        C.cyan  ],
  ['SEGUIMIENTO',        C.blue ], ['REUNIÓN 12:00',     C.violet],
  ['CONFIRMAR PEDIDO',   C.green], ['EMAIL SIN LEER',    C.blue  ],
  ['SOLICITUD WEB',      C.cyan ], ['LLAMADA ENTRANTE',  C.red   ],
  ['ACTUALIZAR CRM',     C.blue ], ['DOCUMENTO',         C.stone ],
  ['MENSAJE NUEVO',      C.green], ['CITA 16:45',        C.cyan  ],
  ['REVISAR HOJA',       C.amber], ['NUEVA CONSULTA',    C.blue  ],
  ['PEDIDO WEB',         C.cyan ], ['RESPONDER HOY',     C.red   ]
];

/* Posiciones deterministas, calculadas una sola vez. */
const chipLayout = (() => {
  const rnd = mulberry32(0xD0DE);
  const x0 = V ? W*0.07 : W*0.10, x1 = V ? W*0.93 : W*0.90;
  const y0 = V ? H*0.16 : H*0.14, y1 = V ? H*0.60 : H*0.66;
  const cols = V ? 2 : 4;
  return CHIPS.map((c, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    const rows = Math.ceil(CHIPS.length / cols);
    return {
      label: c[0], color: c[1],
      x: lerp(x0, x1, (col + 0.5) / cols) + (rnd() - .5) * (V ? 70 : 90),
      y: lerp(y0, y1, (row + 0.5) / rows) + (rnd() - .5) * 54,
      rot: (rnd() - .5) * 0.075,
      // Aparición acelerada: al principio gotean, al final se desbordan.
      at: 0.5 + 3.15 * Math.pow(i / CHIPS.length, 1.65)
    };
  });
})();

function drawChip(c, appear, dim){
  const e = easeOutBack(appear);
  font('mo', 700, 21 * TS, 1.6);
  const tw = g.measureText(c.label).width;
  const w = tw + 92, h = 60;

  g.save();
  g.translate(c.x, c.y + (1 - easeOut(appear)) * 26);
  g.rotate(c.rot * easeOut(appear));
  g.scale(lerp(0.90, 1, e), lerp(0.90, 1, e));
  g.globalAlpha = easeOut(appear) * dim;

  g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = 26; g.shadowOffsetY = 10;
  roundRect(-w/2, -h/2, w, h, 14);
  g.fillStyle = C.panel2; g.fill();
  g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0;
  g.strokeStyle = rgba(C.border, 1); g.lineWidth = 1.4; g.stroke();

  // Punto de estado
  g.beginPath(); g.arc(-w/2 + 28, 0, 7, 0, Math.PI*2);
  g.fillStyle = c.color; g.fill();
  g.shadowColor = c.color; g.shadowBlur = 16; g.fill();
  g.shadowColor = 'transparent'; g.shadowBlur = 0;

  font('mo', 700, 21 * TS, 1.6);
  g.fillStyle = C.stone; g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText(c.label, -w/2 + 48, 1);
  g.restore();
}

function scene1(t){                     // t local 0 → 4.5
  const out = 1 - ramp(t, 4.40, 4.5, easeInOut);

  for (const c of chipLayout){
    if (t < c.at) continue;
    const appear = clamp((t - c.at) / 0.42);
    drawChip(c, appear, out * lerp(0.55, 1, clamp((t - c.at) / 1.4)));
  }

  // Titular. En 16:9 se le da más ancho para que entre en dos líneas y no
  // invada la zona donde se amontonan las tarjetas.
  const p = ramp(t, 1.45, 2.9, easeOutQuint);
  if (p > 0){
    const size = V ? 68 : 66;
    const maxW = V ? CW : W * 0.78;
    font('sg', 700, size, -0.5);
    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    const lines = wrap('¿CUÁNTO TIEMPO PIERDE TU EMPRESA EN TAREAS REPETITIVAS?', maxW);
    const lh = size * 1.14;
    const top = V ? H * 0.74 : H * 0.80;

    // Velo inferior: garantiza contraste del titular sobre las tarjetas.
    const scrimTop = top - (lines.length - 1) * lh / 2 - size * 1.5;
    const sc = g.createLinearGradient(0, scrimTop, 0, H);
    sc.addColorStop(0, 'rgba(6,8,13,0)');
    sc.addColorStop(0.45, 'rgba(6,8,13,.82)');
    sc.addColorStop(1, 'rgba(6,8,13,.95)');
    g.save(); g.globalAlpha = out * p;
    g.fillStyle = sc; g.fillRect(0, scrimTop, W, H - scrimTop);
    g.restore();

    g.save(); g.globalAlpha = out;
    g.fillStyle = C.ink;
    g.shadowColor = 'rgba(6,8,13,.9)'; g.shadowBlur = 34;
    centeredLines(lines, CX, top - (lines.length - 1) * lh / 2, lh, p);
    g.restore();
  }
}

/* ═══════════════════ ESCENA 2 — EL PROBLEMA (4.5 – 10.5 s) ═══════════════════ */

const TASKS = [
  'Responder correos',      'Copiar datos al CRM',
  'Organizar el calendario','Enviar seguimientos',
  'Preparar documentos',    'Contestar mensajes',
  'Registrar un pedido',    'Confirmar una cita'
];

const WORDS = [
  ['CORREOS.',            0.30, 1.32],
  ['CITAS.',              1.32, 2.30],
  ['DATOS.',              2.30, 3.28],
  ['SEGUIMIENTOS.',       3.28, 4.40],
  ['TAREAS REPETITIVAS.', 4.40, 6.00]
];

function scene2(t){                     // t local 0 → 6.0
  const inn = ramp(t, 0, 0.10, easeInOut);
  const out = 1 - ramp(t, 5.90, 6.0, easeInOut);
  const a   = inn * out;

  // Columna de tareas manuales que se repiten sin fin.
  const rowH  = V ? 92 : 78;
  const listW = V ? W * 0.80 : W * 0.42;
  const listX = V ? CX - listW/2 : W * 0.09;
  const listY = V ? H * 0.115 : H * 0.16;
  const nRows = V ? 12 : 9;

  g.save();
  g.beginPath(); g.rect(listX - 20, listY - 10, listW + 40, nRows * rowH + 20); g.clip();

  const scroll = t * rowH * 1.55;        // desplazamiento continuo = repetición
  for (let i = -1; i < nRows + 1; i++){
    const idx = (Math.floor(scroll / rowH) + i);
    const y = listY + i * rowH - (scroll % rowH);
    const label = TASKS[((idx % TASKS.length) + TASKS.length) % TASKS.length];
    const edge = clamp(Math.min(y - listY + rowH, listY + nRows*rowH - y) / (rowH*1.2));

    g.save(); g.globalAlpha = a * edge * 0.95;
    roundRect(listX, y, listW, rowH - 14, 12);
    g.fillStyle = C.panel; g.fill();
    g.strokeStyle = rgba(C.borderSoft, 1); g.lineWidth = 1.2; g.stroke();

    // Cuadro de "hecho" que se marca y se vuelve a vaciar: el bucle sin salida.
    const cyc = ((t * 1.55 + i * 0.37) % 1);
    roundRect(listX + 24, y + (rowH-14)/2 - 13, 26, 26, 7);
    g.fillStyle = cyc > 0.5 ? rgba(C.blue, .22) : 'rgba(0,0,0,0)'; g.fill();
    g.strokeStyle = cyc > 0.5 ? C.blue : C.border; g.lineWidth = 1.6; g.stroke();
    if (cyc > 0.5){
      g.beginPath();
      g.moveTo(listX + 31, y + (rowH-14)/2);
      g.lineTo(listX + 36, y + (rowH-14)/2 + 6);
      g.lineTo(listX + 44, y + (rowH-14)/2 - 7);
      g.strokeStyle = C.blue; g.lineWidth = 2.6; g.lineCap = 'round'; g.stroke();
    }

    font('in', 500, 26 * TS, 0);
    g.fillStyle = C.stoneSoft; g.textAlign = 'left'; g.textBaseline = 'middle';
    g.fillText(label, listX + 70, y + (rowH-14)/2);

    // Contador de repeticiones a la derecha
    font('mo', 700, 20 * TS, 1);
    g.fillStyle = rgba(C.stoneSoft, .55); g.textAlign = 'right';
    g.fillText('×' + (12 + (idx * 7) % 240), listX + listW - 24, y + (rowH-14)/2);
    g.restore();
  }
  g.restore();

  // Palabra dominante
  for (const [word, s, e] of WORDS){
    if (t < s || t > e) continue;
    const p  = ramp(t, s, s + 0.32, easeOutQuint);
    const o  = 1 - ramp(t, e - 0.18, e, easeInOut);
    const size = V ? (word.length > 12 ? 74 : 92) : (word.length > 12 ? 86 : 104) * TS;
    font('sg', 700, size, -1);
    g.save();
    g.globalAlpha = a * p * o;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    const x = V ? CX : W * 0.72;
    const y = V ? H * 0.80 : CY;
    g.translate(x, y + (1 - p) * 26);
    g.fillStyle = C.ink;
    g.shadowColor = 'rgba(6,8,13,.95)'; g.shadowBlur = 40;
    const lines = wrap(word, V ? W * 0.90 : W * 0.50);
    const lh = size * 1.08;
    for (let i = 0; i < lines.length; i++)
      g.fillText(lines[i], 0, (i - (lines.length-1)/2) * lh);
    g.restore();
  }
}

/* ═══════════════════ ESCENA 3 — EL COSTE OCULTO (10.5 – 15.5 s) ═══════════════════ */

function scene3(t){                     // t local 0 → 5.0
  const inn = ramp(t, 0, 0.10, easeInOut);
  const out = 1 - ramp(t, 4.90, 5.0, easeInOut);
  const a   = inn * out;

  const cy = V ? H * 0.33 : CY;
  const R  = V ? 285 : 215;

  g.save(); g.globalAlpha = a;

  // Esfera de reloj
  g.beginPath(); g.arc(CX, cy, R, 0, Math.PI * 2);
  g.strokeStyle = rgba(C.border, 1); g.lineWidth = 2; g.stroke();

  for (let i = 0; i < 60; i++){
    const ang = (i / 60) * Math.PI * 2 - Math.PI / 2;
    const maj = i % 5 === 0;
    const r1 = R - (maj ? 26 : 13), r2 = R - 2;
    g.beginPath();
    g.moveTo(CX + Math.cos(ang)*r1, cy + Math.sin(ang)*r1);
    g.lineTo(CX + Math.cos(ang)*r2, cy + Math.sin(ang)*r2);
    g.strokeStyle = rgba(maj ? C.stoneSoft : C.border, maj ? .8 : .9);
    g.lineWidth = maj ? 3 : 1.5; g.stroke();
  }

  // Agujas acelerando
  const spin = Math.pow(clamp(t / 4.2), 1.9);
  const minute = spin * Math.PI * 2 * 11;
  const hour   = minute / 12;
  const drawHand = (ang, len, wdt, col) => {
    g.save(); g.translate(CX, cy); g.rotate(ang - Math.PI/2);
    g.beginPath(); g.moveTo(-14, 0); g.lineTo(len, 0);
    g.strokeStyle = col; g.lineWidth = wdt; g.lineCap = 'round';
    g.shadowColor = col; g.shadowBlur = 18; g.stroke();
    g.restore();
  };
  drawHand(hour,   R * 0.52, 9, C.stone);
  drawHand(minute, R * 0.80, 5, C.amber);
  g.beginPath(); g.arc(CX, cy, 9, 0, Math.PI*2); g.fillStyle = C.ink; g.fill();

  // Estela del minutero
  g.beginPath();
  g.arc(CX, cy, R * 0.80, -Math.PI/2, -Math.PI/2 + Math.min(minute, Math.PI*2 - 0.001));
  g.strokeStyle = rgba(C.amber, .30); g.lineWidth = 6; g.lineCap = 'round'; g.stroke();

  // Contador de horas
  const hours = Math.round(easeOut(clamp(t / 4.0)) * 300);
  const numY  = V ? H * 0.605 : cy + R + 118;
  font('mo', 700, V ? 116 : 108 * TS, -2);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = C.amber;
  g.shadowColor = rgba(C.amber, .45); g.shadowBlur = 40;
  g.fillText('+' + hours + ' h', CX, numY);
  g.shadowColor = 'transparent'; g.shadowBlur = 0;

  font('mo', 700, 22 * TS, 4);
  g.fillStyle = rgba(C.stoneSoft, .9);
  g.fillText('AL AÑO EN TAREAS REPETITIVAS', CX, numY + (V ? 82 : 74));
  g.restore();

  // Ecuación
  const p = ramp(t, 1.55, 2.75, easeOutQuint);
  if (p > 0){
    const size = V ? 50 : 56 * TS;
    font('sg', 700, size, -0.3);
    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    const lines = wrap('PEQUEÑAS TAREAS × MUCHAS VECES = GRANDES PÉRDIDAS', CW);
    const lh = size * 1.2;
    const top = V ? H * 0.80 : H * 0.90;
    g.save(); g.globalAlpha = out;
    g.fillStyle = C.ink;
    g.shadowColor = 'rgba(6,8,13,.9)'; g.shadowBlur = 30;
    centeredLines(lines, CX, top - (lines.length - 1) * lh / 2, lh, p);
    g.restore();
  }
}

/* ═══════════════════════ ESCENA 4 — EL GIRO (15.5 – 20.8 s) ═══════════════════════ */

const NODES = ['EMAIL', 'CRM', 'WHATSAPP', 'CALENDARIO', 'DOCUMENTOS', 'SISTEMAS'];

/** Anillo de nodos: elipse adaptada al formato. */
function ringPos(i, n){
  const ang = (i / n) * Math.PI * 2 - Math.PI / 2;
  const rx = V ? W * 0.335 : W * 0.235;
  const ry = V ? H * 0.185 : H * 0.315;
  const cy = V ? H * 0.40 : CY;
  return { x: CX + Math.cos(ang) * rx, y: cy + Math.sin(ang) * ry };
}

/** Semiancho real de un nodo, para que los conectores lleguen justo al borde. */
function nodeHalfW(label){
  font('mo', 700, 20 * TS, 1.8);
  return (g.measureText(label).width + 62) / 2;
}

function drawNode(x, y, label, appear, glow){
  const e = easeOutBack(clamp(appear));
  font('mo', 700, 20 * TS, 1.8);
  const w = g.measureText(label).width + 62, h = 58;
  g.save();
  g.translate(x, y);
  g.scale(lerp(0.8, 1, e), lerp(0.8, 1, e));
  g.globalAlpha = clamp(appear);
  roundRect(-w/2, -h/2, w, h, 13);
  g.fillStyle = C.panel2; g.fill();
  g.strokeStyle = glow > 0 ? rgba(C.cyan, lerp(0.35, 1, glow)) : rgba(C.border, 1);
  g.lineWidth = glow > 0 ? 2 : 1.4;
  if (glow > 0){ g.shadowColor = rgba(C.cyan, .55 * glow); g.shadowBlur = 26 * glow; }
  g.stroke();
  g.shadowColor = 'transparent'; g.shadowBlur = 0;
  font('mo', 700, 20 * TS, 1.8);
  g.fillStyle = glow > 0.4 ? C.ink : C.stone;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(label, 0, 1);
  g.restore();
}

function scene4(t){                     // t local 0 → 5.3
  // 0 – 0.55 s: silencio visual. Solo una línea de luz que se abre.
  const seam = win(t, 0.05, 0.45, 0.75, 1.15);
  if (seam > 0){
    const wdt = W * 0.86 * easeOut(clamp((t - 0.05) / 0.7));
    const grd = g.createLinearGradient(CX - wdt/2, 0, CX + wdt/2, 0);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(.5, rgba(C.cyan, .9 * seam));
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd;
    g.fillRect(CX - wdt/2, (V ? H*0.40 : CY) - 1.5, wdt, 3);
  }

  // Nodos + conexiones (desde 1.15 s)
  const n = NODES.length;
  const pts = NODES.map((_, i) => ringPos(i, n));
  const netP = ramp(t, 1.15, 3.6, easeInOut);

  // Conexiones: cada arista se dibuja progresivamente.
  const edges = [];
  for (let i = 0; i < n; i++)
    for (let j = i + 1; j < n; j++) edges.push([i, j]);

  g.save();
  edges.forEach(([i, j], k) => {
    const p = clamp((netP * (edges.length + 6) - k) / 6);
    if (p <= 0) return;
    const A = pts[i], B = pts[j];
    g.beginPath();
    g.moveTo(A.x, A.y);
    g.lineTo(lerp(A.x, B.x, easeOut(p)), lerp(A.y, B.y, easeOut(p)));
    const far = Math.abs(i - j) > 1 && Math.abs(i - j) < n - 1;
    g.strokeStyle = rgba(C.blue, far ? .18 * p : .48 * p);
    g.lineWidth = far ? 1.2 : 2;
    g.shadowColor = rgba(C.blue, .35 * p); g.shadowBlur = 12;
    g.stroke();
  });
  g.restore();

  pts.forEach((p, i) => {
    const at = 1.25 + i * 0.13;
    drawNode(p.x, p.y, NODES[i], clamp((t - at) / 0.45), clamp((t - at - 0.3) / 0.8) * 0.7);
  });

  // Los dos remates de copy
  const textY = V ? H * 0.735 : H * 0.845;
  const blocks = [
    ['EL PROBLEMA NO SIEMPRE ES TU EQUIPO.', 0.75, 1.5, 2.55, 2.9],
    ['A VECES ES EL PROCESO.',               3.0,  3.7, 5.05, 5.3]
  ];
  for (const [txt, a, b, c, d] of blocks){
    const o = win(t, a, b, c, d);
    if (o <= 0) continue;
    const size = V ? 62 : 70 * TS;
    font('sg', 700, size, -0.5);
    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    const lines = wrap(txt, CW);
    const lh = size * 1.16;
    g.save(); g.globalAlpha = 1;
    g.fillStyle = C.ink;
    g.shadowColor = 'rgba(6,8,13,.9)'; g.shadowBlur = 34;
    centeredLines(lines, CX, textY - (lines.length - 1) * lh / 2, lh, o);
    g.restore();
  }
}

/* ═════════════════════ ESCENA 5 — LA SOLUCIÓN (20.8 – 28.6 s) ═════════════════════ */

const FLOW   = ['CLIENTE', 'WHATSAPP', 'IA', 'CRM', 'CALENDARIO', 'SEGUIMIENTO'];
const METHOD = ['ANALIZAR', 'DISEÑAR', 'AUTOMATIZAR', 'MEDIR'];

function scene5(t){                     // t local 0 → 7.8
  /* Beat A (0 – 3.9): la cadena de proceso se ejecuta sola. */
  const aOut = 1 - ramp(t, 3.55, 3.95, easeInOut);
  if (aOut > 0){
    const n = FLOW.length;
    g.save(); g.globalAlpha = aOut * ramp(t, 0, 0.10, easeInOut);

    if (V){
      const top = H * 0.20, gap = H * 0.115;
      const pts = FLOW.map((_, i) => ({ x: CX, y: top + i * gap }));
      // Conductos
      for (let i = 0; i < n - 1; i++){
        const p = clamp((ramp(t, 0.25, 2.2) * (n - 1) - i));
        if (p <= 0) continue;
        g.beginPath();
        g.moveTo(pts[i].x, pts[i].y + 36);
        g.lineTo(pts[i].x, pts[i].y + 36 + (gap - 72) * easeOut(p));
        g.strokeStyle = rgba(C.blue, .55); g.lineWidth = 2.5;
        g.shadowColor = rgba(C.blue, .5); g.shadowBlur = 14; g.stroke();
      }
      // Pulso que recorre toda la cadena (dos pasadas)
      for (const off of [0, 1.35]){
        const pt = (t - 1.1 - off) / 1.9;
        if (pt > 0 && pt < 1){
          const s = easeInOut(pt) * (n - 1);
          const i = Math.min(n - 2, Math.floor(s)), f = s - i;
          const y = lerp(pts[i].y + 36, pts[i].y + gap - 36, f);
          const grd = g.createRadialGradient(CX, y, 0, CX, y, 46);
          grd.addColorStop(0, rgba(C.cyan, .95));
          grd.addColorStop(1, 'rgba(0,0,0,0)');
          g.fillStyle = grd; g.beginPath(); g.arc(CX, y, 46, 0, Math.PI*2); g.fill();
        }
      }
      pts.forEach((p, i) => {
        const at = 0.15 + i * 0.16;
        const hot = clamp(1 - Math.abs((t - 1.25 - i * 0.30)) / 0.55);
        drawNode(p.x, p.y, FLOW[i], clamp((t - at) / 0.4), Math.max(hot, 0.35));
      });
    } else {
      const x0 = W * 0.10, x1 = W * 0.90;
      const pts = FLOW.map((_, i) => ({ x: lerp(x0, x1, i / (n - 1)), y: CY - H*0.06 }));
      // Los nodos tienen anchos distintos ("IA" frente a "CALENDARIO"), así que
      // cada tramo se mide contra el borde real de sus dos nodos.
      const edgeL = i => pts[i].x + nodeHalfW(FLOW[i]) + 12;
      const edgeR = i => pts[i].x - nodeHalfW(FLOW[i]) - 12;
      for (let i = 0; i < n - 1; i++){
        const p = clamp((ramp(t, 0.25, 2.2) * (n - 1) - i));
        if (p <= 0) continue;
        const a = edgeL(i), b = edgeR(i + 1);
        g.beginPath();
        g.moveTo(a, pts[i].y);
        g.lineTo(a + (b - a) * easeOut(p), pts[i].y);
        g.strokeStyle = rgba(C.blue, .55); g.lineWidth = 2.5;
        g.shadowColor = rgba(C.blue, .5); g.shadowBlur = 14; g.stroke();
      }
      for (const off of [0, 1.35]){
        const pt = (t - 1.1 - off) / 1.9;
        if (pt > 0 && pt < 1){
          const s = easeInOut(pt) * (n - 1);
          const i = Math.min(n - 2, Math.floor(s)), f = s - i;
          const x = lerp(edgeL(i), edgeR(i + 1), f);
          const grd = g.createRadialGradient(x, pts[i].y, 0, x, pts[i].y, 46);
          grd.addColorStop(0, rgba(C.cyan, .95));
          grd.addColorStop(1, 'rgba(0,0,0,0)');
          g.fillStyle = grd; g.beginPath(); g.arc(x, pts[i].y, 46, 0, Math.PI*2); g.fill();
        }
      }
      pts.forEach((p, i) => {
        const at = 0.15 + i * 0.16;
        const hot = clamp(1 - Math.abs((t - 1.25 - i * 0.30)) / 0.55);
        drawNode(p.x, p.y, FLOW[i], clamp((t - at) / 0.4), Math.max(hot, 0.35));
      });
    }
    g.restore();
  }

  /* Beat B (3.95 – 7.8): el método, escalonado. */
  const bIn = ramp(t, 3.95, 4.3, easeInOut);
  const bOut = 1 - ramp(t, 7.70, 7.8, easeInOut);
  if (bIn > 0){
    g.save(); g.globalAlpha = bIn * bOut;
    const size = V ? 64 : 66 * TS;
    const gap  = V ? 152 : 128;
    const top  = (V ? H * 0.40 : CY) - (METHOD.length - 1) * gap / 2;

    METHOD.forEach((word, i) => {
      const at = 4.30 + i * 0.44;
      const p  = ramp(t, at, at + 0.42, easeOutQuint);
      if (p <= 0) return;
      const y = top + i * gap;

      // Flecha descendente hacia este paso
      if (i > 0){
        const ap = ramp(t, at - 0.20, at + 0.06, easeOut);
        g.save(); g.globalAlpha = bIn * bOut * ap;
        g.beginPath();
        g.moveTo(CX, y - gap + 34); g.lineTo(CX, y - 46);
        g.strokeStyle = rgba(C.blue, .65); g.lineWidth = 2.5; g.stroke();
        g.beginPath();
        g.moveTo(CX - 9, y - 56); g.lineTo(CX, y - 44); g.lineTo(CX + 9, y - 56);
        g.strokeStyle = rgba(C.cyan, .95); g.lineWidth = 2.8;
        g.lineCap = 'round'; g.lineJoin = 'round'; g.stroke();
        g.restore();
      }

      g.save(); g.globalAlpha = bIn * bOut * p;
      g.translate(0, (1 - p) * 22);
      font('sg', 700, size, -0.5);
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = C.ink;
      g.shadowColor = rgba(C.blue, .35); g.shadowBlur = 26;
      g.fillText(word, CX, y);
      g.restore();
    });
    g.restore();
  }
}

/* ═══════════════════════ ESCENA 6 — RESULTADO (28.6 – 34.6 s) ═══════════════════════ */

const GAINS = ['MENOS TAREAS MANUALES', 'MÁS ORGANIZACIÓN', 'MÁS TIEMPO PARA CRECER'];

function scene6(t){                     // t local 0 → 6.0
  const inn = ramp(t, 0, 0.10, easeInOut);
  const out = 1 - ramp(t, 5.90, 6.0, easeInOut);
  const a = inn * out;

  /* La misma empresa de la escena 1, ahora ordenada: rejilla alineada,
     confirmaciones tranquilas en verde en lugar de avisos apilados. */
  const cols = V ? 3 : 6, rows = V ? 4 : 3;
  const cw = V ? W * 0.245 : W * 0.135, ch = V ? 118 : 116;
  const gx = V ? W * 0.10 : W * 0.10, gy = V ? H * 0.14 : H * 0.13;
  const sx = V ? (W * 0.80 - cw) / (cols - 1) : (W * 0.80 - cw) / (cols - 1);
  const sy = V ? 146 : 152;

  for (let r = 0; r < rows; r++){
    for (let c = 0; c < cols; c++){
      const i  = r * cols + c;
      const at = 0.15 + i * 0.055;
      const p  = ramp(t, at, at + 0.5, easeOutQuint);
      if (p <= 0) continue;
      const x = gx + c * sx, y = gy + r * sy;

      g.save(); g.globalAlpha = a * p;
      roundRect(x, y + (1 - p) * 16, cw, ch, 14);
      g.fillStyle = C.panel; g.fill();
      g.strokeStyle = rgba(C.border, 1); g.lineWidth = 1.3; g.stroke();

      // Marca de confirmación
      const ck = ramp(t, at + 0.35, at + 0.75, easeOut);
      const bx = x + 22, by = y + (1 - p) * 16 + 26;
      g.beginPath(); g.arc(bx + 11, by + 11, 13, 0, Math.PI * 2);
      g.fillStyle = rgba(C.green, .16 * ck); g.fill();
      g.strokeStyle = rgba(C.green, .8 * ck); g.lineWidth = 1.6; g.stroke();
      if (ck > 0){
        g.beginPath();
        g.moveTo(bx + 5, by + 11); g.lineTo(bx + 9.5, by + 16); g.lineTo(bx + 17.5, by + 6);
        g.strokeStyle = rgba(C.green, ck); g.lineWidth = 2.6;
        g.lineCap = 'round'; g.lineJoin = 'round'; g.stroke();
      }

      // Barras de datos sincronizados
      for (let k = 0; k < 3; k++){
        const bw = (cw - 44) * [0.9, 0.62, 0.75][k] * ramp(t, at + 0.4 + k*0.06, at + 0.9 + k*0.06);
        roundRect(x + 22, by + 40 + k * 15, bw, 6, 3);
        g.fillStyle = rgba(k === 0 ? C.blue : C.border, k === 0 ? .55 : 1); g.fill();
      }
      g.restore();
    }
  }

  // Los tres beneficios
  const size = V ? 58 : 62;
  const lh   = size * 1.68;
  const top  = V ? H * 0.70 : H * 0.66;
  GAINS.forEach((txt, i) => {
    const at = 0.55 + i * 1.62;
    const p  = ramp(t, at, at + 0.5, easeOutQuint);
    if (p <= 0) return;
    g.save(); g.globalAlpha = out * p;
    g.translate(0, (1 - p) * 24);
    font('sg', 700, size, -0.4);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = C.ink;
    g.shadowColor = 'rgba(6,8,13,.92)'; g.shadowBlur = 32;
    g.fillText(txt, CX, top + i * lh);
    // Subrayado que crece
    const uw = g.measureText(txt).width;
    const up = ramp(t, at + 0.18, at + 0.7, easeOut);
    g.beginPath();
    g.moveTo(CX - uw/2, top + i * lh + size * 0.78);
    g.lineTo(CX - uw/2 + uw * up, top + i * lh + size * 0.78);
    g.strokeStyle = rgba(C.green, .5); g.lineWidth = 2.5; g.stroke();
    g.restore();
  });
}

/* ════════════════════════ ESCENA 7 — CIERRE (34.6 – 40 s) ════════════════════════ */

let LOGO = null;                        // <img> del logotipo real de la marca

function scene7(t){                     // t local 0 → 5.4
  // Fondo limpio azul marino que cubre la retícula
  const cover = ramp(t, 0, 0.5, easeInOut);
  g.save(); g.globalAlpha = cover;
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#080c16');
  bg.addColorStop(0.55, '#0a1020');
  bg.addColorStop(1, '#06080d');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const rg = g.createRadialGradient(CX, CY - H*0.05, 0, CX, CY - H*0.05, Math.max(W,H)*0.6);
  rg.addColorStop(0, rgba(C.blue, .22)); rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  g.restore();

  /* Logotipo real (assets/logo/dcode-icon-sm.png) + logotipo tipográfico
     reproducido con las mismas fuentes y tamaños relativos que la web. */
  const lp = ramp(t, 0.35, 1.15, easeOutQuint);
  if (lp > 0){
    const logoY = V ? H * 0.40 : CY - 70;
    const iconH = V ? 96 : 92;
    const iconW = LOGO ? iconH * (LOGO.naturalWidth / LOGO.naturalHeight) : iconH * 1.19;

    font('sg', 700, V ? 96 : 100, 0.5);
    const wordW = g.measureText('D-Code').width;
    const totalW = iconW + 30 + wordW;
    const x0 = CX - totalW / 2;

    g.save();
    g.globalAlpha = lp;
    g.translate(0, (1 - lp) * 18);

    if (LOGO){
      g.save();
      g.shadowColor = rgba(C.blue, .5); g.shadowBlur = 34;
      g.drawImage(LOGO, x0, logoY - iconH / 2, iconW, iconH);
      g.restore();
    }

    g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    font('sg', 700, V ? 96 : 100, 0.5);
    g.fillStyle = C.ink;
    g.fillText('D-Code', x0 + iconW + 30, logoY + 14);

    font('mo', 700, V ? 27 : 28, 12);
    g.fillStyle = C.cyan;
    g.fillText('PARTNERS', x0 + iconW + 32, logoY + 54);
    g.restore();
  }

  // Pregunta de cierre
  const qp = ramp(t, 1.75, 2.6, easeOutQuint);
  if (qp > 0){
    const size = V ? 54 : 58 * TS;
    font('sg', 700, size, -0.3);
    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    const lines = wrap('¿QUÉ PODRÍAMOS AUTOMATIZAR EN TU EMPRESA?', CW);
    const lh = size * 1.2;
    const top = V ? H * 0.565 : CY + 90;
    g.fillStyle = C.ink;
    centeredLines(lines, CX, top, lh, qp);
  }

  // Filete + dominio
  const dp = ramp(t, 3.05, 3.8, easeOutQuint);
  if (dp > 0){
    const y = V ? H * 0.685 : CY + 232;
    g.save(); g.globalAlpha = dp;
    const lw = 200 * easeOut(dp);
    const grd = g.createLinearGradient(CX - lw/2, 0, CX + lw/2, 0);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(.5, rgba(C.cyan, .85));
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd; g.fillRect(CX - lw/2, y - 1, lw, 2);

    font('mo', 700, V ? 42 : 44, 3);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = C.cyan;
    g.shadowColor = rgba(C.cyan, .4); g.shadowBlur = 26;
    g.fillText('dcodepartners.com', CX, y + (V ? 62 : 60));
    g.restore();
  }

  // Fundido final a negro
  const fade = ramp(t, 5.1, 5.4, easeInOut);
  if (fade > 0){ g.fillStyle = rgba(C.bg, fade); g.fillRect(0, 0, W, H); }
}

/* ══════════════════════════ línea de tiempo ══════════════════════════ */

const SCENES = [
  { a: 0.0,  b: 4.5,  fn: scene1 },
  { a: 4.5,  b: 10.5, fn: scene2 },
  { a: 10.5, b: 15.5, fn: scene3 },
  { a: 15.5, b: 20.8, fn: scene4 },
  { a: 20.8, b: 28.6, fn: scene5 },
  { a: 28.6, b: 34.6, fn: scene6 },
  { a: 34.6, b: 40.0, fn: scene7 }
];

function render(t){
  t = clamp(t, 0, DUR);
  g.save();
  g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.letterSpacing = '0px';

  background(t);

  for (let i = 0; i < SCENES.length; i++){
    const sc = SCENES[i];
    if (t >= sc.a && t < sc.b){
      const localT = t - sc.a;
      const dx = cutOffsetX(localT, sc.b - sc.a, i === 0, i === SCENES.length - 1);
      g.save();
      g.translate(dx, 0);
      sc.fn(localT);
      g.restore();
    }
  }
  if (t >= DUR){ g.save(); scene7(DUR - 34.6); g.restore(); }

  vignette();

  // Entrada desde negro
  const introFade = 1 - ramp(t, 0, 0.35, easeInOut);
  if (introFade > 0){ g.fillStyle = rgba('#000000', introFade); g.fillRect(0, 0, W, H); }

  g.restore();
}

/* ═══════════════════════════ arranque ═══════════════════════════ */

function loadLogo(){
  return new Promise(res => {
    const img = new Image();
    img.onload  = () => { LOGO = img; res(); };
    img.onerror = () => res();               // sin logo antes que romper el render
    // Marca sin la plancha negra semitransparente del PNG original
    // (ver tools/clean-logo.py). Mismos píxeles, fondo realmente transparente.
    img.src = './assets/dcode-mark.png';
  });
}

async function boot(){
  // Las tres fuentes deben estar realmente listas antes del primer fotograma,
  // o el texto se mediría con la métrica equivocada.
  await Promise.all([
    document.fonts.load('700 100px "Space Grotesk"'),
    document.fonts.load('500 100px "Space Grotesk"'),
    document.fonts.load('700 100px "JetBrains Mono"'),
    document.fonts.load('400 100px "JetBrains Mono"'),
    document.fonts.load('500 100px Inter'),
    document.fonts.load('700 100px Inter')
  ]);
  await document.fonts.ready;
  await loadLogo();

  if (FRAME !== null){
    render(FRAME);
    window.__ready = true;                   // señal para el capturador
  } else {
    document.body.classList.add('preview');
    const t0 = performance.now();
    const loop = () => {
      render(((performance.now() - t0) / 1000) % (DUR + 1.2));
      requestAnimationFrame(loop);
    };
    loop();
  }
}

window.__render = render;                    // permite render(t) desde Playwright
boot();
})();
