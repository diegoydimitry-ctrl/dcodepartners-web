<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>D-Code Partners — Anuncio 8 · Reel motivacional (servicios premium)</title>
<!--
  Anuncio 8 — ~45,6 s. Reel motivacional para Instagram: por qué hay
  empresas que operan en otro nivel, y cómo los tres servicios reales de
  D-Code Partners (agentes de IA, automatización, integraciones) son esa
  diferencia. A diferencia del anuncio 7 (que evitaba deliberadamente
  vender), aquí sí se presentan los servicios — pero con el mismo
  lenguaje editorial premium, sin lista de bullets ni plantilla genérica.

  Las tres líneas de servicio (5, 6 y 7 del guion) son casi textuales de
  servicios/agentes-ia.html, servicios/automatizacion-ia.html y
  servicios/integraciones.html — no se inventa lo que se ofrece.

  Mismo motor que el anuncio 7: fotografía real generada (Figma, alta
  resolución) + Ken Burns, voz Arconte, flash de apertura, subtítulos
  incrustados. Parámetros de URL: ?fmt=9x16|16x9, ?t=segundos.
-->
<style>
  @font-face{ font-family:'Inter'; font-weight:400 800; font-display:block;
    src:url('../../assets/fonts/inter-variable.woff2') format('woff2'); }
  @font-face{ font-family:'Space Grotesk'; font-weight:500 700; font-display:block;
    src:url('../../assets/fonts/spacegrotesk-variable.woff2') format('woff2'); }
  @font-face{ font-family:'JetBrains Mono'; font-weight:400 700; font-display:block;
    src:url('../../assets/fonts/jetbrainsmono-variable.woff2') format('woff2'); }
  html,body{ margin:0; padding:0; background:#000; overflow:hidden; }
  #stage{ display:block; }
  body.preview{ display:flex; align-items:center; justify-content:center; height:100vh; }
  body.preview #stage{ max-width:100vw; max-height:100vh; width:auto; height:auto; object-fit:contain; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(() => {
'use strict';

const Q     = new URLSearchParams(location.search);
const CC    = Q.get('cc') !== '0';
const FMT   = Q.get('fmt') === '16x9' ? '16x9' : '9x16';
const FRAME = Q.has('t') ? parseFloat(Q.get('t')) : null;
const DUR   = 45.6;

const cv = document.getElementById('stage');
const W  = FMT === '9x16' ? 1080 : 1920;
const H  = FMT === '9x16' ? 1920 : 1080;
cv.width = W; cv.height = H;
cv.style.width = W + 'px'; cv.style.height = H + 'px';
const g = cv.getContext('2d', { alpha:false });

const V  = H > W;
const CX = W / 2, CY = H / 2;

const C = {
  bg:'#070706', ink:'#f4f3ef', stone:'#a6a59d', stoneSoft:'#6e6d66',
  accent:'#5b8cff'
};

/* ─────────────────────────── utilidades ─────────────────────────── */

const clamp = (v,a=0,b=1) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b - a) * t;
const easeOut      = t => 1 - Math.pow(1 - t, 3);
const easeOutQuint = t => 1 - Math.pow(1 - t, 5);
const easeInOut    = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const ramp = (t,a,b,fn=easeOut) => fn(clamp((t - a) / (b - a)));

function rgba(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
const FAM = { sg:'"Space Grotesk"', in:'Inter', mo:'"JetBrains Mono"' };
function font(fam, weight, size, letter=0){
  g.font = `${weight} ${size}px ${FAM[fam]}`;
  g.letterSpacing = `${letter}px`;
}
function roundRect(x,y,w,h,r){ g.beginPath(); g.roundRect(x,y,w,h,r); }
function wrap(text, maxW){
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words){
    const test = line ? line + ' ' + w : w;
    if (g.measureText(test).width > maxW && line){ lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
function makeRng(seed){
  let s = seed >>> 0;
  return () => { s = (1103515245 * s + 12345) & 0x7fffffff; return s / 0x7fffffff; };
}

/* ─────────────────────────── fondo cine ─────────────────────────── */

function background(){
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
}
function grain(t){
  const rng = makeRng(Math.floor(t * 24) * 7919 + 101);
  g.save(); g.globalAlpha = 0.035; g.globalCompositeOperation = 'overlay';
  for (let i = 0; i < 140; i++){
    const gx = rng() * W, gy = rng() * H, s = 1 + rng() * 1.4;
    g.fillStyle = rng() > 0.5 ? '#fff' : '#000';
    g.fillRect(gx, gy, s, s);
  }
  g.restore();
}
function vignette(strength = 0.74){
  const rg = g.createRadialGradient(CX, CY, Math.min(W,H)*0.32, CX, CY, Math.max(W,H)*0.78);
  rg.addColorStop(0, 'rgba(0,0,0,0)');
  rg.addColorStop(1, `rgba(0,0,0,${strength})`);
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
}

/* ───────────────────── fotografía — Ken Burns ───────────────────── */

function kenBurns(img, localT, dur, kb){
  if (!img || !img.complete || !img.naturalWidth) return;
  const p = easeInOut(clamp(localT / dur, 0, 1));
  const coverScale = Math.max(W / img.naturalWidth, H / img.naturalHeight);
  const zoom = lerp(kb.z0, kb.z1, p);
  const snap = kb.snap ? lerp(1.035, 1.0, easeOutQuint(clamp(localT / 0.22, 0, 1))) : 1.0;
  const scale = coverScale * zoom * snap;
  const iw = img.naturalWidth * scale, ih = img.naturalHeight * scale;
  const maxPanX = Math.max(0, (iw - W) / 2) * 0.82;
  const maxPanY = Math.max(0, (ih - H) / 2) * 0.82;
  const panX = lerp(-kb.px, kb.px, p) * maxPanX;
  const panY = lerp(-kb.py, kb.py, p) * maxPanY;
  const dx = CX - iw/2 + panX, dy = CY - ih/2 + panY;
  g.imageSmoothingEnabled = true;
  g.imageSmoothingQuality = 'high';
  g.save();
  g.filter = 'grayscale(1) contrast(1.10) brightness(0.98)';
  g.drawImage(img, dx, dy, iw, ih);
  g.restore();
  g.save();
  const lg = g.createLinearGradient(0, 0, 0, H);
  lg.addColorStop(0, 'rgba(10,10,9,.16)');
  lg.addColorStop(0.5, 'rgba(10,10,9,0)');
  lg.addColorStop(1, 'rgba(10,10,9,.24)');
  g.fillStyle = lg; g.fillRect(0, 0, W, H);
  g.restore();
}

/* ─────────────────────── subtítulos sincronizados ─────────────────────── */

const CAPTIONS = [
  { a: 0.30,  b: 4.61,  text: 'Hay un nivel en el que las empresas no compiten por precio.', hook: true },

  { a: 4.96,  b: 7.55,  text: 'Compiten por lo que no se ve:' },
  { a: 7.65,  b: 11.36, text: 'la velocidad, la precisión, el cuidado.' },

  { a: 11.71, b: 14.90, text: 'Mientras unos siguen gestionando todo a mano,' },
  { a: 15.20, b: 17.71, text: 'otros ya operan de otra forma.' },

  { a: 18.11, b: 20.48, text: 'Atención al cliente y ventas' },
  { a: 20.58, b: 23.13, text: 'que no hacen esperar a nadie.' },

  { a: 23.53, b: 27.03, text: 'Procesos que se ejecutan solos,' },
  { a: 27.13, b: 28.78, text: '24 horas al día.' },

  { a: 29.18, b: 33.54, text: 'Herramientas conectadas de verdad, sin fricción.' },

  { a: 33.99, b: 38.17, text: 'En D-Code Partners construimos sistemas premium' },
  { a: 38.27, b: 42.43, text: 'para empresas que no se conforman con lo básico.' }
];

function hookCaption(c, t){
  const fadeIn = 0.22, fadeOut = 0.14;
  const a = ramp(t, c.a, c.a + fadeIn, easeOutQuint) * (1 - ramp(t, c.b - fadeOut, c.b));
  if (a <= 0.001) return;
  const size = V ? 58 : 60;
  font('sg', 700, size, -0.5);
  const maxW = V ? W * 0.84 : W * 0.56;
  const lines = wrap(c.text, maxW);
  const lh = size * 1.16;
  const totalH = lines.length * lh;
  const cy = V ? H * 0.46 : CY;
  const y0 = cy - totalH / 2;
  const sp = clamp((t - c.a) / 0.30, 0, 1);
  const scale = lerp(1.05, 1.0, easeOutQuint(sp));
  g.save();
  g.globalAlpha = a;
  g.translate(CX, cy); g.scale(scale, scale); g.translate(-CX, -cy);
  g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillStyle = C.ink;
  g.shadowColor = 'rgba(0,0,0,.8)'; g.shadowBlur = 30; g.shadowOffsetY = 6;
  lines.forEach((ln, i) => g.fillText(ln, CX, y0 + (i + 1) * lh - lh * 0.24));
  g.restore();
}

function captionsOverlay(t){
  for (const c of CAPTIONS){
    if (c.hook){ hookCaption(c, t); continue; }
    const fade = 0.14;
    const a = ramp(t, c.a, c.a + fade) * (1 - ramp(t, c.b - fade, c.b));
    if (a <= 0.001) continue;
    const size = V ? 32 : 34;
    font('in', 700, size, 0);
    const maxW = V ? W * 0.82 : W * 0.5;
    const lines = wrap(c.text, maxW);
    const lh = size * 1.3;
    const padY = 15, padX = 22;
    const blockH = lines.length * lh + padY * 2;
    const y0 = (V ? H * 0.80 : H * 0.84) - blockH;
    let maxLineW = 0;
    lines.forEach(ln => { maxLineW = Math.max(maxLineW, g.measureText(ln).width); });
    const bw = maxLineW + padX * 2;
    g.save(); g.globalAlpha = a;
    roundRect(CX - bw/2, y0, bw, blockH, 10);
    g.fillStyle = 'rgba(6,6,5,.68)'; g.fill();
    g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillStyle = C.ink;
    lines.forEach((ln, i) => g.fillText(ln, CX, y0 + padY + (i + 1) * lh - lh * 0.28));
    g.restore();
  }
}

/* ══════════════════════════ fotografías / escenas ══════════════════════════ */

const IMG_FILES = [
  '01-skyline.png', '02-papeleo.png', '03-chat-ia.png',
  '04-servidores.png', '05-red.png', '06-cierre-premium.png'
];
const IMAGES = [];

const SCENES = [
  { a: 0.00,  b: 11.71, img: 0, kb: { z0: 1.00, z1: 1.08, px: 0.14, py: 0.30, snap: true } },
  { a: 11.71, b: 18.11, img: 1, kb: { z0: 1.00, z1: 1.07, px: 0.12, py: 0.10 } },
  { a: 18.11, b: 23.53, img: 2, kb: { z0: 1.02, z1: 1.10, px: 0.10, py: 0.08 } },
  { a: 23.53, b: 29.18, img: 3, kb: { z0: 1.00, z1: 1.07, px: 0.30, py: 0.10 } },
  { a: 29.18, b: 33.99, img: 4, kb: { z0: 1.00, z1: 1.09, px: 0.18, py: 0.14 } },
  { a: 33.99, b: 43.90, img: 5, kb: { z0: 1.00, z1: 1.08, px: 0.10, py: 0.20 } }
];
const XFADE = 0.6;

function drawScene(idx, t){
  const sc = SCENES[idx];
  const localT = clamp(t - sc.a, 0, sc.b - sc.a);
  kenBurns(IMAGES[sc.img], localT, sc.b - sc.a, sc.kb);
}

function renderPhotography(t){
  let idx = SCENES.findIndex(sc => t >= sc.a && t < sc.b);
  if (idx === -1) idx = t < SCENES[0].a ? 0 : SCENES.length - 1;
  const sc = SCENES[idx];
  const localT = t - sc.a;
  if (idx > 0 && localT < XFADE){
    drawScene(idx - 1, SCENES[idx - 1].b - 0.001);
    g.save(); g.globalAlpha = clamp(localT / XFADE);
    drawScene(idx, t);
    g.restore();
  } else {
    drawScene(idx, t);
  }
}

/* ══════════════════════════ cierre — marca D-Code ══════════════════════════ */

let LOGO = null;

function closingCard(t){
  const a = ramp(t, 0, 0.55, easeOutQuint);
  if (a <= 0) return;
  g.save(); g.globalAlpha = a * 0.92;
  g.fillStyle = '#050504'; g.fillRect(0, 0, W, H);
  g.restore();

  const lp = ramp(t, 0.18, 0.75, easeOutQuint);
  if (lp > 0){
    const logoY = V ? H * 0.44 : CY - 44;
    const iconH = V ? 72 : 70;
    const iconW = LOGO ? iconH * (LOGO.naturalWidth / LOGO.naturalHeight) : iconH * 1.19;
    font('sg', 700, V ? 60 : 64, 0.4);
    const wordW = g.measureText('D-Code Partners').width;
    const x0 = CX - (iconW + 22 + wordW) / 2;
    g.save(); g.globalAlpha = lp; g.translate(0, (1 - lp) * 14);
    if (LOGO){
      g.save(); g.filter = 'grayscale(1) brightness(1.3)';
      g.drawImage(LOGO, x0, logoY - iconH/2, iconW, iconH); g.restore();
    }
    g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.fillStyle = C.ink;
    font('sg', 700, V ? 60 : 64, 0.4);
    g.fillText('D-Code Partners', x0 + iconW + 22, logoY + 9);
    g.restore();
  }

  const qp = ramp(t, 0.85, 1.25, easeOutQuint);
  if (qp > 0){
    const y = V ? H * 0.515 : CY + 10;
    g.save(); g.globalAlpha = qp;
    font('sg', 500, V ? 26 : 27, 0);
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = C.stone;
    g.fillText('Agentes de IA · Automatización · Integraciones', CX, y);
    g.restore();
  }

  const dp = ramp(t, 1.55, 1.95, easeOutQuint);
  if (dp > 0){
    const y = V ? H * 0.60 : CY + 70;
    g.save(); g.globalAlpha = dp;
    const lw = 100 * easeOut(dp);
    const grd = g.createLinearGradient(CX - lw/2, 0, CX + lw/2, 0);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(.5, rgba(C.accent, .7));
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd; g.fillRect(CX - lw/2, y - 1, lw, 1.5);
    font('mo', 500, V ? 22 : 23, 1.4);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = C.stone;
    g.fillText('dcodepartners.com', CX, y + (V ? 36 : 34));
    g.restore();
  }
}

/* ══════════════════════════ línea de tiempo general ══════════════════════════ */

const FLASH = [3, 5, 2]; // servidores, cierre-premium, chat-ia — variedad visual inmediata
function drawFlashFrame(imgIdx){
  const img = IMAGES[imgIdx];
  if (!img || !img.complete || !img.naturalWidth) return;
  const s = Math.max(W / img.naturalWidth, H / img.naturalHeight) * 1.03;
  const iw = img.naturalWidth * s, ih = img.naturalHeight * s;
  g.save();
  g.filter = 'grayscale(1) contrast(1.14) brightness(0.95)';
  g.drawImage(img, CX - iw/2, CY - ih/2, iw, ih);
  g.restore();
}

function render(t){
  t = clamp(t, 0, DUR);
  g.save();
  g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.letterSpacing = '0px';

  background();

  if (t < 0.30){
    const i = t < 0.10 ? 0 : t < 0.20 ? 1 : 2;
    drawFlashFrame(FLASH[i]);
  } else if (t < 43.90){
    renderPhotography(t);
  } else {
    drawScene(SCENES.length - 1, SCENES[SCENES.length - 1].b - 0.001);
  }

  vignette();
  grain(t);

  if (t < 43.90 && CC) captionsOverlay(t);
  if (t >= 42.43) closingCard(t - 43.90);

  const outro = ramp(t, DUR - 0.5, DUR, easeInOut);
  if (outro > 0){ g.fillStyle = rgba('#000000', outro); g.fillRect(0, 0, W, H); }

  g.restore();
}

/* ═══════════════════════════ arranque ═══════════════════════════ */

function loadLogo(){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => { LOGO = img; res(); };
    img.onerror = () => res();
    img.src = './assets/dcode-mark.png';
  });
}
function loadImages(){
  return Promise.all(IMG_FILES.map((f, i) => new Promise(res => {
    const img = new Image();
    img.onload = () => { IMAGES[i] = img; res(); };
    img.onerror = () => res();
    img.src = './assets/stock-ad8/' + f;
  })));
}

async function boot(){
  await Promise.all([
    document.fonts.load('700 100px "Space Grotesk"'),
    document.fonts.load('500 100px "Space Grotesk"'),
    document.fonts.load('700 100px "JetBrains Mono"'),
    document.fonts.load('500 100px "JetBrains Mono"'),
    document.fonts.load('500 100px Inter'),
    document.fonts.load('700 100px Inter')
  ]);
  await document.fonts.ready;
  await loadLogo();
  await loadImages();

  if (FRAME !== null){
    render(FRAME);
    window.__ready = true;
  } else {
    document.body.classList.add('preview');
    const t0 = performance.now();
    const loop = () => { render(((performance.now() - t0) / 1000) % (DUR + 1.2)); requestAnimationFrame(loop); };
    loop();
  }
}

window.__render = render;
boot();
})();
</script>
</body>
</html>
