<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>D-Code Partners — Anuncio 3 · DCode OS</title>
<!--
  Anuncio 3 — 18 s. Teaser de DCode OS, el sistema operativo interno de
  D-Code Partners (panel de Dirección + portal de cliente).

  Fuente de la terminología y del diseño: repositorio diegoydimitry-ctrl/dcode-os
  (app/globals.css — mismos tokens de marca que esta web, uno a uno — y las
  páginas reales de Proyectos/Actividad/Incidencias). El producto está
  construido y verificado en local pero NO desplegado en ningún sitio
  todavía, así que esta pieza no promete disponibilidad: es un anuncio de
  "así vas a ver tu proyecto", no un "entra ya".

  Render determinista, mismo motor que ad.html/ad2.html: todo se deriva de
  render(t). Mismos parámetros de URL (?fmt=9x16|16x9, ?t=segundos).
-->
<style>
  @font-face{ font-family:'Inter'; font-weight:400 800; font-display:block;
    src:url('../../assets/fonts/inter-variable.woff2') format('woff2'); }
  @font-face{ font-family:'Space Grotesk'; font-weight:500 700; font-display:block;
    src:url('../../assets/fonts/spacegrotesk-variable.woff2') format('woff2'); }
  @font-face{ font-family:'JetBrains Mono'; font-weight:400 700; font-display:block;
    src:url('../../assets/fonts/jetbrainsmono-variable.woff2') format('woff2'); }
  html,body{ margin:0; padding:0; background:#000; overflow:hidden; }
  #stage{ display:block; }
  body.preview{ display:flex; align-items:center; justify-content:center; height:100vh; }
  body.preview #stage{ max-width:100vw; max-height:100vh; width:auto; height:auto; object-fit:contain; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(() => {
'use strict';

const Q     = new URLSearchParams(location.search);
const FMT   = Q.get('fmt') === '16x9' ? '16x9' : '9x16';
const FRAME = Q.has('t') ? parseFloat(Q.get('t')) : null;
const DUR   = 18.0;

const cv = document.getElementById('stage');
const W  = FMT === '9x16' ? 1080 : 1920;
const H  = FMT === '9x16' ? 1920 : 1080;
cv.width = W; cv.height = H;
cv.style.width = W + 'px'; cv.style.height = H + 'px';
const g = cv.getContext('2d', { alpha:false });

const V  = H > W;
const CX = W / 2, CY = H / 2;
const CW = V ? W * 0.86 : W * 0.60;

/* Tokens reales de dcode-os/app/globals.css — la misma marca que esta web,
   con los niveles de superficie propios del producto (surface-0..3). */
const C = {
  bg:'#06080d', s0:'#06080d', s1:'#0e1320', s2:'#141c30', s3:'#1b2542',
  borderSubtle:'#171d2c', border:'#1e2536', borderStrong:'#2a3350',
  ink:'#eef2fb', stone:'#a7b0c4', stoneSoft:'#8089a0',
  blue:'#5b8cff', blue300:'#93b4ff', blue600:'#2f5ed6',
  cyan:'#43e0ff', cyan300:'#7ceaff',
  green:'#34e7a4', green300:'#7cf3c6',
  amber:'#ffb454', amber300:'#ffd08f',
  red:'#ff6b6b', red300:'#ffa3a3',
  violet:'#9b6bff', violet300:'#c3a6ff'
};

/* ─────────────────────────── utilidades ─────────────────────────── */

const clamp = (v,a=0,b=1) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b - a) * t;
const easeOut      = t => 1 - Math.pow(1 - t, 3);
const easeOutQuint = t => 1 - Math.pow(1 - t, 5);
const easeInOut    = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const easeOutBack  = t => { const c=1.70158, s=c+1; return 1 + s*Math.pow(t-1,3) + c*Math.pow(t-1,2); };
const easeInPower4  = t => t*t*t*t;
const easeOutPower4 = t => 1 - Math.pow(1 - t, 4);
const ramp = (t,a,b,fn=easeOut) => fn(clamp((t - a) / (b - a)));
const win  = (t,a,b,c,d) => Math.min(ramp(t,a,b), 1 - ramp(t,c,d));

/* Corte entre escenas (cut-the-curve, motion-doctrine) — igual que en
   ad.html/ad2.html: velocidad emparejada en vez de crossfade. */
const CUT_TRAVEL = 0.12;
const CUT_DUR    = 0.30;
function cutOffsetX(localT, sceneDur, isFirst, isLast){
  const travel = CUT_TRAVEL * W;
  if (!isLast && sceneDur - localT < CUT_DUR){
    const p = easeInPower4(clamp((localT - (sceneDur - CUT_DUR)) / CUT_DUR));
    return -travel * p;
  }
  if (!isFirst && localT < CUT_DUR){
    const p = easeOutPower4(clamp(localT / CUT_DUR));
    return travel * (1 - p);
  }
  return 0;
}

function rgba(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
const FAM = { sg:'"Space Grotesk"', in:'Inter', mo:'"JetBrains Mono"' };
function font(fam, weight, size, letter=0){
  g.font = `${weight} ${size}px ${FAM[fam]}`;
  g.letterSpacing = `${letter}px`;
}
function roundRect(x,y,w,h,r){ g.beginPath(); g.roundRect(x,y,w,h,r); }
function wrap(text, maxW){
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words){
    const test = line ? line + ' ' + w : w;
    if (g.measureText(test).width > maxW && line){ lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
function centeredLines(lines, cx, top, lh, prog, rise = 30){
  for (let i = 0; i < lines.length; i++){
    const p = clamp((prog - i * 0.10) / (1 - Math.min(0.5, lines.length * 0.10)));
    const e = easeOutQuint(p);
    g.save(); g.globalAlpha = e;
    g.fillText(lines[i], cx, top + i * lh + (1 - e) * rise);
    g.restore();
  }
}

/* ─────────────────────────── fondo y viñeta ─────────────────────────── */

function background(t){
  g.fillStyle = C.s0; g.fillRect(0, 0, W, H);
  const gy = CY - H * 0.08;
  const rg = g.createRadialGradient(CX, gy, 0, CX, gy, Math.max(W, H) * 0.7);
  rg.addColorStop(0, rgba(C.blue, 0.14));
  rg.addColorStop(0.5, rgba(C.blue, 0.05));
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);

  const step = 84, drift = (t * 4) % step;
  g.strokeStyle = rgba(C.border, 0.5);
  g.lineWidth = 1; g.beginPath();
  for (let x = -step + drift; x < W + step; x += step){ g.moveTo(x+.5, 0); g.lineTo(x+.5, H); }
  for (let y = -step + drift; y < H + step; y += step){ g.moveTo(0, y+.5); g.lineTo(W, y+.5); }
  g.stroke();
}
function vignette(){
  const rg = g.createRadialGradient(CX, CY, Math.min(W,H)*0.32, CX, CY, Math.max(W,H)*0.78);
  rg.addColorStop(0, 'rgba(0,0,0,0)');
  rg.addColorStop(1, 'rgba(0,0,0,0.68)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
}

/* ─────────────────────────── superficies UI ─────────────────────────── */

/** Tarjeta con la sombra/borde reales del design system (shadow-raised). */
function panel(x, y, w, h, r = 14, surface = C.s1){
  g.save();
  g.shadowColor = 'rgba(3,5,10,.7)'; g.shadowBlur = 44; g.shadowOffsetY = 20;
  roundRect(x, y, w, h, r);
  g.fillStyle = surface; g.fill();
  g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0;
  g.strokeStyle = rgba(C.blue, .14); g.lineWidth = 1;
  g.stroke();
  g.strokeStyle = C.border; g.lineWidth = 1;
  roundRect(x, y, w, h, r); g.stroke();
  g.restore();
}

/** Badge de estado (StatusBadge/SeverityBadge reales). */
function badge(x, y, label, tone, alpha = 1){
  const tones = {
    brand:  [C.blue,  rgba(C.blue,  .16)],
    success:[C.green, rgba(C.green, .16)],
    warning:[C.amber, rgba(C.amber, .16)],
    critical:[C.red,  rgba(C.red,   .16)],
    demo:   [C.violet,rgba(C.violet,.18)]
  };
  const [fg, bgc] = tones[tone];
  font('mo', 700, 18, 1.2);
  const w = g.measureText(label).width + 30, h = 30;
  g.save(); g.globalAlpha = alpha;
  roundRect(x, y, w, h, 15);
  g.fillStyle = bgc; g.fill();
  g.strokeStyle = rgba(fg, .55); g.lineWidth = 1.2; g.stroke();
  g.fillStyle = fg; g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText(label, x + 15, y + h/2 + 1);
  g.restore();
  return w;
}

/** Icono de check dentro de un círculo — reutilizado en varias escenas. */
function checkDot(x, y, r, color, alpha = 1){
  g.save(); g.globalAlpha = alpha;
  g.beginPath(); g.arc(x, y, r, 0, Math.PI*2);
  g.fillStyle = rgba(color, .16); g.fill();
  g.strokeStyle = rgba(color, .7); g.lineWidth = 1.4; g.stroke();
  g.beginPath();
  g.moveTo(x - r*0.42, y); g.lineTo(x - r*0.1, y + r*0.4); g.lineTo(x + r*0.48, y - r*0.38);
  g.strokeStyle = color; g.lineWidth = 2.2; g.lineCap = 'round'; g.lineJoin = 'round'; g.stroke();
  g.restore();
}

/* ══════════════════ ESCENA 1 — hook (0.0 – 1.9) ══════════════════ */

function s1(t){
  const dur = 1.9;
  const out = 1 - ramp(t, dur - 0.30, dur, easeInOut);
  const lines = ['¿QUÉ ESTÁ PASANDO', 'AHORA MISMO', 'CON TU PROYECTO?'];
  const size = V ? 66 : 70;
  font('sg', 700, size, -0.5);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const lh = size * 1.16;
  const top = CY - (lines.length - 1) * lh / 2;
  g.save(); g.globalAlpha = out;
  g.fillStyle = C.ink;
  g.shadowColor = 'rgba(6,8,13,.9)'; g.shadowBlur = 30;
  lines.forEach((ln, i) => {
    const at = 0.12 + i * 0.16;
    const p = ramp(t, at, at + 0.30, easeOutQuint);
    if (p <= 0) return;
    g.save(); g.globalAlpha = out * p;
    g.translate(0, (1 - p) * 46);
    g.fillText(ln, CX, top + i * lh);
    g.restore();
  });
  g.restore();
}

/* ══════════════════ ESCENA 2 — Proyecto (1.9 – 5.6) ══════════════════ */

function s2(t){
  const dur = 3.7;
  const inn = ramp(t, 0, 0.10, easeInOut);
  const out = 1 - ramp(t, dur - 0.10, dur, easeInOut);
  const a = inn * out;

  const w = V ? W * 0.84 : W * 0.46, h = V ? 430 : 400;
  const x = CX - w/2, y = CY - h/2 - (V ? H*0.06 : 0);
  const p = ramp(t, 0.10, 0.55, easeOutQuint);

  g.save(); g.globalAlpha = a * p;
  g.translate(0, (1 - p) * 26);
  panel(x, y, w, h, 16);

  // Cabecera: organización + chip DEMO real del producto
  font('mo', 700, 18, 1.4);
  g.fillStyle = C.stoneSoft; g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText('EMPRESA DEMO S.L.', x + 28, y + 40);
  const dw = badge(x + w - 96, y + 24, 'DEMO', 'demo', ramp(t, 0.55, 0.85, easeOutBack) * a * p);

  // Título del proyecto
  font('sg', 700, V ? 34 : 32, -0.3);
  g.fillStyle = C.ink; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  const tp = ramp(t, 0.25, 0.6, easeOutQuint);
  g.save(); g.globalAlpha = a * p * tp; g.translate(0, (1-tp)*14);
  g.fillText('Automatización de facturación', x + 28, y + 96);
  g.restore();

  // Badge de estado
  const bp = clamp(ramp(t, 0.60, 0.95, easeOutBack));
  if (bp > 0.001) badge(x + 28, y + 116, 'EN CURSO', 'brand', bp * a * p);

  // Barra de progreso: 6/10 tareas — mismo criterio que la ficha real
  // (el avance sale del recuento de tareas completadas, no es decorativo).
  const barY = y + 190;
  font('mo', 700, 17, 1);
  g.fillStyle = C.stoneSoft; g.textAlign = 'left';
  const lp = ramp(t, 1.0, 1.3, easeOut);
  g.save(); g.globalAlpha = a * p * lp;
  g.fillText('AVANCE · 6 DE 10 TAREAS', x + 28, barY - 16);
  roundRect(x + 28, barY, w - 56, 10, 5);
  g.fillStyle = C.s3; g.fill();
  const fillW = (w - 56) * 0.6 * ramp(t, 1.15, 2.1, easeOutQuint);
  roundRect(x + 28, barY, fillW, 10, 5);
  const grd = g.createLinearGradient(x+28, 0, x+28+w-56, 0);
  grd.addColorStop(0, C.cyan); grd.addColorStop(1, C.blue);
  g.fillStyle = grd; g.fill();
  g.restore();

  // Filas de tareas resumidas
  const rows = [
    ['Conectar CRM con WhatsApp', true],
    ['Configurar respuestas automáticas', true],
    ['Sincronizar calendario', false]
  ];
  rows.forEach((r, i) => {
    const rp = ramp(t, 1.5 + i * 0.16, 1.85 + i * 0.16, easeOutQuint);
    if (rp <= 0) return;
    const ry = barY + 46 + i * 44;
    g.save(); g.globalAlpha = a * p * rp; g.translate(0, (1-rp)*14);
    // checkDot() fija su propio globalAlpha (no lo multiplica), así que el
    // valor compuesto tiene que calcularse aquí y pasarse explícito —
    // heredar el del contexto exterior lo pisaría con su valor por defecto.
    checkDot(x + 42, ry, 11, r[1] ? C.green : C.stoneSoft, (r[1] ? 1 : 0.4) * a * p * rp);
    font('in', 500, 21, 0);
    g.fillStyle = r[1] ? C.stone : C.stoneSoft;
    g.textAlign = 'left'; g.textBaseline = 'middle';
    g.fillText(r[0], x + 64, ry + 1);
    g.restore();
  });
  g.restore();

  // Rótulo
  const cap = 'TU PROYECTO. EN TIEMPO REAL.';
  const cy2 = V ? H * 0.815 : H * 0.87;
  const cp = ramp(t, 2.2, 2.6, easeOutQuint);
  font('sg', 700, V ? 46 : 44, -0.3);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.save(); g.globalAlpha = a * cp;
  g.fillStyle = C.ink; g.shadowColor = 'rgba(6,8,13,.9)'; g.shadowBlur = 24;
  g.fillText(cap, CX, cy2);
  g.restore();
}

/* ══════════════════ ESCENA 3 — Actividad (5.6 – 9.4) ══════════════════ */

const FEED = [
  ['Tarea completada', 'Conectar CRM con WhatsApp', 'hace 12 min', 'success'],
  ['Documento añadido', 'Contrato de servicio firmado', 'hace 48 min', 'brand'],
  ['Incidencia resuelta', 'Retraso en la sincronización', 'hace 2 h', 'success'],
  ['Comentario nuevo', 'Revisión de alcance — Producción', 'hace 3 h', 'brand']
];

function s3(t){
  const dur = 3.8;
  const inn = ramp(t, 0, 0.10, easeInOut);
  const out = 1 - ramp(t, dur - 0.10, dur, easeInOut);
  const a = inn * out;

  const w = V ? W * 0.86 : W * 0.50;
  const rowH = V ? 118 : 104;
  const h = FEED.length * rowH + 70;
  const x = CX - w/2, y = CY - h/2 - (V ? H*0.05 : 0);

  g.save(); g.globalAlpha = a;
  panel(x, y, w, h, 16);

  font('mo', 700, 19, 1.6);
  g.fillStyle = C.stoneSoft; g.textAlign = 'left'; g.textBaseline = 'middle';
  const hp = ramp(t, 0.05, 0.35, easeOut);
  g.save(); g.globalAlpha = a * hp;
  g.fillText('ACTIVIDAD · EMPRESA DEMO S.L.', x + 26, y + 40);
  g.restore();

  FEED.forEach((f, i) => {
    const at = 0.35 + i * 0.22;
    const p = ramp(t, at, at + 0.30, easeOutPower4);
    if (p <= 0) return;
    const ry = y + 70 + i * rowH + rowH/2 - 14;
    g.save();
    g.globalAlpha = a * clamp(p);
    g.translate(0, (1 - p) * 34);            // llegada desde abajo (waterfall entry)
    checkDot(x + 40, ry + 4, 13, f[3] === 'success' ? C.green : C.blue, a * clamp(p));
    font('sg', 700, V ? 25 : 24, -0.2);
    g.fillStyle = C.ink; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    g.fillText(f[0], x + 68, ry - 2);
    font('in', 500, 19, 0);
    g.fillStyle = C.stone;
    g.fillText(f[1], x + 68, ry + 26);
    font('mo', 400, 16, 0.5);
    g.fillStyle = C.stoneSoft; g.textAlign = 'right';
    g.fillText(f[2], x + w - 26, ry - 2);
    if (i < FEED.length - 1){
      g.beginPath();
      g.moveTo(x + 26, y + 70 + (i+1) * rowH);
      g.lineTo(x + w - 26, y + 70 + (i+1) * rowH);
      g.strokeStyle = rgba(C.borderSubtle, 1); g.lineWidth = 1; g.stroke();
    }
    g.restore();
  });
  g.restore();

  const cap = 'CADA CAMBIO, A LA VISTA.';
  const cy2 = V ? H * 0.85 : H * 0.87;
  const cp = ramp(t, 2.35, 2.75, easeOutQuint);
  font('sg', 700, V ? 46 : 44, -0.3);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.save(); g.globalAlpha = a * cp;
  g.fillStyle = C.ink; g.shadowColor = 'rgba(6,8,13,.9)'; g.shadowBlur = 24;
  g.fillText(cap, CX, cy2);
  g.restore();
}

/* ══════════════════ ESCENA 4 — Incidencia resuelta (9.4 – 12.6) ══════════════════ */

function s4(t){
  const dur = 3.2;
  const inn = ramp(t, 0, 0.10, easeInOut);
  const out = 1 - ramp(t, dur - 0.10, dur, easeInOut);
  const a = inn * out;

  const w = V ? W * 0.82 : W * 0.42, h = V ? 300 : 280;
  const x = CX - w/2, y = CY - h/2;
  const p = ramp(t, 0.08, 0.4, easeOutQuint);

  g.save(); g.globalAlpha = a * p;
  g.translate(0, (1-p)*22);
  panel(x, y, w, h, 16);

  font('mo', 700, 18, 1.2);
  g.fillStyle = C.stoneSoft; g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText('INCIDENCIA · #2026-114', x + 28, y + 40);

  font('sg', 700, V ? 30 : 29, -0.3);
  g.fillStyle = C.ink; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.fillText('Retraso en la sincronización', x + 28, y + 92);

  // El estado cambia de ABIERTA (rojo) a RESUELTA (verde) a mitad de escena —
  // el momento de la pieza, no una transición de fondo.
  const flip = clamp(ramp(t, 1.35, 1.75, easeOutBack));
  const bx = x + 28, by = y + 122;
  // Umbral real, no ">0": easeOutBack dibuja el mismo cero algebraico como un
  // residuo de coma flotante (~2e-16), que sigue siendo ">0" en JS. La alfa
  // de cada insignia se pasa siempre como argumento propio de badge() — un
  // envoltorio con g.globalAlpha por fuera no sirve, porque el alpha por
  // defecto de badge() lo sobrescribe en vez de multiplicarlo.
  if (flip < 0.999) badge(bx, by, 'ABIERTA', 'critical', (1 - flip) * a * p);
  if (flip > 0.001){
    const s = lerp(0.85, 1, flip);
    g.save();
    g.translate(bx + 100, by + 15);          // escala desde el centro de la insignia
    g.scale(s, s);
    g.translate(-(bx + 100), -(by + 15));
    badge(bx, by, 'RESUELTA EL 14 MAR', 'success', flip * a * p);
    g.restore();
  }

  const cd = clamp(ramp(t, 1.55, 1.95, easeOutBack));
  if (cd > 0.001) checkDot(x + w - 56, by + 14, 20, C.green, cd * a * p);

  font('in', 500, 20, 0);
  g.fillStyle = C.stoneSoft; g.textAlign = 'left'; g.textBaseline = 'middle';
  const dp = ramp(t, 2.0, 2.3, easeOut);
  g.save(); g.globalAlpha = a * p * dp;
  g.fillText('Resolución: reconectado el webhook de calendario.', x + 28, by + 62);
  g.restore();
  g.restore();

  const cap = 'NADA SE QUEDA EN EL AIRE.';
  const cy2 = V ? H * 0.79 : H * 0.86;
  const cp = ramp(t, 2.3, 2.7, easeOutQuint);
  font('sg', 700, V ? 46 : 44, -0.3);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.save(); g.globalAlpha = a * cp;
  g.fillStyle = C.ink; g.shadowColor = 'rgba(6,8,13,.9)'; g.shadowBlur = 24;
  g.fillText(cap, CX, cy2);
  g.restore();
}

/* ══════════════════ ESCENA 5 — módulos (12.6 – 15.0) ══════════════════ */

const MODS = ['PROYECTOS', 'TAREAS', 'INCIDENCIAS', 'DOCUMENTACIÓN', 'ACTIVIDAD'];

function s5(t){
  const dur = 2.4;
  const inn = ramp(t, 0, 0.10, easeInOut);
  const out = 1 - ramp(t, dur - 0.10, dur, easeInOut);
  const a = inn * out;

  const size = V ? 58 : 62;
  font('sg', 700, size, -0.5);
  const lh = size * 1.5;
  const top = CY - (MODS.length - 1) * lh / 2;

  MODS.forEach((m, i) => {
    const at = 0.06 + i * 0.13;
    const p = ramp(t, at, at + 0.26, easeOutPower4);
    if (p <= 0) return;
    g.save();
    g.globalAlpha = a * clamp(p);
    g.translate(lerp(-60, 0, clamp(p)), 0);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = i % 2 === 0 ? C.ink : rgba(C.ink, .55);
    g.shadowColor = 'rgba(6,8,13,.9)'; g.shadowBlur = 20;
    g.fillText(m, CX, top + i * lh);
    g.restore();
  });

  const cap = 'TODO, EN UN SOLO SITIO.';
  const cp = ramp(t, dur - 0.75, dur - 0.35, easeOutQuint);
  if (cp > 0){
    font('mo', 700, V ? 22 : 24, 3);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.save(); g.globalAlpha = a * cp;
    g.fillStyle = C.cyan;
    g.fillText(cap, CX, V ? H * 0.86 : H * 0.90);
    g.restore();
  }
}

/* ══════════════════ ESCENA 6 — cierre (15.0 – 18.0) ══════════════════ */

let LOGO = null;

function s6(t){
  const cover = ramp(t, 0, 0.4, easeInOut);
  g.save(); g.globalAlpha = cover;
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#080c16'); bg.addColorStop(.55, '#0a1020'); bg.addColorStop(1, '#06080d');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const rg = g.createRadialGradient(CX, CY - H*0.05, 0, CX, CY - H*0.05, Math.max(W,H)*0.6);
  rg.addColorStop(0, rgba(C.blue, .22)); rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  g.restore();

  const lp = ramp(t, 0.30, 1.0, easeOutQuint);
  if (lp > 0){
    const logoY = V ? H * 0.38 : CY - 60;
    const iconH = V ? 92 : 88;
    const iconW = LOGO ? iconH * (LOGO.naturalWidth / LOGO.naturalHeight) : iconH * 1.19;

    font('sg', 700, V ? 92 : 96, 0.5);
    const wordW = g.measureText('D-Code').width;
    const x0 = CX - (iconW + 28 + wordW) / 2;

    g.save(); g.globalAlpha = lp; g.translate(0, (1 - lp) * 18);
    if (LOGO){
      g.save(); g.shadowColor = rgba(C.blue, .5); g.shadowBlur = 32;
      g.drawImage(LOGO, x0, logoY - iconH/2, iconW, iconH); g.restore();
    }
    g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    font('sg', 700, V ? 92 : 96, 0.5); g.fillStyle = C.ink;
    g.fillText('D-Code', x0 + iconW + 28, logoY + 13);
    g.restore();

    // Badge "OS" — mismo lenguaje de badge que el resto de la pieza.
    const osp = ramp(t, 0.75, 1.1, easeOutBack);
    if (osp > 0){
      font('sg', 700, V ? 92 : 96, 0.5);
      const bx = x0 + iconW + 28 + wordW + 18;
      const bw = 88, bh = 44, by = logoY - 40;
      g.save();
      g.globalAlpha = clamp(osp);
      g.translate(bx + bw/2, by + bh/2);
      g.scale(lerp(0.7, 1, clamp(osp)), lerp(0.7, 1, clamp(osp)));
      g.translate(-(bx + bw/2), -(by + bh/2));
      roundRect(bx, by, bw, bh, 12);
      g.fillStyle = rgba(C.cyan, .14); g.fill();
      g.strokeStyle = rgba(C.cyan, .6); g.lineWidth = 1.6; g.stroke();
      font('mo', 700, 26, 2);
      g.fillStyle = C.cyan; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText('OS', bx + bw/2, by + bh/2 + 1);
      g.restore();
    }
  }

  const qp = ramp(t, 1.35, 1.85, easeOutQuint);
  if (qp > 0){
    const size = V ? 42 : 44;
    font('sg', 700, size, -0.2);
    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    const lines = wrap('El sistema operativo de D-Code Partners.', V ? W * 0.82 : W * 0.5);
    const lh = size * 1.28;
    const top = V ? H * 0.52 : CY + 66;
    g.fillStyle = C.ink;
    centeredLines(lines, CX, top, lh, qp, 20);
  }

  const mp = ramp(t, 2.1, 2.5, easeOutQuint);
  if (mp > 0){
    font('mo', 700, V ? 26 : 27, 3);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.save(); g.globalAlpha = mp;
    g.fillStyle = C.violet300;
    g.fillText('MUY PRONTO, PARA NUESTROS CLIENTES', CX, V ? H * 0.615 : CY + 128);
    g.restore();
  }

  const dp = ramp(t, 2.55, 2.9, easeOutQuint);
  if (dp > 0){
    const y = V ? H * 0.70 : CY + 210;
    g.save(); g.globalAlpha = dp;
    const lw = 190 * easeOut(dp);
    const grd = g.createLinearGradient(CX - lw/2, 0, CX + lw/2, 0);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(.5, rgba(C.cyan, .85));
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd; g.fillRect(CX - lw/2, y - 1, lw, 2);

    font('mo', 700, V ? 40 : 42, 3);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = C.cyan;
    g.shadowColor = rgba(C.cyan, .4); g.shadowBlur = 24;
    g.fillText('dcodepartners.com', CX, y + (V ? 58 : 56));
    g.restore();
  }
}

/* ══════════════════════════ línea de tiempo ══════════════════════════ */

const SCENES = [
  { a: 0.0,  b: 1.9,  fn: s1 },
  { a: 1.9,  b: 5.6,  fn: s2 },
  { a: 5.6,  b: 9.4,  fn: s3 },
  { a: 9.4,  b: 12.6, fn: s4 },
  { a: 12.6, b: 15.0, fn: s5 },
  { a: 15.0, b: 18.0, fn: s6 }
];

function render(t){
  t = clamp(t, 0, DUR);
  g.save();
  g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.letterSpacing = '0px';

  background(t);

  for (let i = 0; i < SCENES.length; i++){
    const sc = SCENES[i];
    if (t >= sc.a && t < sc.b){
      const localT = t - sc.a;
      const dx = cutOffsetX(localT, sc.b - sc.a, i === 0, i === SCENES.length - 1);
      g.save(); g.translate(dx, 0); sc.fn(localT); g.restore();
    }
  }
  if (t >= DUR - 0.001){ g.save(); s6(DUR - 15.0); g.restore(); }

  vignette();

  const intro = 1 - ramp(t, 0, 0.3, easeInOut);
  if (intro > 0){ g.fillStyle = rgba('#000000', intro); g.fillRect(0, 0, W, H); }
  g.restore();
}

/* ═══════════════════════════ arranque ═══════════════════════════ */

function loadLogo(){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => { LOGO = img; res(); };
    img.onerror = () => res();
    img.src = './assets/dcode-mark.png';
  });
}

async function boot(){
  await Promise.all([
    document.fonts.load('700 100px "Space Grotesk"'),
    document.fonts.load('500 100px "Space Grotesk"'),
    document.fonts.load('700 100px "JetBrains Mono"'),
    document.fonts.load('400 100px "JetBrains Mono"'),
    document.fonts.load('500 100px Inter'),
    document.fonts.load('700 100px Inter')
  ]);
  await document.fonts.ready;
  await loadLogo();

  if (FRAME !== null){
    render(FRAME);
    window.__ready = true;
  } else {
    document.body.classList.add('preview');
    const t0 = performance.now();
    const loop = () => { render(((performance.now() - t0) / 1000) % (DUR + 1.2)); requestAnimationFrame(loop); };
    loop();
  }
}

window.__render = render;
boot();
})();
</script>
